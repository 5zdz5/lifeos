    if (emptyNew) emptyNew.addEventListener('click', () => openEditor(null));

    root.querySelectorAll('.task-card').forEach((card) => {
      const id = card.getAttribute('data-id');
      card.querySelector('[data-act="toggle"]').addEventListener('click', () => {
        const t = S.state.tasks.find((x) => x.id === id);
        S.updateTask(id, { status: t.status === 'done' ? 'todo' : 'done' });
        L.app.refresh();
      });
      const statusSel = card.querySelector('[data-act="status"]');
      statusSel.addEventListener('change', () => { S.updateTask(id, { status: statusSel.value }); L.app.refresh(); });
      card.querySelector('[data-act="edit"]').addEventListener('click', () => openEditor(S.state.tasks.find((x) => x.id === id)));
      card.querySelector('[data-act="del"]').addEventListener('click', async () => {
        if (await U.confirm('确定删除该任务？')) { S.removeTask(id); L.app.refresh(); }
      });
    });
  }

  /* 从总览点具体任务时定位并短暂高亮，而不是只跳到列表顶部 */
  function focusTask(id) {
    local.filter = 'all';
    local.search = '';
    // 自己保证切到任务视图，不依赖调用方先 showView
    if (L.app.current !== 'tasks') L.app.showView('tasks');
    else L.app.refresh();
    requestAnimationFrame(() => {
      const el = Array.prototype.slice.call(document.querySelectorAll('.task-card'))
        .find((x) => x.getAttribute('data-id') === id);
      if (!el) return;
      el.classList.add('task-focus');
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      setTimeout(() => el.classList.remove('task-focus'), 2000);
    });
  }

  L.modules.tasks = { render, bind, focusTask };
})(window.LifeOS);


/* ===== js/modules/habits.js ===== */
/* =========================================================================
 * LifeOS · 习惯打卡模块
 * ========================================================================= */
window.LifeOS = window.LifeOS || {};
LifeOS.modules = LifeOS.modules || {};

(function (L) {
  'use strict';
  const U = L.utils;
  const S = L.store;

  /* 计算连续打卡天数（含今天，向前数） */
  function streak(habit) {
    const c = habit.checkins || {};
    let n = 0;
    let d = new Date();
    while (true) {
      const off = d.getTimezoneOffset() * 60000;
      const key = new Date(d.getTime() - off).toISOString().slice(0, 10);
      if (c[key]) { n++; d.setDate(d.getDate() - 1); }
      else break;
    }
    return n;
  }

  /* 近 30 天完成率 */
  function rate30(habit) {
    const c = habit.checkins || {};
    let done = 0;
    for (let i = 0; i < 30; i++) {
      if (c[U.dateStrOffset(i)]) done++;
    }
    return Math.round((done / 30) * 100);
  }

  function heatmap(habit) {
    let cells = '';
    for (let i = 29; i >= 0; i--) {
      const date = U.dateStrOffset(i);
      const on = (habit.checkins || {})[date];
      cells += '<button class="hm-cell' + (on ? ' on' : '') + '" data-date="' + date + '" title="' + date + (on ? ' · 已打卡' : '') + '" style="' + (on ? 'background:' + U.safeColor(habit.color) + ';border-color:' + U.safeColor(habit.color) + ';' : '') + '"></button>';
    }
    return '<div class="heatmap">' + cells + '</div>';
  }

  function habitCard(h) {
    const st = streak(h);
    const rt = rate30(h);
    const todayOn = (h.checkins || {})[U.todayStr()];
    return '' +
      '<div class="habit-card" data-id="' + U.escapeHtml(h.id) + '" style="--hc:' + U.safeColor(h.color) + '">' +
      '  <div class="habit-head">' +
      '    <span class="habit-emoji">' + U.escapeHtml(h.emoji || '◆') + '</span>' +
      '    <div class="habit-name">' + U.escapeHtml(h.name) + '</div>' +
      '    <button class="icon-btn" data-act="edit" title="编辑">✎</button>' +
      '    <button class="icon-btn danger" data-act="del" title="删除">×</button>' +
      '  </div>' +
      '  <div class="habit-stats">' +
      '    <div class="stat"><div class="stat-num">' + st + '</div><div class="stat-label">连续天数</div></div>' +
      '    <div class="stat"><div class="stat-num">' + rt + '%</div><div class="stat-label">30天完成率</div></div>' +
      '  </div>' +
      heatmap(h) +
      '  <button class="btn ' + (todayOn ? 'ghost' : 'primary') + ' checkin-btn" data-act="today">' +
      (todayOn ? '✓ 今日已打卡（点击取消）' : '今日打卡') + '</button>' +
      '</div>';
  }

  function render() {
    const habits = S.state.habits;
    return '' +
      '<div class="page">' +
      '  <div class="toolbar">' +
      '    <div class="page-sub">坚持微小习惯，积累长期复利 ◆</div>' +
      '    <div class="spacer"></div>' +
      '    <button class="btn primary" id="add-habit">+ 新建习惯</button>' +
      '  </div>' +
      '  <div class="habit-grid">' +
      habits.map(habitCard).join('') +
      (habits.length === 0 ? '<div class="empty">还没有习惯，创建一个开始你的打卡之旅吧。<button class="empty-state-btn" id="empty-new-habit">＋ 新建习惯</button></div>' : '') +
      '  </div>' +
      '</div>';
  }

  function openEditor(habit) {
    const isNew = !habit;
    const h = habit || { name: '', emoji: '◆', color: '#176c6b' };
    U.modal({
      title: isNew ? '新建习惯' : '编辑习惯',
      bodyHTML: '' +
        '<div class="form">' +
        '  <div class="form-row">' +
        '    <div style="flex:0 0 72px"><label>图标</label><input id="f-emoji" class="input" value="' + U.escapeHtml(h.emoji || '◆') + '" maxlength="2" title="填 1 个字符作为图标"/>' +
        '      <span class="form-hint">1 个字符</span></div>' +
        '    <div style="flex:1"><label>名称</label><input id="f-name" class="input" value="' + U.escapeHtml(h.name) + '" placeholder="如：阅读 30 分钟"/></div>' +
        '  </div>' +
        '  <label>颜色</label><input id="f-color" class="input" type="color" value="' + U.escapeHtml(h.color || '#176c6b') + '"/>' +
        '  <span class="form-hint">默认是本应用主题色，点色条可自定义。</span>' +
        '  <div class="modal-actions"><button class="btn ghost" data-act="cancel">取消</button>' +
        '    <button class="btn primary" data-act="save">保存</button></div>' +
        '</div>',
      onMount(root, close) {
        root.querySelector('[data-act="save"]').addEventListener('click', () => {
          const name = root.querySelector('#f-name').value.trim();
          if (!name) { U.toast('请填写名称', 'error'); return; }
          const patch = { name, emoji: root.querySelector('#f-emoji').value || '◆', color: root.querySelector('#f-color').value };
          if (isNew) S.addHabit(patch); else S.updateHabit(h.id, patch);
          U.toast(isNew ? '已创建习惯' : '已保存');
          close();
          L.app.refresh();
        });
        root.querySelector('[data-act="cancel"]').addEventListener('click', close);
      }
    });
  }

  function bind(root) {
    root.querySelector('#add-habit').addEventListener('click', () => openEditor(null));
    const emptyNew = root.querySelector('#empty-new-habit');
    if (emptyNew) emptyNew.addEventListener('click', () => openEditor(null));
    root.querySelectorAll('.habit-card').forEach((card) => {
      const id = card.getAttribute('data-id');
      card.querySelector('[data-act="today"]').addEventListener('click', () => { S.toggleHabitCheckin(id, U.todayStr()); L.app.refresh(); });
      card.querySelector('[data-act="edit"]').addEventListener('click', () => openEditor(S.state.habits.find((x) => x.id === id)));
      card.querySelector('[data-act="del"]').addEventListener('click', async () => {
        if (await U.confirm('确定删除该习惯？打卡记录将一并清除。')) { S.removeHabit(id); L.app.refresh(); }
      });
      card.querySelectorAll('.hm-cell').forEach((cell) => {
        cell.addEventListener('click', () => { S.toggleHabitCheckin(id, cell.getAttribute('data-date')); L.app.refresh(); });
      });
    });
  }

  L.modules.habits = { render, bind };
})(window.LifeOS);


/* ===== js/modules/notes.js ===== */
/* =========================================================================
 * LifeOS · 笔记日记模块（含 Obsidian 风格双向链接）
 * - 正文支持 [[笔记标题]] / [[标题|别名]]
 * - 预览中点击链接跳转；目标不存在时一键创建同名笔记
 * - 编辑器显示「出链」「反向链接」面板
 * ========================================================================= */
window.LifeOS = window.LifeOS || {};
LifeOS.modules = LifeOS.modules || {};

(function (L) {
  'use strict';
  const U = L.utils;
  const S = L.store;
  const LK = L.links;

  // W2：第三视图 'daily' 复用 L.modules.daily 的面板；不新增顶层实体 / 导航
  const local = { view: 'list', currentId: null, search: '', dailyDate: null };

  /* 供知识图谱等模块跳转到某篇笔记 */
  function open(id) {
    if (!S.state.notes.some((n) => n.id === id)) return;
    local.view = 'editor';
    local.currentId = id;
    L.app.showView('notes');
  }

  function showList() { local.view = 'list'; }
  function showDaily(date) {
    local.view = 'daily';
    local.dailyDate = date || U.todayStr();
    if (L.modules.daily) L.modules.daily.setDate(local.dailyDate);
    L.app.showView('notes');
  }

  /* 打开指定标题的笔记；不存在则创建并打开 */
  function openByTitle(title) {
    const found = LK.resolve(title);
    if (found) { open(found.id); return; }
    const n = S.addNote({ title: title, body: '', tags: [] });
    U.toast('已创建笔记「' + title + '」');
    open(n.id);
  }

  function listView() {
    const notes = S.state.notes
      .filter((n) => {
        if (!local.search) return true;
        const q = local.search.toLowerCase();
        return (n.title + ' ' + (n.body || '') + ' ' + (n.tags || []).join(' ')).toLowerCase().indexOf(q) >= 0;
      })
      .sort((a, b) => b.updatedAt - a.updatedAt);

    const cards = notes.map((n) => {
      const linkCount = LK.extract(n.body).length;
      const backCount = LK.backlinks(n).length;
      const preview = (n.body || '').replace(/[#>*`\-\[\]]/g, '').slice(0, 80);
      return '' +
        '<div class="note-card" data-id="' + n.id + '">' +
        '  <div class="note-title">' + U.escapeHtml(n.title) + '</div>' +
        '  <div class="note-preview">' + U.escapeHtml(preview || '（空笔记）') + '</div>' +
        '  <div class="note-foot">' +
        '    <span class="note-date">' + new Date(n.updatedAt).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + '</span>' +
        (linkCount ? '<span class="tag link-tag">↗ ' + linkCount + '</span>' : '') +
        (backCount ? '<span class="tag back-tag">↩ ' + backCount + '</span>' : '') +
        (n.tags || []).map((t) => '<span class="tag">#' + U.escapeHtml(t) + '</span>').join('') +
        '  </div>' +
        '</div>';
    }).join('');

    return '' +
      '<div class="page">' +
      '  <div class="toolbar">' +
      '    <div class="page-sub">记录想法、日记与知识沉淀 · 用 [[笔记标题]] 建立双向链接 ✎</div>' +
      '    <div class="spacer"></div>' +
      '    <input class="search" id="note-search" placeholder="搜索笔记…" value="' + U.escapeHtml(local.search) + '"/>' +
      '    <button class="btn ghost" id="note-daily" title="按日聚合日程、活动与笔记">▦ 每日笔记</button>' +
      '    <button class="btn ghost" id="note-import-md" title="从 .md 文件导入笔记">↑ 导入 .md</button>' +
      '    <button class="btn ghost" id="note-export-md" title="把全部笔记导出为 .md">↓ 导出 .md</button>' +
      '    <input type="file" id="note-md-file" accept=".md,.markdown,text/markdown,text/plain" multiple style="display:none" />' +
      '    <button class="btn primary" id="new-note">+ 新建笔记</button>' +
      '  </div>' +
      '  <div class="note-grid">' + cards +
      (notes.length === 0 ? '<div class="empty">还没有笔记，写下第一篇吧。<button class="empty-state-btn" id="empty-new-note">＋ 新建笔记</button></div>' : '') +
      '  </div>' +
      '</div>';
  }

  function editorView() {
    const n = S.state.notes.find((x) => x.id === local.currentId);
    if (!n) { local.view = 'list'; return listView(); }

    // 出链
    const outs = LK.outbound(n).map((o) =>
      '<button class="link-item ' + (o.note ? 'exists' : 'missing') + '" data-wiki="' + U.escapeHtml(o.title) + '">' +
      '<span class="li-icon">' + (o.note ? '↗' : '＋') + '</span>' +
      '<span>' + U.escapeHtml(o.title) + '</span>' +
      '<span class="li-hint">' + (o.note ? '打开' : '点击创建') + '</span></button>'
    ).join('') || '<div class="link-empty">在正文输入 [[笔记标题]] 即可建立链接</div>';

    // 反向链接（W2 · B1）：带引用原文上下文，点标题跳转
    const backCtx = LK.backlinkContexts(n);
    const backs = backCtx.map((b) =>
      '<div class="back-card" data-open="' + U.escapeHtml(b.note.id) + '">' +
      '  <div class="bc-title"><span class="li-icon">↩</span>' + U.escapeHtml(b.note.title) + '<span class="li-hint">打开</span></div>' +
      b.snippets.map((s) => '<div class="bc-snippet">' + U.escapeHtml(s) + '</div>').join('') +
      '</div>'
    ).join('') || '<div class="link-empty">还没有其他笔记链接到这里</div>';

    // 未链接提及（W2 · B1）：正文提到本标题但没用 [[ ]]，可一键转成链接
    const mentions = LK.unlinkedMentions(n);
    const mentionHTML = mentions.length
      ? '<div class="link-panel mention-panel"><div class="lp-head">未链接的提及 · ' + mentions.length + '</div>' +
        mentions.map((m) =>
          '<div class="mention-item" data-linkify="' + U.escapeHtml(m.note.id) + '">' +
          '  <div class="mi-title">◇ ' + U.escapeHtml(m.note.title) + '</div>' +
          '  <div class="mi-snippet">' + U.escapeHtml(m.snippet) + '</div>' +
          '  <button class="btn ghost btn-xs mi-btn">＋ 转为链接</button>' +
          '</div>').join('') + '</div>'
      : '';

    return '' +
      '<div class="page editor-page">' +
      '  <div class="toolbar">' +
      '    <button class="btn ghost" id="back">← 返回</button>' +
      '    <button class="btn ghost" id="insert-link">↗ 插入链接</button>' +
      '    <button class="btn ghost" id="e-export-md" title="导出为 Markdown 文件">↓ .md</button>' +
      '    <div class="spacer"></div>' +
      '    <span class="save-state ok" id="e-save-state">已自动保存</span>' +
      '    <button class="btn primary btn-xs" id="e-save">保存</button>' +
      '    <button class="btn ghost danger" id="del">删除</button>' +
      '  </div>' +
      '  <div class="editor-wrap">' +
      '    <div class="editor-left">' +
      '      <input id="e-title" class="input title-input" value="' + U.escapeHtml(n.title) + '" placeholder="标题"/>' +
      '      <input id="e-tags" class="input" value="' + U.escapeHtml((n.tags || []).join(', ')) + '" placeholder="标签（逗号分隔）"/>' +
      '      <textarea id="e-body" class="input editor-area" placeholder="支持 Markdown 与 [[双向链接]]…">' + U.escapeHtml(n.body || '') + '</textarea>' +
      '    </div>' +
      '    <div class="editor-right">' +
      '      <div class="preview-label">预览</div>' +
      '      <div class="markdown-body" id="e-preview"></div>' +
      '      <div class="link-panels">' +
      '        <div class="link-panel"><div class="lp-head">出链 · ' + LK.extract(n.body).length + '</div>' + outs + '</div>' +
      '        <div class="link-panel"><div class="lp-head">反向链接 · ' + LK.backlinks(n).length + '</div>' + backs + '</div>' +
      '        ' + mentionHTML +
      '      </div>' +
      '    </div>' +
      '  </div>' +
      '</div>';
  }

  function render() {
    if (local.view === 'editor') return editorView();
    if (local.view === 'daily' && L.modules.daily) {
      return L.modules.daily.renderPanel(local.dailyDate || U.todayStr());
    }
    return listView();
  }

  /* 下载文本文件（.md 导出复用），走 Blob + a[download]，与备份导出同口径 */
  function downloadText(filename, text) {
    const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return filename;
  }

  function bind(root) {
    if (local.view === 'editor') { bindEditor(root); return; }
    if (local.view === 'daily' && L.modules.daily) { L.modules.daily.bindPanel(root, local.dailyDate || U.todayStr()); return; }
    const search = root.querySelector('#note-search');
    if (search) search.addEventListener('input', U.debounce(() => { local.search = search.value; L.app.refresh(); }, 250));
    const createNote = () => {
      const n = S.addNote({ title: '无标题笔记', body: '', tags: [] });
      local.view = 'editor'; local.currentId = n.id;
      L.app.refresh();
    };
    root.querySelector('#new-note').addEventListener('click', createNote);
    const emptyNew = root.querySelector('#empty-new-note');
    if (emptyNew) emptyNew.addEventListener('click', createNote);
    root.querySelectorAll('.note-card').forEach((card) => {
      card.addEventListener('click', () => { local.view = 'editor'; local.currentId = card.getAttribute('data-id'); L.app.refresh(); });
    });

    /* W2 · B2 每日笔记入口 */
    const dailyBtn = root.querySelector('#note-daily');
    if (dailyBtn) dailyBtn.addEventListener('click', () => showDaily(U.todayStr()));

    /* W2 · B3 导入 / 导出 .md */
    const fileInput = root.querySelector('#note-md-file');
    root.querySelector('#note-import-md').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      const files = Array.from(fileInput.files || []);
      if (!files.length) return;
      let added = 0;
      for (const f of files) {
        try {
          const text = await f.text();
          const note = L.vault.markdownToNote(text, f.name);
          S.addNote(note);
          added++;
        } catch (e) { /* 单个文件失败不阻断其余 */ }
      }
      fileInput.value = '';
      U.toast('已导入 ' + added + ' 篇 .md 笔记');
      L.app.refresh();
    });
    root.querySelector('#note-export-md').addEventListener('click', () => {
      const files = L.vault.exportNotes(S.state.notes);
      if (!files.length) { U.toast('还没有笔记可导出', 'error'); return; }
      // 逐个下载（浏览器会批量询问）；无打包依赖，保持零依赖
      files.forEach((f) => downloadText(f.filename, f.content));
      U.toast('已导出 ' + files.length + ' 篇 .md');
    });
  }

  function bindEditor(root) {
    const id = local.currentId;
    const n = S.state.notes.find((x) => x.id === id);
    const body = root.querySelector('#e-body');
    const preview = root.querySelector('#e-preview');
    const title = root.querySelector('#e-title');
    const tags = root.querySelector('#e-tags');

    // 局部刷新链接面板，避免整页重绘打断输入焦点（W2 · B1 增强版）
    function refreshLinkPanels() {
      const cur = S.state.notes.find((x) => x.id === id);
      if (!cur) return;
      const outs = LK.outbound(cur).map((o) =>
        '<button class="link-item ' + (o.note ? 'exists' : 'missing') + '" data-wiki="' + U.escapeHtml(o.title) + '">' +
        '<span class="li-icon">' + (o.note ? '↗' : '＋') + '</span><span>' + U.escapeHtml(o.title) + '</span>' +
        '<span class="li-hint">' + (o.note ? '打开' : '点击创建') + '</span></button>'
      ).join('') || '<div class="link-empty">在正文输入 [[笔记标题]] 即可建立链接</div>';
      const backCtx = LK.backlinkContexts(cur);
      const backs = backCtx.map((b) =>
        '<div class="back-card" data-open="' + U.escapeHtml(b.note.id) + '">' +
        '  <div class="bc-title"><span class="li-icon">↩</span>' + U.escapeHtml(b.note.title) + '<span class="li-hint">打开</span></div>' +
        b.snippets.map((s) => '<div class="bc-snippet">' + U.escapeHtml(s) + '</div>').join('') +
        '</div>'
      ).join('') || '<div class="link-empty">还没有其他笔记链接到这里</div>';
      const mentions = LK.unlinkedMentions(cur);
      const mentionHTML = mentions.length
        ? '<div class="link-panel mention-panel"><div class="lp-head">未链接的提及 · ' + mentions.length + '</div>' +
          mentions.map((m) =>
            '<div class="mention-item" data-linkify="' + U.escapeHtml(m.note.id) + '">' +
            '  <div class="mi-title">◇ ' + U.escapeHtml(m.note.title) + '</div>' +
            '  <div class="mi-snippet">' + U.escapeHtml(m.snippet) + '</div>' +
            '  <button class="btn ghost btn-xs mi-btn">＋ 转为链接</button>' +
            '</div>').join('') + '</div>'
        : '';
      const wrap = root.querySelector('.link-panels');
      if (!wrap) return;
      wrap.innerHTML =
        '<div class="link-panel"><div class="lp-head">出链 · ' + LK.extract(cur.body).length + '</div>' + outs + '</div>' +
        '<div class="link-panel"><div class="lp-head">反向链接 · ' + LK.backlinks(cur).length + '</div>' + backs + '</div>' +
        mentionHTML;
      bindLinkPanelClicks(wrap);
    }

    /* 链接面板点击：出链跳转 / 反链卡片跳转 / 未链接提及一键转链接 */
    function bindLinkPanelClicks(scope) {
      scope.querySelectorAll('.link-item').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (btn.hasAttribute('data-open')) open(btn.getAttribute('data-open'));
          else openByTitle(btn.getAttribute('data-wiki'));
        });
      });
      scope.querySelectorAll('.back-card[data-open]').forEach((card) => {
        card.addEventListener('click', () => open(card.getAttribute('data-open')));
      });
      scope.querySelectorAll('.mention-item[data-linkify]').forEach((item) => {
        item.addEventListener('click', () => {
          const targetId = item.getAttribute('data-linkify');
          const src = S.state.notes.find((x) => x.id === targetId);
          const cur = S.state.notes.find((x) => x.id === id);
          if (!src || !cur) return;
          const r = LK.linkifyFirst(src.body, cur.title);
          if (r.count) {
            S.updateNote(targetId, { body: r.body });
            refreshLinkPanels();
            U.toast('已在「' + src.title + '」中建立链接');
          }
        });
      });
    }

    const saveState = root.querySelector('#e-save-state');
    const setSaveState = (txt, cls) => {
      if (!saveState) return;
      saveState.textContent = txt;
      saveState.className = 'save-state ' + (cls || '');
    };
    const doSave = () => {
      const cur = S.state.notes.find((x) => x.id === id);
      const newTitle = title.value.trim() || '无标题笔记';
      const oldTitle = cur ? cur.title : newTitle;
      // W2 · B3 安全重命名：标题改了就同步改写所有指向旧标题的 [[链接]]
      if (oldTitle !== newTitle && LK.renameNoteLinks) {
        const r = LK.renameNoteLinks(S.state, id, oldTitle, newTitle);
        if (r.changed) U.toast('已同步改写 ' + r.changed + ' 处链接');
      }
      S.updateNote(id, { title: newTitle, body: body.value, tags: tags.value.split(',').map((s) => s.trim()).filter(Boolean) });
      refreshLinkPanels();
      const d = new Date();
      setSaveState('已保存 · ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'), 'ok');
    };
    const update = U.debounce(doSave, 700);
    const renderPreview = () => {
      preview.innerHTML = U.markdown(body.value);
      // 标注未创建的链接
      preview.querySelectorAll('.wikilink').forEach((a) => {
        if (!LK.resolve(a.getAttribute('data-wiki'))) a.classList.add('missing');
      });
    };
    renderPreview();

    [body, title, tags].forEach((el) => el.addEventListener('input', () => {
      renderPreview();
      setSaveState('有未保存的改动…', 'dirty');
      update();
    }));
    const saveBtn = root.querySelector('#e-save');
    if (saveBtn) saveBtn.addEventListener('click', () => { doSave(); U.toast('笔记已保存'); });

    // W2 · B3 导出此篇为 .md
    const expMd = root.querySelector('#e-export-md');
    if (expMd) expMd.addEventListener('click', () => {
      doSave();
      const cur = S.state.notes.find((x) => x.id === id);
      if (!cur) return;
      const f = L.vault.exportNotes([cur])[0];
      downloadText(f.filename, f.content);
      U.toast('已导出 ' + f.filename);
    });

    // 预览中点击 [[链接]]
    preview.addEventListener('click', (e) => {
      const a = e.target.closest('.wikilink');
      if (!a) return;
      e.preventDefault();
      openByTitle(a.getAttribute('data-wiki'));
    });

    // 出链 / 反向链接 / 未链接提及面板点击（W2 · B1 统一绑定）
    const panels = root.querySelector('.link-panels');
    if (panels) bindLinkPanelClicks(panels);

    // 插入链接
    root.querySelector('#insert-link').addEventListener('click', () => {
      const list = S.state.notes.filter((x) => x.id !== id);
      U.modal({
        title: '插入双向链接',
        bodyHTML: '' +
          '<div class="form">' +
          '  <label>选择已有笔记</label>' +
          '  <select id="lk-sel" class="input">' +
          '    <option value="">— 请选择 —</option>' +
          list.map((x) => '<option value="' + U.escapeHtml(x.title) + '">' + U.escapeHtml(x.title) + '</option>').join('') +
          '  </select>' +
          '  <label style="margin-top:12px">或输入新标题（自动创建）</label>' +
          '  <input id="lk-new" class="input" placeholder="如：项目复盘"/>' +
          '  <div class="modal-actions"><button class="btn ghost" data-act="cancel">取消</button>' +
          '    <button class="btn primary" data-act="ok">插入</button></div>' +
          '</div>',
        onMount(mRoot, close) {
          mRoot.querySelector('[data-act="cancel"]').addEventListener('click', close);
          mRoot.querySelector('[data-act="ok"]').addEventListener('click', () => {
            const t = (mRoot.querySelector('#lk-new').value.trim() || mRoot.querySelector('#lk-sel').value).trim();
            if (!t) { U.toast('请选择或输入标题', 'error'); return; }
            const pos = body.selectionStart;
            const ins = '[[' + t + ']]';
            body.value = body.value.slice(0, pos) + ins + body.value.slice(pos);
            body.focus(); body.selectionStart = body.selectionEnd = pos + ins.length;
            body.dispatchEvent(new Event('input'));
            close();
          });
        }
      });
    });

    root.querySelector('#back').addEventListener('click', () => {
      // 直接返回时清掉从未编辑过的空草稿，避免列表里堆「无标题笔记」
      const cur = S.state.notes.find((x) => x.id === id);
      if (cur && cur.title === '无标题笔记' && !String(cur.body || '').trim() && !(cur.tags || []).length) {
        S.removeNote(id);
      }
      local.view = 'list'; L.app.refresh();
    });
    root.querySelector('#del').addEventListener('click', async () => {
      if (await U.confirm('确定删除该笔记？')) { S.removeNote(id); local.view = 'list'; L.app.refresh(); }
    });
  }

  L.modules.notes = { render, bind, open, openByTitle, showList, showDaily };
})(window.LifeOS);


/* ===== js/modules/library.js ===== */
/* =========================================================================
 * LifeOS · 知识库模块（本地存储 / 联网采集 / 可转笔记）
 *
 * - 全部条目存于本机 localStorage，断网可看、可搜、可编辑
 * - 联网只发生在用户主动点「联网采集 / 刷新」时
 * - 三条采集通道：AI 主题、网址、粘贴正文；失败原因直接显示在弹窗里
 * ========================================================================= */
window.LifeOS = window.LifeOS || {};
LifeOS.modules = LifeOS.modules || {};

(function (L) {
  'use strict';
  // 统一存储适配层：未加载 storage.js 时（如单测）无缝回落原生 localStorage
  const DB = L.storage || localStorage;
  const U = L.utils;
  const S = L.store;
  const CP = L.capture;

  const local = { search: '', tag: '', refreshMsg: '' };

  function fmtTime(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    if (isNaN(d.getTime())) return '—';
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function srcIcon(t) {
    return t === 'ai' ? '◇' : (t === 'url' || t === 'public') ? '◎' : '✎';
  }

  function allTags() {
    const set = Object.create(null);
    (S.state.library || []).forEach((it) => (it.tags || []).forEach((t) => { set[t] = true; }));
    return Object.keys(set).sort();
  }

  function cardHTML(it) {
    const src = it.source || {};
    const points = (it.points || []).length
      ? '<ul class="kb-points">' + it.points.map((p) => '<li>' + U.escapeHtml(p) + '</li>').join('') + '</ul>'
      : '';
    const tags = (it.tags || []).map((t) => '<span class="tag">#' + U.escapeHtml(t) + '</span>').join('');
    const urlPart = src.url
      ? ' <a class="kb-src-url" href="' + U.escapeHtml(U.safeUrl(src.url)) + '" target="_blank" rel="noopener" title="打开来源">↗</a>'
      : '';
    return '' +
      '<div class="kb-card" data-id="' + U.escapeHtml(it.id) + '">' +
      '  <div class="kb-card-top">' +
      '    <div class="kb-title">' + U.escapeHtml(it.title) +
      (L.seedLibrary && L.seedLibrary.isSeedItem(it) ? ' <span class="kb-seed" title="应用内置示例内容">示例</span>' : '') + '</div>' +
      '    <span class="kb-type" title="来源类型">' + srcIcon(src.type) + '</span>' +
      '  </div>' +
      '  <div class="kb-summary">' + U.escapeHtml(it.summary || '') + '</div>' +
      points +
      '  <div class="kb-tags">' + tags + '</div>' +
      '  <div class="kb-src">' + U.escapeHtml(src.label || '本地') + ' · ' + fmtTime(src.fetchedAt || it.createdAt) + urlPart + '</div>' +
      '  <div class="kb-ops">' +
      '    <button class="btn ghost btn-xs" data-act="internalize" title="吞噬内化：转成带 [[双向链接]] 的卡片笔记">' +
      (it.internalNoteId ? '◈ 查看卡片' : '◈ 吞入内化') + '</button>' +
      '    <button class="btn ghost btn-xs" data-act="note">' + (it.noteId ? '✎ 查看笔记' : '✎ 转为笔记') + '</button>' +
      '    <button class="btn ghost btn-xs danger" data-act="del">删除</button>' +
      '  </div>' +
      '</div>';
  }

  function render() {
    const all = S.state.library || [];
    const q = local.search.trim().toLowerCase();
    const list = all.filter((it) => {
      if (local.tag && !(it.tags || []).includes(local.tag)) return false;
      if (!q) return true;
      const hay = [it.title, it.summary, (it.points || []).join(' '), (it.tags || []).join(' '), (it.source || {}).label, it.raw].join(' ').toLowerCase();
      return hay.indexOf(q) >= 0;
    });

    const aiCount = all.filter((x) => (x.source || {}).type === 'ai').length;
    const webCount = all.filter((x) => { const t = (x.source || {}).type; return t === 'url' || t === 'public'; }).length;
    const tags = allTags();
    const seedN = (L.seedLibrary && L.seedLibrary.count) ? L.seedLibrary.count(S) : 0;

    return '' +
      '<div class="page kb-page">' +
      '  <div class="kb-stat">' +
      '    <span><b>' + all.length + '</b> 条知识' + (seedN ? '（含 ' + seedN + ' 条示例）' : '') + '</span>' +
      '    <span>◇ AI 整理 ' + aiCount + '</span>' +
      '    <span>◎ 外部采集 ' + webCount + '</span>' +
      '    <span class="kb-local">▣ 全部存于本机</span>' +
      '  </div>' +
      (seedN ? '<div class="kb-seed-note">◇ 其中 <b>' + seedN + '</b> 条是应用内置的示例内容，不是你添加的；清除后不会自动灌回。' +
        '<div class="spacer"></div><button class="btn ghost btn-xs" id="kb-clear-seed">清除示例内容</button></div>' : '') +
      '  <div class="toolbar kb-toolbar">' +
      '    <input class="search" id="kb-search" placeholder="搜索标题 / 要点 / 标签 / 来源…" value="' + U.escapeHtml(local.search) + '"/>' +
      '    <select class="input kb-tag-sel" id="kb-tag">' +
      '      <option value="">全部标签</option>' +
      tags.map((t) => '<option value="' + U.escapeHtml(t) + '"' + (local.tag === t ? ' selected' : '') + '>#' + U.escapeHtml(t) + '</option>').join('') +
      '    </select>' +
      '    <div class="spacer"></div>' +
      '    <button class="btn ghost" id="kb-refresh">↻ 刷新源</button>' +
      '    <button class="btn primary" id="kb-add">＋ 联网采集</button>' +
      '  </div>' +
      (local.refreshMsg ? '<div class="kb-notice">' + U.escapeHtml(local.refreshMsg) + '</div>' : '') +
      '  <div class="kb-grid">' + list.map(cardHTML).join('') +
      (list.length === 0
        ? '<div class="empty">没有匹配的知识条目。可以点「＋ 联网采集」抓取外部内容，或 <button class="link-btn" id="kb-reseed">载入内置示例内容</button>。</div>'
        : '') +
      '  </div>' +
      '</div>';
  }

  /* ---------- 采集弹窗 ---------- */
  function openCapture() {
    const connected = !!S.state.settings.aiKey;
    let tab = 'topic';

    const bodyHTML = '' +
      '<div class="kb-tabs">' +
      '  <button class="kb-tab active" data-tab="topic">◇ AI 主题</button>' +
      '  <button class="kb-tab" data-tab="url">◎ 网址</button>' +
      '  <button class="kb-tab" data-tab="paste">✎ 粘贴正文</button>' +
      '</div>' +
      '<div class="kb-pane" data-pane="topic">' +
      '  <div class="form">' +
      '    <label>输入一个主题，交给 AI 整理成结构化知识卡片</label>' +
      '    <input id="kb-topic" class="input" placeholder="如：番茄工作法 / 如何做周复盘 / 间隔重复"/>' +
      '    <p class="hint">调用「设置」里的 OpenAI 兼容接口，模型输出严格 JSON，前端解析后存入本机。' +
      (connected ? '当前 <b>已配置 Key</b>。' : '<b>当前未配置 Key</b>，此通道暂不可用；可先用「粘贴正文」。') + '</p>' +
      '  </div>' +
      '</div>' +
      '<div class="kb-pane" data-pane="url" hidden>' +
      '  <div class="form">' +
      '    <label>公开接口 / 网页地址（需允许跨域）</label>' +
      '    <input id="kb-url" class="input" placeholder="https://v1.hitokoto.cn/?c=k&encode=json"/>' +
      '    <p class="hint">浏览器受 CORS 限制，抓不了不开放跨域的普通网页；被拒绝时会明确告诉你原因。' +
      '实测可直接抓 <code>v1.hitokoto.cn</code> 这类公开接口。</p>' +
      '  </div>' +
      '</div>' +
      '<div class="kb-pane" data-pane="paste" hidden>' +
      '  <div class="form">' +
      '    <label>标题（可留空，自动从正文提取）</label>' +
      '    <input id="kb-ptitle" class="input" placeholder="如：今天读到的三个观点"/>' +
      '    <label>正文：从任意 App 复制过来</label>' +
      '    <textarea id="kb-ptext" class="input" rows="7" placeholder="粘贴文章、聊天记录、网页正文…&#10;本地整理会自动抽取标题、摘要、要点与 #标签，断网也能用。"></textarea>' +
      '  </div>' +
      '</div>' +
      '<label class="kb-check"><input type="checkbox" id="kb-useai"' + (connected ? ' checked' : '') + '/> 用 AI 整理（网址 / 粘贴通道；主题通道默认走 AI）</label>' +
      '<div id="kb-status" class="kb-status"></div>' +
      '<div class="modal-actions">' +
      '  <button class="btn ghost" data-act="cancel">取消</button>' +
      '  <button class="btn primary" data-act="run">采集并入库</button>' +
      '</div>';

    U.modal({
      title: '联网采集到知识库',
      bodyHTML: bodyHTML,
      onMount(root, close) {
        const status = root.querySelector('#kb-status');
        const setStatus = (msg, bad) => {
          status.textContent = msg || '';
          status.className = 'kb-status' + (msg ? (bad ? ' bad' : ' busy') : '');
        };
        const runBtn = root.querySelector('[data-act="run"]');
        root.querySelector('[data-act="cancel"]').addEventListener('click', close);

        root.querySelectorAll('.kb-tab').forEach((b) => {
          b.addEventListener('click', () => {
            tab = b.getAttribute('data-tab');
            root.querySelectorAll('.kb-tab').forEach((x) => x.classList.toggle('active', x === b));
            root.querySelectorAll('.kb-pane').forEach((p) => { p.hidden = p.getAttribute('data-pane') !== tab; });
            setStatus('');
          });
        });

        runBtn.addEventListener('click', async () => {
          runBtn.disabled = true;
          setStatus('正在采集，请稍候…');
          try {
            const settings = S.state.settings;
            const useAI = root.querySelector('#kb-useai').checked;
            let items;
            if (tab === 'topic') {
              items = await CP.collectTopic(root.querySelector('#kb-topic').value, settings);
            } else if (tab === 'url') {
              items = await CP.collectUrl(root.querySelector('#kb-url').value, settings, { useAI: useAI });
            } else {
              items = await CP.collectText(
                root.querySelector('#kb-ptext').value,
                root.querySelector('#kb-ptitle').value,
                settings, { useAI: useAI }
              );
            }
            if (!items || !items.length) throw new Error('没有产出条目，请检查输入内容');
            items.forEach((it) => S.addLibraryItem(it));
            U.toast('已入库 ' + items.length + ' 条知识');
            close();
            L.app.refresh();
          } catch (e) {
            setStatus('✗ ' + (e && e.message ? e.message : String(e)), true);
            runBtn.disabled = false;
          }
        });
      }
    });
  }

  /* ---------- 吞噬内化（概念 2）：知识条目 → 带 [[双向链接]] 的卡片笔记 ----------
   * 把知识条目「嚼碎」成结构化笔记，并自动与已有笔记建立双向链接：
   *   ① 摘要/要点/标签都写入正文；
   *   ② 同标签的已有笔记用 [[标题]] 收进「关联」段（真正的 Obsidian 反链）；
   *   ③ 通过 L.pet.observe('link'/'feed') 沉淀数字分身习惯。
   * 全部走本地 store，不联网、不新增实体键。 */
  function internalize(it) {
    // 已内化过则直接打开对应笔记
    if (it.internalNoteId && S.state.notes.some((n) => n.id === it.internalNoteId)) {
      if (L.modules.notes && L.modules.notes.open) L.modules.notes.open(it.internalNoteId);
      return;
    }
    const src = it.source || {};
    const tags = (it.tags || []).slice();

    // 找同标签的已有笔记作为「关联」——建立真实双向链接
    const related = (S.state.notes || []).filter((n) =>
      n.id !== it.internalNoteId && (n.tags || []).some((t) => tags.indexOf(t) >= 0)
    ).slice(0, 6);

    const lines = [
      '> 由知识库「吞噬内化」生成 · 来源：' + (src.label || '本地') + (src.url ? '  ' + src.url : ''),
      '',
      '## 摘要',
      String(it.summary || '（无摘要）'),
      ''
    ];
    if ((it.points || []).length) {
      lines.push('## 要点', '');
      it.points.forEach((p) => lines.push('- ' + p));
      lines.push('');
    }
    if (related.length) {
      lines.push('## 关联（双向链接）', '');
      related.forEach((n) => lines.push('- [[' + n.title + ']]'));
      lines.push('');
      lines.push('> 这些链接指向同标签的已有笔记，可在「知识图谱」看到连线。');
    } else {
      lines.push('## 关联', '', '> 暂无同标签笔记。再内化几条，卡片之间就会自动连成小屋。');
    }
    if (it.raw) {
      lines.push('', '## 原文摘录', '', String(it.raw).slice(0, 2000));
    }

    const note = S.addNote({
      title: String(it.title || '未命名').replace(/[\[\]]/g, ''),
      body: lines.join('\n'),
      tags: tags.concat(['内化'])
    });
    S.updateLibraryItem(it.id, { noteId: note.id, internalNoteId: note.id });
    // 行为沉淀：吞了一张卡 + 建立 N 条链接
    if (L.pet) {
      L.pet.observe('feed');
      for (let i = 0; i < related.length; i++) L.pet.observe('link');
    }
    U.toast('已内化：吐出卡片笔记' + (related.length ? '，连上 ' + related.length + ' 条双向链接' : ''));
    return note;
  }

  /* ---------- 转为笔记（旧入口，保留兼容） ---------- */
  function toNote(it) {
    if (it.noteId && S.state.notes.some((n) => n.id === it.noteId)) {
      if (L.modules.notes && L.modules.notes.open) L.modules.notes.open(it.noteId);
      return;
    }
    const src = it.source || {};
    const lines = [
      '> 来源：' + (src.label || '知识库') + (src.url ? '  ' + src.url : ''),
      '',
      '## 摘要',
      it.summary || '（无）',
      ''
    ];
    if ((it.points || []).length) {
      lines.push('## 要点', '', it.points.map((p) => '- ' + p).join('\n'), '');
    }
    lines.push('## 原文摘录', '', it.raw ? it.raw.slice(0, 3000) : '（未保存原文）');
    const note = S.addNote({
      title: it.title,
      body: lines.join('\n'),
      tags: (it.tags || []).concat(['知识库'])
    });
    S.updateLibraryItem(it.id, { noteId: note.id });
    U.toast('已转为笔记');
  }

  function bind(root) {
    const search = root.querySelector('#kb-search');
    if (search) search.addEventListener('input', U.debounce(() => { local.search = search.value; L.app.refresh(); }, 250));

    const tagSel = root.querySelector('#kb-tag');
    if (tagSel) tagSel.addEventListener('change', () => { local.tag = tagSel.value; L.app.refresh(); });

    root.querySelector('#kb-add').addEventListener('click', openCapture);

    const clearSeed = root.querySelector('#kb-clear-seed');
    if (clearSeed) clearSeed.addEventListener('click', async () => {
      const n = L.seedLibrary.count(S);
      if (!n) { U.toast('没有示例内容'); return; }
      if (await U.confirm('清除 ' + n + ' 条内置示例内容？你自己采集或编辑的内容不会受影响。', '清除')) {
        const removed = L.seedLibrary.clear(S);
        U.toast('已清除 ' + removed + ' 条示例内容');
        L.app.refresh();
      }
    });

    const reseed = root.querySelector('#kb-reseed');
    if (reseed) reseed.addEventListener('click', () => {
      try { DB.removeItem(L.seedLibrary.SEED_KEY); } catch (e) { /* noop */ }
      const n = L.seedLibrary.ensure(S);
      U.toast(n ? '已载入 ' + n + ' 条内置内容' : '内置内容已存在');
      L.app.refresh();
    });

    root.querySelector('#kb-refresh').addEventListener('click', async () => {
      local.refreshMsg = '正在刷新公开源…';
      L.app.refresh();
      const r = await CP.refreshSources();
      r.added.forEach((it) => S.addLibraryItem(it));
      const bits = ['新增 ' + r.added.length + ' 条', '重复跳过 ' + r.skipped.length + ' 条'];
      if (r.errors.length) bits.push('失败 ' + r.errors.length + ' 条：' + r.errors[0]);
      local.refreshMsg = bits.join(' · ');
      L.app.refresh();
      U.toast('刷新完成：新增 ' + r.added.length + ' 条');
    });

    root.querySelectorAll('.kb-card').forEach((card) => {
      const id = card.getAttribute('data-id');
      const it = (S.state.library || []).find((x) => x.id === id);
      if (!it) return;
      card.querySelectorAll('[data-act]').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const act = btn.getAttribute('data-act');
          if (act === 'internalize') { internalize(it); L.app.refresh(); }
          else if (act === 'note') { toNote(it); L.app.refresh(); }
          else if (act === 'del') {
            if (await U.confirm('删除知识条目「' + it.title + '」？（已转成的笔记不受影响）')) {
              S.removeLibraryItem(id);
              L.app.refresh();
            }
          }
        });
      });
    });
  }

  L.modules.library = { render, bind, openCapture, toNote, internalize };
})(window.LifeOS);


/* ===== js/modules/calendar.js ===== */
/* =========================================================================
 * LifeOS · 日历月视图
 * 按日聚合任务截止 / 创建 / 完成、习惯打卡、笔记、AI 对话与用户日程。
 * 支持上/下月、回到今天、点击某天查看当日明细，并可手动新增/删除日程。
 * ========================================================================= */
window.LifeOS = window.LifeOS || {};
LifeOS.modules = LifeOS.modules || {};

(function (L) {
  'use strict';
  const U = L.utils;
  const S = L.store;
  const ST = L.stats;

  const today = new Date();
  const local = {
    year: today.getFullYear(),
    month: today.getMonth(),          // 0-11
    selected: U.todayStr()
  };

  function pad(n) { return String(n).padStart(2, '0'); }
  function dateKey(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function todayKey() { return U.todayStr(); }

  /* 生成 6×7 网格（周一为每周第一天） */
  function buildGrid() {
    const first = new Date(local.year, local.month, 1);
    const startOffset = (first.getDay() + 6) % 7; // 周一=0
    const daysInMonth = new Date(local.year, local.month + 1, 0).getDate();
    const daysPrev = new Date(local.year, local.month, 0).getDate();
    const cells = [];
    for (let i = 0; i < 42; i++) {
      const slot = i - startOffset + 1;
      if (slot < 1) {
        const d = daysPrev + slot;
        const pm = local.month === 0 ? 11 : local.month - 1;
        const py = local.month === 0 ? local.year - 1 : local.year;
        cells.push({ key: dateKey(py, pm, d), day: d, other: true });
      } else if (slot > daysInMonth) {
        const d = slot - daysInMonth;
        const nm = local.month === 11 ? 0 : local.month + 1;
        const ny = local.month === 11 ? local.year + 1 : local.year;
        cells.push({ key: dateKey(ny, nm, d), day: d, other: true });
      } else {
        cells.push({ key: dateKey(local.year, local.month, slot), day: slot, other: false });
      }
    }
    return cells;
  }

  const TYPE_ICON = { task: '✓', done: '✔', due: '▦', habit: '◆', note: '✎', edit: '✎', ai: '◇', event: '◷' };
  const TYPE_LABEL = { task: '创建任务', done: '完成任务', due: '任务截止', habit: '习惯打卡', note: '新建笔记', edit: '编辑笔记', ai: 'AI 对话', event: '日程' };

  function dayEvents(key) {
    return (S.state.events || [])
      .filter((e) => e && e.date === key)
      .sort((a, b) => String(a.time || '').localeCompare(String(b.time || '')));
  }

  function eventHTML(e) {
    return '<div class="cal-event">' +
      '<span class="ce-time">' + U.escapeHtml(e.time || '全天') + '</span>' +
      '<span class="ce-main"><span class="ce-title">' + U.escapeHtml(e.title || '未命名日程') + '</span>' +
      (e.note ? '<span class="ce-note">' + U.escapeHtml(e.note) + '</span>' : '') + '</span>' +
      '<button class="ce-del" data-del-event="' + U.escapeHtml(e.id) + '" title="删除日程" aria-label="删除日程">×</button>' +
      '</div>';
  }

  function dayDetail(key) {
    const evs = dayEvents(key);
    // 活动聚合里已含 event，明细中过滤掉，避免和日程卡片重复显示
    const map = ST.activity();
    const items = ((map[key] && map[key].items) || []).filter((it) => it.type !== 'event');
    if (!evs.length && !items.length) {
      return '<div class="cal-empty">这一天还没有记录。点上方「＋ 添加日程」记一件事吧。</div>';
    }
    let html = '';
    if (evs.length) html += '<div class="cal-ev-head">日程 · ' + evs.length + '</div>' + evs.map(eventHTML).join('');
    if (items.length) {
      html += '<div class="cal-ev-head">当日活动</div>' + items.map((it) =>
        '<div class="cal-item"><span class="ci-icon">' + (TYPE_ICON[it.type] || '•') + '</span>' +
        '<span class="ci-label">' + U.escapeHtml(it.label) + '</span>' +
        '<span class="ci-type">' + (TYPE_LABEL[it.type] || it.type) + '</span></div>'
      ).join('');
    }
    return html;
  }

  /* 新增日程：让日历从「只读聚合」变成真正能记录的日历 */
  function openEventEditor(date) {
    U.modal({
      title: '新建日程',
      bodyHTML: '' +
        '<div class="form">' +
        '  <label>标题</label><input id="ev-title" class="input" placeholder="要做什么？"/>' +
        '  <div class="form-row">' +
        '    <div><label>日期</label><input id="ev-date" class="input" type="date" lang="zh-CN" value="' + U.escapeHtml(date) + '"/><span class="form-hint">格式：年-月-日</span><span class="form-hint date-cn" id="ev-date-cn"></span></div>' +
        '    <div><label>时间（可选）</label><input id="ev-time" class="input" type="time" value=""/></div>' +
        '  </div>' +
        '  <label>备注（可选）</label><textarea id="ev-note" class="input" rows="2" placeholder="补充说明…"></textarea>' +
        '  <div class="modal-actions"><button class="btn ghost" data-act="cancel">取消</button>' +
        '    <button class="btn primary" data-act="save">保存</button></div>' +
        '</div>',
      onMount(root, close) {
        const dateEl = root.querySelector('#ev-date');
        const cnEl = root.querySelector('#ev-date-cn');
        const syncCN = () => { const cn = U.cnDate(dateEl.value); cnEl.textContent = cn ? '当前选择：' + cn : ''; };
        dateEl.addEventListener('input', syncCN);
        dateEl.addEventListener('change', syncCN);
        syncCN();
        root.querySelector('[data-act="save"]').addEventListener('click', () => {
          const titleEl = root.querySelector('#ev-title');
          const title = titleEl.value.trim();
          if (!title) { U.toast('请填写日程标题', 'error'); titleEl.focus(); return; }
          const d = root.querySelector('#ev-date').value || date;
          S.addEvent({ date: d, title, time: root.querySelector('#ev-time').value, note: root.querySelector('#ev-note').value });
          local.selected = d;
          U.toast('日程已添加');
          close();
          L.app.refresh();
        });
        root.querySelector('[data-act="cancel"]').addEventListener('click', close);
      }
    });
  }

  function render() {
    const map = ST.activity();
    const cells = buildGrid();
    const weekNames = ['一', '二', '三', '四', '五', '六', '日'];

    const heads = weekNames.map((w) => '<div class="cal-week">' + w + '</div>').join('');
    const grid = cells.map((c) => {
      const info = map[c.key];
      const cnt = info ? info.count : 0;
      const lv = ST.level(cnt);
      const types = info ? Array.from(new Set(info.items.map((i) => i.type))).slice(0, 3) : [];
      const dots = types.map((t) => '<i class="cal-dot d-' + t + '" title="' + (TYPE_LABEL[t] || t) + '"></i>').join('');
      const evN = dayEvents(c.key).length;
      const evDots = evN ? '<span class="cc-events">' + '<i></i>'.repeat(Math.min(evN, 3)) + '</span>' : '';
      const cls = 'cal-cell' +
        (c.other ? ' other' : '') +
        (c.key === todayKey() ? ' today' : '') +
        (c.key === local.selected ? ' selected' : '') +
        (cnt ? ' lv' + lv : '');
      return '' +
        '<button class="' + cls + '" data-date="' + c.key + '">' +
        '  <span class="cc-day">' + c.day + '</span>' +
        (cnt ? '<span class="cc-count">' + cnt + '</span>' : '') +
        '  <span class="cc-dots">' + dots + '</span>' +
        evDots +
        '</button>';
    }).join('');

    const selDate = new Date(local.selected + 'T00:00:00');
    const selLabel = isNaN(selDate.getTime()) ? local.selected :
      (selDate.getMonth() + 1) + '月' + selDate.getDate() + '日 · 周' + U.weekday(local.selected);

    return '' +
      '<div class="page cal-page">' +
      '  <div class="toolbar">' +
      '    <button class="btn ghost" id="cal-prev">‹ 上月</button>' +
      '    <button class="btn ghost" id="cal-today">今天</button>' +
      '    <button class="btn ghost" id="cal-next">下月 ›</button>' +
      '    <div class="cal-title">' + local.year + '年 ' + (local.month + 1) + '月</div>' +
      '    <div class="spacer"></div>' +
      '    <button class="btn primary btn-xs" id="cal-new-event">＋ 新建日程</button>' +
      '    <div class="cal-legend"><span class="cl-l">少</span><i class="lg lg0"></i><i class="lg lg1"></i><i class="lg lg2"></i><i class="lg lg3"></i><i class="lg lg4"></i><span class="cl-l">多</span></div>' +
      '  </div>' +
      '  <div class="cal-wrap">' +
      '    <div class="cal-grid">' + heads + grid + '</div>' +
      '    <div class="cal-side">' +
      '      <div class="cs-head">' + U.escapeHtml(selLabel) + '</div>' +
      '      <div class="cs-actions">' +
      '        <button class="btn primary btn-xs cs-add" id="cal-add-event">＋ 添加日程</button>' +
      '        <button class="btn ghost btn-xs" id="cal-open-daily" title="查看/创建这一天的每日笔记">✎ 当日日记</button>' +
      '      </div>' +
      '      <div class="cs-body">' + dayDetail(local.selected) + '</div>' +
      '    </div>' +
      '  </div>' +
      '</div>';
  }

  function bind(root) {
    root.querySelector('#cal-prev').addEventListener('click', () => {
      local.month--; if (local.month < 0) { local.month = 11; local.year--; }
      L.app.refresh();
    });
    root.querySelector('#cal-next').addEventListener('click', () => {
      local.month++; if (local.month > 11) { local.month = 0; local.year++; }
      L.app.refresh();
    });
    root.querySelector('#cal-today').addEventListener('click', () => {
      const d = new Date();
      local.year = d.getFullYear(); local.month = d.getMonth(); local.selected = U.todayStr();
      L.app.refresh();
    });
    root.querySelectorAll('.cal-cell').forEach((c) => {
      c.addEventListener('click', () => { local.selected = c.getAttribute('data-date'); L.app.refresh(); });
    });
    const add = () => openEventEditor(local.selected);
    const toolbarAdd = root.querySelector('#cal-new-event');
    const sideAdd = root.querySelector('#cal-add-event');
    if (toolbarAdd) toolbarAdd.addEventListener('click', add);
    if (sideAdd) sideAdd.addEventListener('click', add);
    // W2 · B2：从日历某天直达每日笔记
    const dailyBtn = root.querySelector('#cal-open-daily');
    if (dailyBtn && L.modules.daily) {
      dailyBtn.addEventListener('click', () => L.modules.daily.go(local.selected));
    }
    root.querySelectorAll('[data-del-event]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (await U.confirm('删除这个日程？', '删除')) {
          S.removeEvent(btn.getAttribute('data-del-event'));
          L.app.refresh();
        }
      });
    });
  }

  /* 供热力图点击格子时跳转并选中某天 */
  function go(date) {
    const d = new Date(date + 'T00:00:00');
    if (isNaN(d.getTime())) return;
    local.year = d.getFullYear();
    local.month = d.getMonth();
    local.selected = date;
    L.app.showView('calendar');
  }

  L.modules.calendar = { render, bind, go };
})(window.LifeOS);


/* ===== js/modules/heatmap.js ===== */
/* =========================================================================
 * LifeOS · 全年活动热力图（力扣 / GitHub 贡献图风格）
 * 53 周 × 7 天，按日活跃度分 5 档着色；含连续天数、最长连续、总活跃统计。
 * 数据来源：任务创建/完成/截止、习惯打卡、笔记创建/编辑、AI 对话。
 * ========================================================================= */
window.LifeOS = window.LifeOS || {};
LifeOS.modules = LifeOS.modules || {};

(function (L) {
  'use strict';
  const U = L.utils;
  const S = L.store;
  const ST = L.stats;

  function keyOf(d) {
    const off = d.getTimezoneOffset() * 60000;
    return new Date(d.getTime() - off).toISOString().slice(0, 10);
  }

  /* 生成周列（周一为首日），覆盖最近 365 天 */
  function buildWeeks() {
    const end = new Date(); end.setHours(0, 0, 0, 0);
    const rangeStart = new Date(end); rangeStart.setDate(rangeStart.getDate() - 364);
    const start = new Date(rangeStart);
    start.setDate(start.getDate() - ((start.getDay() + 6) % 7)); // 对齐周一
    const weeks = [];
    let cur = new Date(start);
    while (cur <= end) {
      const week = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(cur); d.setDate(d.getDate() + i);
        week.push({ key: keyOf(d), inRange: d >= rangeStart && d <= end, month: d.getMonth() + 1 });
      }
      weeks.push(week);
      cur.setDate(cur.getDate() + 7);
    }
    return weeks;
  }

  function monthLabels(weeks) {
    const out = [];
    let last = -1;
    weeks.forEach((w) => {
      const mid = w[3]; // 用周四判断月份，视觉更稳
      if (mid.inRange && mid.month !== last) { out.push(mid.month + '月'); last = mid.month; }
      else out.push('');
    });
    return out;
  }

  /* 可选：生成演示数据，明确由用户点击触发 */
  function seedDemo() {
    const st = S.state;
    const DAY = 86400000;
    const now = Date.now();
    if (!st.habits.some((h) => h.name === '阅读')) {
      const checkins = {};
      for (let i = 0; i < 300; i++) {
        if (Math.random() < 0.62) checkins[ST.dayKey(now - i * DAY)] = true;
      }
      st.habits.push({ id: U.uid(), name: '阅读', emoji: '▤', color: '#176c6b', createdAt: now - 300 * DAY, checkins });
    }
    if (!st.habits.some((h) => h.name === '运动')) {
      const checkins = {};
      for (let i = 0; i < 300; i++) {
        if (Math.random() < 0.4) checkins[ST.dayKey(now - i * DAY)] = true;
      }
      st.habits.push({ id: U.uid(), name: '运动', emoji: '◆', color: '#34d399', createdAt: now - 300 * DAY, checkins });
    }
    if (st.tasks.length < 12) {
      const names = ['整理周计划', '回复邮件', '代码评审', '写日报', '学习 ArkTS', '复盘项目', '整理笔记', '健身计划'];
      for (let i = 0; i < 16; i++) {
        const c = now - Math.floor(Math.random() * 300) * DAY;
        st.tasks.push({
          id: U.uid(), title: names[i % names.length], note: '', priority: 'medium',
          status: Math.random() < .7 ? 'done' : 'todo', due: ST.dayKey(c),
          tags: [], createdAt: c, updatedAt: c + DAY
        });
      }
    }
    if (st.notes.length < 6) {
      const titles = ['LifeOS 构想', '双向链接设计', '习惯养成笔记', '周复盘', '读书摘录'];
      titles.forEach((t, i) => {
        const c = now - Math.floor(Math.random() * 250) * DAY;
        st.notes.push({ id: U.uid(), title: t, body: '这是一篇示例笔记，可以试试 [[LifeOS 构想]] 这样的双向链接。', tags: [], createdAt: c, updatedAt: c });
      });
    }
    S.persist();
    U.toast('已生成演示数据（示例习惯/任务/笔记）');
    L.app.refresh();
  }

  function render() {
    const map = ST.activity();
    const dates = ST.daysBack(365);
    const sk = ST.streaks(map, dates);
    const activeDays = dates.filter((d) => map[d] && map[d].count).length;
    const total = dates.reduce((s, d) => s + ((map[d] && map[d].count) || 0), 0);
    const weeks = buildWeeks();
    const labels = monthLabels(weeks);
    const dow = ['', '一', '', '三', '', '五', ''];

    const monthRow = labels.map((m) => '<div class="hm-month">' + (m || '') + '</div>').join('');
    const cols = weeks.map((w, wi) => {
      const cells = w.map((c) => {
        if (!c.inRange) return '<div class="hy-cell out"></div>';
        const cnt = map[c.key] ? map[c.key].count : 0;
        const lv = ST.level(cnt);
        const tip = c.key + ' · ' + cnt + ' 次活动';
        const isToday = c.key === U.todayStr();
        return '<div class="hy-cell lv' + lv + (isToday ? ' is-today' : '') + '" data-date="' + c.key + '" title="' + tip + '"></div>';
      }).join('');
      return '<div class="hm-col" data-wi="' + wi + '">' + cells + '</div>';
    }).join('');

    const dowCol = dow.map((d) => '<div class="hm-dow">' + d + '</div>').join('');

    const hasData = total > 0;

    return '' +
      '<div class="page hm-page">' +
      '  <div class="toolbar">' +
      '    <div class="page-sub">全年活动热力图 · 像力扣一样记录每一天的积累 ◆</div>' +
      '    <div class="spacer"></div>' +
      '    <button class="btn ghost" id="hm-seed">载入演示数据</button>' +
      '  </div>' +
      '  <div class="hm-stats">' +
      '    <div class="hs"><div class="hs-num" data-count="' + total + '">' + total + '</div><div class="hs-label">全年活动</div></div>' +
      '    <div class="hs"><div class="hs-num" data-count="' + activeDays + '">' + activeDays + '</div><div class="hs-label">活跃天数</div></div>' +
      '    <div class="hs"><div class="hs-num" data-count="' + sk.current + '">' + sk.current + '</div><div class="hs-label">当前连续</div></div>' +
      '    <div class="hs"><div class="hs-num" data-count="' + sk.longest + '">' + sk.longest + '</div><div class="hs-label">最长连续</div></div>' +
      '  </div>' +
      (hasData ? '' : '<div class="hm-hint">还没有活动记录。开始创建任务、打卡习惯或写笔记，格子就会亮起来；也可以点右上角「载入演示数据」先看效果。</div>') +
      '  <div class="hm-panel">' +
      '    <div class="hm-body">' +
      '      <div class="hm-dow-col">' + dowCol + '</div>' +
      '      <div class="hm-main">' +
      '        <div class="hm-months">' + monthRow + '</div>' +
      '        <div class="hm-cols">' + cols + '</div>' +
      '      </div>' +
      '    </div>' +
      '    <div class="hm-foot">' +
      '      <span class="hm-note">点击任意格子可跳转到日历查看当天明细</span>' +
      '      <span class="hm-legend">少 <i class="hy-cell lv0"></i><i class="hy-cell lv1"></i><i class="hy-cell lv2"></i><i class="hy-cell lv3"></i><i class="hy-cell lv4"></i> 多</span>' +
      '    </div>' +
      '  </div>' +
      '</div>';
  }

  function bind(root) {
    const seed = root.querySelector('#hm-seed');
    if (seed) seed.addEventListener('click', async () => {
      if (await U.confirm('将写入若干示例习惯、任务与笔记，方便预览热力图效果。现有数据不会被删除。继续吗？')) seedDemo();
    });
    root.querySelectorAll('.hy-cell[data-date]').forEach((c) => {
      c.addEventListener('click', () => {
        if (L.modules.calendar.go) L.modules.calendar.go(c.getAttribute('data-date'));
      });
    });

    /* W3 · 波浪点亮的唯一驱动源：按列写 --hm-wi（CSS 变量继承到每个格子）。
     * 统计数字是权威数据，只做统一淡入，不做数值缓动 / 交错隐藏。 */
    if (U.stagger) U.stagger(root.querySelectorAll('.hm-col'), 13, '--hm-wi', 60);
  }

  L.modules.heatmap = { render, bind };
})(window.LifeOS);


/* ===== js/modules/graph.js ===== */
/* =========================================================================
 * LifeOS · 知识图谱（Obsidian Graph View 风格）
 * 用轻量力导向布局绘制 [[双向链接]] 关系；点击节点打开对应笔记。
 * ========================================================================= */
window.LifeOS = window.LifeOS || {};
LifeOS.modules = LifeOS.modules || {};

(function (L) {
  'use strict';
  const U = L.utils;
  const S = L.store;
  const LK = L.links;

  const W = 900, H = 560;

  /* 概念 3：知识小屋布局。把节点沿「屋顶 + 墙 + 地基」的坐标放置，
   * 让内化出来的卡片在画布上真的长成一间屋子。纯坐标分配，不改数据结构。 */
  const layoutMode = { value: 'force' }; // 'force' | 'house'
  function houseLayout(nodes) {
    const n = nodes.length;
    // 小屋轮廓：屋顶顶点 → 屋檐两端 → 左右墙 → 地基，按序循环铺开
    const slots = [];
    const cx = W / 2;
    slots.push([cx, 80]);                         // 屋顶尖
    slots.push([cx - 150, 190], [cx + 150, 190]); // 屋檐
    slots.push([cx - 210, 300], [cx + 210, 300]); // 墙外沿
    slots.push([cx - 140, 430], [cx, 470], [cx + 140, 430]); // 地基
    slots.push([cx - 80, 250], [cx + 80, 250]);   // 窗
    slots.push([cx - 60, 360], [cx + 60, 360]);   // 门侧
    if (n > slots.length) {
      // 超出轮廓的节点：沿地基下方均匀补充第二排
      for (let i = slots.length; i < n; i++) {
        const k = i - slots.length;
        slots.push([cx - 240 + (k % 8) * 68, 500 + Math.floor(k / 8) * 34]);
      }
    }
    nodes.forEach((v, i) => {
      const s = slots[i % slots.length];
      v.x = s[0]; v.y = s[1];
    });
    return nodes;
  }

  /* 轻量力导向：初始环形 + 若干次迭代（斥力 / 弹簧 / 向心） */
  function layout(nodes, links) {
    const n = nodes.length;
    const cx = W / 2, cy = H / 2;
    nodes.forEach((v, i) => {
      const a = (i / Math.max(n, 1)) * Math.PI * 2;
      const r = 150 + (n > 12 ? 60 : 0);
      v.x = cx + Math.cos(a) * r;
      v.y = cy + Math.sin(a) * r;
      v.vx = 0; v.vy = 0;
    });
    const ITER = 160;
    for (let it = 0; it < ITER; it++) {
      // 斥力
      for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
          const a = nodes[i], b = nodes[j];
          let dx = a.x - b.x, dy = a.y - b.y;
          let d2 = dx * dx + dy * dy;
          if (d2 < 1) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
          const f = 2600 / d2;
          const d = Math.sqrt(d2);
          const fx = (dx / d) * f, fy = (dy / d) * f;
          a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
        }
      }
      // 弹簧
      links.forEach((l) => {
        const a = nodes[l.s], b = nodes[l.t];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        const f = (d - 130) * 0.012;
        const fx = (dx / d) * f, fy = (dy / d) * f;
        a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
      });
      // 向心 + 阻尼 + 边界
      nodes.forEach((v) => {
        v.vx += (cx - v.x) * 0.0022;
        v.vy += (cy - v.y) * 0.0022;
        v.vx *= 0.82; v.vy *= 0.82;
        v.x += v.vx; v.y += v.vy;
        v.x = Math.max(70, Math.min(W - 70, v.x));
        v.y = Math.max(40, Math.min(H - 40, v.y));
      });
    }
  }

  function render() {
    const g = LK.graph();
    const eCount = g.links.length;
    const orphanCount = LK.orphans().length;

    if (g.nodes.length === 0) {
      return '' +
        '<div class="page graph-page">' +
        '  <div class="toolbar"><div class="page-sub">知识图谱 · 用 [[双向链接]] 把笔记连成网络 ◇</div></div>' +
        '  <div class="empty">还没有笔记。写几篇并在正文里用 [[标题]] 互相链接，图谱就会出现。<button class="empty-state-btn" data-go="notes">去写笔记 →</button></div>' +
        '</div>';
    }

    // 概念 3：按模式选布局。小屋模式让卡片长成屋子；力导向为默认探索视图。
    if (layoutMode.value === 'house') houseLayout(g.nodes);
    else layout(g.nodes, g.links);
    const virtualCount = g.nodes.filter((v) => !v.real).length;

    const lines = g.links.map((l) => {
      const a = g.nodes[l.s], b = g.nodes[l.t];
      /* W3：把真实边长写成 CSS 变量，供 stroke-dashoffset 生长动画使用；
       * 交错序号 --motion-i 由 bind() 统一用 U.stagger 写入 */
      const len = Math.max(1, Math.round(Math.sqrt(
        (b.x - a.x) * (b.x - a.x) + (b.y - a.y) * (b.y - a.y))));
      return '<line x1="' + a.x.toFixed(1) + '" y1="' + a.y.toFixed(1) +
        '" x2="' + b.x.toFixed(1) + '" y2="' + b.y.toFixed(1) +
        '" class="g-edge" style="--g-len:' + len + '"/>';
    }).join('');

    const dots = g.nodes.map((v) => {
      const r = v.real ? 11 : 7;
      const label = v.title.length > 12 ? v.title.slice(0, 12) + '…' : v.title;
      const attrs = v.real
        ? 'class="g-node real" data-open="' + U.escapeHtml(v.id) + '"'
        : 'class="g-node virtual" data-wiki="' + U.escapeHtml(v.title) + '"';
      return '' +
        '<g ' + attrs + ' transform="translate(' + v.x.toFixed(1) + ',' + v.y.toFixed(1) + ')">' +
        '  <circle r="' + r + '"/>' +
        '  <text y="' + (r + 15) + '" text-anchor="middle">' + U.escapeHtml(label) + '</text>' +
        '</g>';
    }).join('');

    return '' +
      '<div class="page graph-page">' +
      '  <div class="toolbar">' +
      '    <div class="page-sub">知识图谱 · 点击节点打开笔记 ◇</div>' +
      '    <div class="spacer"></div>' +
      '    <button class="btn ghost' + (layoutMode.value === 'house' ? ' on' : '') + '" id="graph-house" ' +
      'title="让知识卡片连成一间小屋（概念 3）">⌂ 知识小屋</button>' +
      '    <button class="btn ghost" id="graph-relayout">↻ 重新布局</button>' +
      '  </div>' +
      (layoutMode.value === 'house'
        ? '  <div class="house-note">⌂ 小屋布局：每篇笔记是一张卡片，连线勾勒出屋顶与墙。回到「知识库」点「吞入内化」会让新卡片自动连进来。</div>'
        : '') +
      '  <div class="graph-stats">' +
      '    <div class="gs"><b data-count="' + g.nodes.filter((v) => v.real).length + '">' + g.nodes.filter((v) => v.real).length + '</b><span>笔记</span></div>' +
      '    <div class="gs"><b data-count="' + eCount + '">' + eCount + '</b><span>链接</span></div>' +
      '    <div class="gs"><b data-count="' + orphanCount + '">' + orphanCount + '</b><span>孤立笔记</span></div>' +
      '    <div class="gs"><b data-count="' + virtualCount + '">' + virtualCount + '</b><span>待创建</span></div>' +
      '  </div>' +
      '  <div class="graph-canvas' + (layoutMode.value === 'house' ? ' house-mode' : '') + '"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
      lines + dots +
      '  </svg></div>' +
      '  <div class="graph-tip">实线圆 = 已有笔记；虚线圆 = [[链接]] 指向但尚未创建的笔记，点击即可创建。</div>' +
      '</div>';
  }

  function bind(root) {
    const btn = root.querySelector('#graph-relayout');
    if (btn) btn.addEventListener('click', () => L.app.refresh());
    const houseBtn = root.querySelector('#graph-house');
    if (houseBtn) houseBtn.addEventListener('click', () => {
      layoutMode.value = layoutMode.value === 'house' ? 'force' : 'house';
      if (layoutMode.value === 'house' && L.pet) L.pet.observe('house'); // 行为沉淀
      if (L.app) L.app.refresh();
    });
    root.querySelectorAll('.g-node').forEach((g) => {
      g.addEventListener('click', () => {
        if (g.hasAttribute('data-open')) L.modules.notes.open(g.getAttribute('data-open'));
        else L.modules.notes.openByTitle(g.getAttribute('data-wiki'));
      });
    });

    /* W3 · 节点与边的交错入场统一由 U.stagger 驱动，节奏与热力图一致；
     * 统计数字为权威数据，只做统一淡入（见 finesse.css W3 段）。 */
    if (U.stagger) {
      U.stagger(root.querySelectorAll('.graph-canvas .g-edge'), 22);
      U.stagger(root.querySelectorAll('.graph-canvas .g-node'), 22);
    }
  }

  L.modules.graph = { render, bind };
})(window.LifeOS);

  }
  function timelineHTML() {
    const words = (state.data.words || []).slice().sort((a, b) => String(b.at).localeCompare(String(a.at)));
    let day = '';
    const rows = words.map((m) => {

  function statsHTML() {

  function paint() {

 * - Electron 桌面版：真实读写本机文件、执行 shell、运行 JS/Python

    { icon: '▶', text: '写一个 Python 脚本，统计工作区里每个文件的行数和大小' },

    const y = new Date(now.getTime() - 86400000);
