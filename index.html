  function stepMeta(name, args) {
    args = args || {};
    if (name === 'run_command') return { icon: '$', label: String(args.command || '命令'), kind: 'cmd' };
    if (name === 'write_file') return { icon: '✎', label: '写入 ' + String(args.path || '文件'), kind: 'write' };
    if (name === 'read_file') return { icon: '▤', label: '读取 ' + String(args.path || ''), kind: 'read' };
    if (name === 'list_files') return { icon: '⌗', label: '浏览 ' + String(args.path || '.'), kind: 'list' };
    if (name === 'run_code') return { icon: '▶', label: '运行 ' + String(args.language || '代码'), kind: 'run' };
    if (name === 'memory_search') return { icon: '◌', label: '检索识海 ' + String(args.q || args.day || args.emo || ''), kind: 'read' };
    if (name === 'memory_event') return { icon: '◎', label: '展开记忆 · ' + String(args.name || ''), kind: 'read' };
    if (name === 'memory_write') return { icon: '◉', label: '写入识海', kind: 'write' };
    if (name === 'memory_capture') return { icon: '◌', label: '后台沉淀本轮原话', kind: 'other' };
    return { icon: '⚙', label: String(name || '工具'), kind: 'other' };
  }

  function stepHTML(m) {
    const meta = stepMeta(m.name, m.args);
    const failed = /失败|错误|Error|Traceback|ENOENT|not found|拒绝|超时/i.test(String(m.result || ''));
    let body;
    let open = '';
    if (meta.kind === 'write' && m.args && typeof m.args.content === 'string') {
      const lines = m.args.content.split('\n');
      const shown = lines.slice(0, 80).map((l) => '<span class="d-add">+' + U.escapeHtml(l) + '</span>').join('');
      const more = lines.length > 80 ? '\n<span class="d-more">… 另有 ' + (lines.length - 80) + ' 行</span>' : '';
      body = '<div class="cx2-diff"><div class="cx2-diff-head">' +
        '<span>' + U.escapeHtml(String(m.args.path || '')) + '</span>' +
        '<span class="d-count">+' + lines.length + '</span></div>' +
        '<pre>' + shown + more + '</pre></div>';
      open = lines.length <= 24 ? ' open' : '';
    } else {
      body = '<pre class="cx2-out">' + U.escapeHtml(trunc(m.result || '(无输出)', 2600)) + '</pre>';
    }
    // 展开后给逐字证据：入参原样、耗时，不把工具结果改写成散文
    const evidence = '<div class="cx2-evidence">' +
      '<span>入参</span><code>' + U.escapeHtml(trunc(JSON.stringify(m.args || {}), 320)) + '</code>' +
      '<span>耗时</span><code>' + fmtDur(m.ms) + '</code></div>';
    if (failed) open = ' open';
    return '<details class="cx2-step cx2-step-' + meta.kind + '"' + (failed ? ' data-failed="1"' : '') + open + '>' +
      '<summary><span class="cx2-step-icon">' + meta.icon + '</span>' +
      '<span class="cx2-step-label">' + U.escapeHtml(meta.label) + '</span>' +
      '<span class="cx2-step-dur">' + fmtDur(m.ms) + '</span>' +
      '<span class="cx2-step-chev">›</span></summary>' + evidence + body + '</details>';
  }

  function msgHTML(m) {
    if (m.role === 'user') {
      return '<div class="cx2-msg cx2-user"><div class="cx2-bubble">' +
        U.escapeHtml(m.text).replace(/\n/g, '<br>') + '</div></div>';
    }
    if (m.role === 'assistant') {
      return '<div class="cx2-msg cx2-assistant"><div class="cx2-mark">◇</div>' +
        '<div class="cx2-md">' + U.markdown(m.text || '') + '</div></div>';
    }
    if (m.role === 'tool') return stepHTML(m);
    if (m.role === 'error') {
      return '<div class="cx2-msg cx2-error"><div class="cx2-md">! ' + U.escapeHtml(m.text) + '</div></div>';
    }
    return '';
  }

  function heroHTML() {
    const chips = SUGGESTIONS.map((s, i) =>
      '<button class="cx2-chip" data-sug="' + i + '"><span class="cx2-chip-ic">' + s.icon + '</span>' +
      '<span>' + U.escapeHtml(s.text) + '</span></button>'
    ).join('');
    return '<div class="cx2-hero">' +
      '<div class="cx2-hero-mark">◇</div>' +
      '<h1 class="cx2-hero-title">有什么可以帮你构建的？</h1>' +
      '<p class="cx2-hero-sub">' + (L.bridge.mode === 'electron'
        ? '描述一个任务。Agent 会读文件、写代码、跑命令，一步步做到通过为止。'
        : '网页版是演示回放：会展示 Agent 的执行形态，但不会按你的指令真正改动本机文件。') + '</p>' +
      '<div class="cx2-chips">' + chips + '</div>' +
      '<div class="cx2-hero-note">' + (L.bridge.mode === 'electron'
        ? '桌面端 · 可读写本机文件、执行命令'
        : '演示模式 · 固定 4 步回放，产物仅写入虚拟工作区 · 真实执行需 Electron 桌面版') + '</div>' +
      '</div>';
  }

  function workingHTML() {
    return '<div class="cx2-msg cx2-assistant cx2-working"><div class="cx2-mark">◇</div>' +
      '<div class="cx2-working-row"><span class="cx2-dot"></span><span class="cx2-dot"></span><span class="cx2-dot"></span>' +
      '<span class="cx2-working-text">' + (state.mode === 'chat' ? '思考中' : '正在工作') + '</span></div></div>';
  }

  function scrollBottom() {
    const sc = document.getElementById('cx2-scroll');
    if (sc) sc.scrollTop = sc.scrollHeight;
  }

  function renderThread() {
    const box = document.getElementById('cx2-thread');
    if (!box) return;
    const t = activeTask();
    const msgs = (t && t.messages) || [];
    box.innerHTML = msgs.length
      ? msgs.map(msgHTML).join('') + (state.busy && state.busyTaskId === state.activeId ? workingHTML() : '') + receiptHTML(t)
      : heroHTML();

    const title = document.getElementById('cx2-title');
    if (title) title.textContent = t ? t.title : '新任务';
    const sub = document.getElementById('cx2-sub');
    const toolSteps = msgs.filter((m) => m.role === 'tool').length;
    if (sub) sub.textContent = t ? (msgs.length ? (toolSteps ? toolSteps + ' 步操作 · ' : '') + relTime(t.createdAt) : '未开始') : '开始一个新任务';

    box.querySelectorAll('[data-sug]').forEach((b) => {
      b.addEventListener('click', () => {
        const s = SUGGESTIONS[Number(b.getAttribute('data-sug'))];
        const ta = document.getElementById('cx2-input');
        if (s && ta) { ta.value = s.text; ta.focus(); autoGrow(ta); }
      });
    });
    scrollBottom();
  }

  function renderTasks() {
    const box = document.getElementById('cx2-tasks');
    if (!box) return;
    if (!state.tasks.length) {
      // 空状态也把三种时态摆在同一屏，不让「排队 / 今天 / 更早」需要一个点击才出现
      box.innerHTML =
        '<div class="cx2-group" data-state="running"><span class="cx2-group-label">正在运行</span> · 0</div>' +
        '<div class="cx2-hint">当前没有运行中的任务</div>' +
        '<div class="cx2-group" data-state="today"><span class="cx2-group-label">今天</span> · 0</div>' +
        '<div class="cx2-hint">还没有任务，在下面输入第一句</div>' +
        '<div class="cx2-group" data-state="past"><span class="cx2-group-label">更早</span> · 0</div>' +
        '<div class="cx2-hint">任务在本机顺序执行，没有后台队列</div>';
      return;
    }
    // 三时态同屏：正在运行 / 今天 / 更早。没有队列机制就如实说明，不虚构排队。
    const midnight = new Date(); midnight.setHours(0, 0, 0, 0);
    const running = [], today = [], past = [];
    state.tasks.forEach((t) => {
      if (state.busy && t.id === state.busyTaskId) running.push(t);
      else if ((t.updatedAt || 0) >= midnight.getTime()) today.push(t);
      else past.push(t);
    });
    const item = (t) => {
      const on = t.id === state.activeId ? ' on' : '';
      const dot = state.busy && t.id === state.busyTaskId ? '<span class="cx2-live" aria-label="运行中"></span>' : '';
      return '<div class="cx2-task' + on + '" data-task="' + U.escapeHtml(t.id) + '">' +
        '<span class="cx2-task-title">' + U.escapeHtml(t.title) + '</span>' + dot +
        '<button class="cx2-task-del" data-del="' + U.escapeHtml(t.id) + '" title="删除任务" aria-label="删除任务">×</button>' +
        '</div>';
    };
    const group = (label, list, key) => list.length
      ? '<div class="cx2-group" data-state="' + key + '"><span class="cx2-group-label">' + label + '</span> · ' + list.length + '</div>' + list.map(item).join('')
      : '';
    box.innerHTML =
      '<div class="cx2-group" data-state="running"><span class="cx2-group-label">正在运行</span> · ' + running.length + '</div>' +
      (running.length ? running.map(item).join('') : '<div class="cx2-hint">当前没有运行中的任务</div>') +
      group('今天', today, 'today') + group('更早', past, 'past') +
      '<div class="cx2-hint">任务在本机顺序执行，没有后台队列</div>';
  }

  /* ---------------- 发送 ---------------- */
  function chatSystem() {
    let sys = '你是一名资深软件工程师，用简体中文简洁、准确地回答编程问题。';
    const f = state.file;
    if (f && f.content) {
      sys += '\n\n当前查看的文件：' + f.rel + '\n```\n' + String(f.content).slice(0, 4000) + '\n```';
    }
    return sys;
  }

  function captureBrowser(task, messages) {
    if (L.bridge.mode === 'electron' || S.state.settings.mindseaAuto === false) return;
    L.bridge.mindsea.capture({ messages, settings: S.state.settings }).then((r) => {
      task.messages.push({ role: 'tool', name: 'memory_capture', args: { mode: r.mode || 'local' }, result: r.ok === false ? '沉淀失败：' + (r.errors || []).join('；') : '识海已沉淀 ' + (r.written || 0) + ' 条原话', ts: Date.now() });
      saveTasks();
      if (state.activeId === task.id) renderThread();
    }).catch((e) => {
      task.messages.push({ role: 'tool', name: 'memory_capture', args: {}, result: '识海沉淀失败：' + (e.message || e), ts: Date.now() });
      saveTasks();
      if (state.activeId === task.id) renderThread();
    });
  }

  function submit() {
    if (state.busy) { U.toast('Agent 正在运行，等这一步完成再发', 'error'); return; }
    const ta = document.getElementById('cx2-input');
    const text = (ta ? ta.value : '').trim();
    if (!text) return;

    const task = ensureTask(text);
    const captureFrom = task.messages.length;
    const includeMemoryTail = !task.messages.some((m) => m.role === 'user' || m.role === 'assistant');
    const runStart = Date.now();
    let lastAt = runStart;
    task.receipt = null;
    task.stopped = false;
    task.messages.push({ role: 'user', text, ts: Date.now() });
    task.title = brief(text);
    task.updatedAt = Date.now();
    state.tasks = [task].concat(state.tasks.filter((x) => x.id !== task.id));
    state.activeId = task.id;

    if (ta) { ta.value = ''; autoGrow(ta); }
    state.busy = true;
    state.busyTaskId = task.id;
    saveTasks(); renderTasks(); renderThread(); updateStop();

    const payload = {
      mode: state.mode,
      user: text,
      settings: S.state.settings,
      includeMemoryTail,
      system: state.mode === 'chat' ? chatSystem() : undefined
    };

    L.bridge.agent.runAgent(payload, (e) => {
      if (task.stopped) return;
      const now = Date.now();
      const stepMs = now - lastAt; lastAt = now;
      if (e.type === 'event') {
        const d = e.data || {};
        if (d.type === 'assistant') {
          if (d.text && String(d.text).trim()) {
            task.messages.push({ role: 'assistant', text: d.text, ts: now });
          }
        } else if (d.type === 'tool') {
          task.messages.push({ role: 'tool', name: d.name, args: d.args, result: d.result, ms: stepMs, ts: now });
          if (d.name === 'write_file' || d.name === 'run_command') reloadTree();
        }
        renderThread();
      } else if (e.type === 'done') {
        const fin = (e.data && e.data.finalAnswer) || '';
        const last = task.messages[task.messages.length - 1];
        if (fin && !(last && last.role === 'assistant' && last.text === fin)) {
          task.messages.push({ role: 'assistant', text: fin, ts: now });
        }
        task.receipt = {
          steps: task.messages.slice(captureFrom).filter((m) => m.role === 'tool').length,
          ms: Date.now() - runStart,
          mode: L.bridge.mode
        };
        state.busy = false;
        state.busyTaskId = null;
        task.updatedAt = Date.now();
        saveTasks(); renderTasks(); renderThread(); reloadTree(); updateStop();
        captureBrowser(task, task.messages.slice(captureFrom));
      } else if (e.type === 'error') {
        task.messages.push({ role: 'error', text: String(e.data || '发生错误'), ts: now });
        task.receipt = {
          steps: task.messages.slice(captureFrom).filter((m) => m.role === 'tool').length,
          ms: Date.now() - runStart, mode: L.bridge.mode, stopped: true
        };
        state.busy = false;
        state.busyTaskId = null;
        saveTasks(); renderTasks(); renderThread(); updateStop();
      }
    });
  }

  function autoGrow(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    if (!state.loaded) { loadPrefs(); loadTasks(); }
    const modeAgent = state.mode === 'agent' ? ' on' : '';
    const modeChat = state.mode === 'chat' ? ' on' : '';

    return '' +
      '<div class="cx2">' +
      '  <aside class="cx2-rail">' +
      '    <div class="cx2-rail-head">' +
      '      <span class="cx2-logo">◇</span><span class="cx2-brand">Codex</span>' +
      '      <button class="cx2-iconbtn" id="cx2-back" title="返回 LifeOS">←</button>' +
      '    </div>' +
      '    <button class="cx2-team-btn' + (state.teamOpen ? ' on' : '') + '" id="cx2-team-btn" ' +
      'title="老板视角：查看 Agent 团队分工与占用">◆ 团队 ' + (state.busy ? '●' : '○') + '</button>' +
      (state.teamOpen ? teamBoardHTML() : '') +
      '    <button class="cx2-new" id="cx2-new"><span>＋</span> 新建任务</button>' +
      '    <div class="cx2-tasklist" id="cx2-tasks"></div>' +
      '    <div class="cx2-rail-foot">' +
      '      <button class="cx2-ws" id="cx2-openws" title="选择工作区目录">' +
      '        <span class="cx2-ws-label">工作区</span>' +
      '        <span class="cx2-ws-path" id="cx2-wspath">' + U.escapeHtml(shortPath(state.root || '加载中…')) + '</span>' +
      '      </button>' +
      '      <div class="cx2-rail-note">任务与文件都在本机</div>' +
      '    </div>' +
      '  </aside>' +

      '  <section class="cx2-main">' +
      '    <header class="cx2-head">' +
      '      <div class="cx2-head-text">' +
      '        <div class="cx2-title" id="cx2-title">新任务</div>' +
      '        <div class="cx2-sub" id="cx2-sub">开始一个新任务</div>' +
      '      </div>' +
      '      <button class="cx2-ghost' + (state.filesOpen ? ' on' : '') + '" id="cx2-toggle-files">工作区</button>' +
      '    </header>' +
      '    <div class="cx2-body">' +
      '      <div class="cx2-chat">' +
      '        <div class="cx2-scroll" id="cx2-scroll"><div class="cx2-thread" id="cx2-thread"></div></div>' +
      '        <div class="cx2-composer-wrap">' +
      '          <div class="cx2-composer">' +
      '            <textarea id="cx2-input" rows="1" placeholder="描述任务，或直接提问…"></textarea>' +
      '            <div class="cx2-bar">' +
      '              <div class="cx2-seg">' +
      '                <button data-mode="agent" class="' + modeAgent.trim() + '">Agent</button>' +
      '                <button data-mode="chat" class="' + modeChat.trim() + '">问答</button>' +
      '              </div>' +
      '              <span class="cx2-model">' + U.escapeHtml(S.state.settings.aiModel || 'gpt-4o-mini') + '</span>' +
      '              <button class="cx2-stop" id="cx2-stop" disabled title="停止本次运行">停止</button>' +
      '              <button class="cx2-send" id="cx2-send" title="发送（Enter）">↑</button>' +
      '            </div>' +
      '          </div>' +
      '          <div class="cx2-foot-hint">Enter 发送 · Shift+Enter 换行 · 每一步都有耗时与入参，停止按钮一直在这里</div>' +
      '        </div>' +
      '      </div>' +
      '      <aside class="cx2-files" id="cx2-files" hidden>' +
      '        <div class="cx2-files-head">' +
      '          <span>工作区</span>' +
      '          <button class="cx2-mini" id="cx2-refresh" title="刷新">↻</button>' +
      '          <button class="cx2-mini" id="cx2-newfile" title="新建文件">＋</button>' +
      '        </div>' +
      '        <div class="cx2-tree" id="cx2-tree"></div>' +

  function bind(root) {
    if (!state.loaded) { loadPrefs(); loadTasks(); }
    if (!state.loaded) reloadTree(); else { renderTree(); }

    renderTasks();
    renderThread();
    renderFilesPanel();
    updateStop();

    // 常驻停止：先在一帧内把界面置为 stopped，不等待后台回应
    const stopBtn = root.querySelector('#cx2-stop');
    if (stopBtn) stopBtn.addEventListener('click', () => {
      if (!state.busy) return;
      const t = activeTask();
      if (t) {
        t.stopped = true;
        t.receipt = { steps: t.messages.filter((m) => m.role === 'tool').length, ms: null, mode: L.bridge.mode, stopped: true };
        t.updatedAt = Date.now();
      }
      state.busy = false;
      state.busyTaskId = null;
      saveTasks(); renderTasks(); renderThread(); updateStop();
      U.toast(L.bridge.mode === 'electron'
        ? '已停止接收新步骤；正在执行的命令会自然结束'
        : '已停止本次演示运行');
    });

    // 概念 7：老板视角团队看板开关
    const teamBtn = root.querySelector('#cx2-team-btn');
    if (teamBtn) teamBtn.addEventListener('click', () => {
      state.teamOpen = !state.teamOpen;
      if (state.teamOpen && L.pet) L.pet.observe('delegate'); // 行为沉淀
      if (L.app) L.app.refresh();
    });
    const tmClose = root.querySelector('#tm-close');
    if (tmClose) tmClose.addEventListener('click', () => { state.teamOpen = false; if (L.app) L.app.refresh(); });

    const back = root.querySelector('#cx2-back');
    if (back) back.addEventListener('click', () => L.app.showView('dashboard'));

    root.querySelector('#cx2-new').addEventListener('click', () => {
      state.activeId = null;
      renderTasks(); renderThread();
      const ta = document.getElementById('cx2-input');
      if (ta) ta.focus();
    });

    root.querySelector('#cx2-toggle-files').addEventListener('click', () => {
      state.filesOpen = !state.filesOpen;
      savePrefs();
      renderFilesPanel();
    });

    root.querySelector('#cx2-openws').addEventListener('click', async () => {
      const r = await L.bridge.agent.openWorkspace();
      if (r && r.root) {
        state.root = r.root;
        state.listing = r.listing || [];
        state.file = null;
        renderTree();
        const p = document.getElementById('cx2-wspath');
        if (p) p.textContent = shortPath(r.root);
        renderViewer();
      }
    });

    root.querySelector('#cx2-refresh').addEventListener('click', reloadTree);

    root.querySelector('#cx2-newfile').addEventListener('click', async () => {
      const name = window.prompt('新建文件名（相对工作区，如 src/a.js）：');
      if (!name || !name.trim()) return;
      try {
        await L.bridge.agent.write(name.trim(), '');
        await reloadTree();
        await openFile(name.trim());
      } catch (e) { U.toast(e.message || '创建失败', 'error'); }
    });

    // 任务列表：切换 / 删除
    root.querySelector('#cx2-tasks').addEventListener('click', async (e) => {
      const del = e.target.closest('[data-del]');
      if (del) {
        e.stopPropagation();
        const id = del.getAttribute('data-del');
        const task = state.tasks.filter((t) => t.id === id)[0];
        const title = task ? task.title : '该任务';
        // 概念 5 点头原则：删任务也算危险操作，走「子宠物申请 → 主控点头」双阶段
        const allowed = (L.pet && L.pet.requestApproval)
          ? await L.pet.requestApproval({ desc: '删除 Codex 任务「' + title + '」' })
          : await U.confirm('删除任务「' + title + '」？');
        if (!allowed) return;
        state.tasks = state.tasks.filter((t) => t.id !== id);
        if (state.activeId === id) state.activeId = state.tasks[0] ? state.tasks[0].id : null;
        saveTasks(); renderTasks(); renderThread();
        return;
      }
      const item = e.target.closest('[data-task]');
      if (item) {
        state.activeId = item.getAttribute('data-task');
        state.file = null;
        savePrefs(); renderTasks(); renderThread(); renderViewer();
      }
    });

    // 文件树
    root.querySelector('#cx2-tree').addEventListener('click', (e) => {
      const leaf = e.target.closest('[data-file]');
      if (leaf) { openFile(leaf.getAttribute('data-file')); return; }
      const dir = e.target.closest('[data-dir]');
      if (dir) {
        const rel = dir.getAttribute('data-dir');
        const box = root.querySelector('[data-children="' + rel.replace(/"/g, '\\"') + '"]');
        const caret = dir.querySelector('.cx2-caret');
        if (box) {
          const hidden = box.hasAttribute('hidden');
          if (hidden) box.removeAttribute('hidden'); else box.setAttribute('hidden', '');
          if (caret) caret.textContent = hidden ? '▾' : '▸';
        }
      }
    });

    // 模式切换
    root.querySelectorAll('.cx2-seg button').forEach((b) => {
      b.addEventListener('click', () => {
        state.mode = b.getAttribute('data-mode');
        savePrefs();
        root.querySelectorAll('.cx2-seg button').forEach((x) => x.classList.toggle('on', x === b));
      });
    });

    root.querySelector('#cx2-send').addEventListener('click', submit);

    const ta = root.querySelector('#cx2-input');
    ta.addEventListener('input', () => autoGrow(ta));

  function buildSystem() {
    const st = S.state;
    const name = st.settings.userName ? st.settings.userName + '，' : '';

    const open = st.tasks.filter((t) => t.status !== 'done');
    if (open.length) {
      ctx += '\n\n【我的任务】\n' + open.map((t) =>
        '- ' + t.title + '（优先级：' + ({ high: '高', medium: '中', low: '低' }[t.priority] || '中') +
        (t.due ? '，截止 ' + t.due : '') + (t.tags && t.tags.length ? '，标签 ' + t.tags.join('/') : '') + ')'
      ).join('\n');
    }
    if (st.habits.length) {
      ctx += '\n\n【我的习惯】\n' + st.habits.map((h) => {
        const c = h.checkins || {};
        let n = 0; const d = new Date();
        while (true) { const off = d.getTimezoneOffset() * 60000; const k = new Date(d.getTime() - off).toISOString().slice(0, 10); if (c[k]) { n++; d.setDate(d.getDate() - 1); } else break; }
        return '- ' + (h.emoji || '') + h.name + '（当前连续 ' + n + ' 天）';
      }).join('\n');
    }
    const recent = st.notes.slice(0, 5);
    if (recent.length) {
      ctx += '\n\n【近期笔记（节选）】\n' + recent.map((n) => '《' + n.title + '》：' + (n.body || '').slice(0, 200)).join('\n---\n');

      if (pet) {
        const gear = L.pet.gearOf(pet.equip);
        const PERSONA = {
          scholar: '你现在佩戴「学者帽」：回答注重引用来源、区分事实与推测，优先从用户笔记与知识库中找依据，没有依据就明说。',
          cleaner: '你现在佩戴「清道夫」：专注识别重复、过期与冗余内容；你只能提出清理建议，绝不擅自删除——任何删除都必须经主控点头授权。',
          banker: '你现在佩戴「庄家领结」：善于把大任务拆成可执行的小步骤，指出哪些步骤可并行、哪些有依赖，并提醒成本与失败兜底。',
          twin: '你现在是用户的「数字分身」：语气和判断贴近用户本人，优先复用他的既有习惯与偏好，而不是套用通用模板。',
          none: ''
        };
        if (PERSONA[gear.id]) ctx += '\n\n【当前装备的专家身份】\n' + PERSONA[gear.id];

        // 概念 8 数字分身：把从真实行为学到的偏好注入 System Prompt
        const skills = L.pet.userSkills();
        if (skills.length) {
          ctx += '\n\n【从用户行为学到的偏好（数字分身）】\n' + skills.map((s) => '- ' + s).join('\n');

  }

  function send(userText, opts) {
    opts = opts || {};
    if (busy) { U.toast('请等待上一条回复完成', 'error'); return; }
    const text = (userText || '').trim();
    if (!text) return;

    // 追加用户消息
    S.pushAI({ role: 'user', content: text });
    // 创建助手占位消息
    streamingMsg = { role: 'assistant', content: '', ts: Date.now() };
    S.state.aiThread.push(streamingMsg);
    busy = true;
    L.app.refresh();

    // 流式占位消息（空 content 的 assistant）不能发给模型：
    // 否则演示回复会复读成「你刚才说：""」，真实接口也可能拒绝空消息。
    const messages = [{ role: 'system', content: buildSystem() }].concat(
      S.state.aiThread
        .filter((m) => m !== streamingMsg && !(m.role === 'assistant' && !m.content))
        .map((m) => ({ role: m.role, content: m.content }))
    );
    L.bridge.aiChat({ messages, settings: S.state.settings });
  }

  function onAIEvent(e) {
    if (!streamingMsg) return;
    if (e.type === 'chunk') {
      streamingMsg.content += e.data;
      renderStreaming();
    } else if (e.type === 'done') {
      const finished = streamingMsg;
      busy = false; streamingMsg = null;
      S.persist();
      if (finished && finished.content && S.state.settings.mindseaAuto !== false) {
        const previous = S.state.aiThread[S.state.aiThread.length - 2];
        L.bridge.mindsea.capture({ messages: [previous, finished].filter(Boolean).map((m) => ({ role: m.role, text: m.content, ts: m.ts })), settings: S.state.settings }).catch(() => {});
      }
      L.app.refresh();
    } else if (e.type === 'error') {
      streamingMsg.content += '\n\n! ' + e.data;
      busy = false; streamingMsg = null;
      S.persist();
      L.app.refresh();
      U.toast('AI 调用遇到问题', 'error');

    const box = document.getElementById('ai-messages');
    if (box) {

      '    <div class="spacer"></div>' +

      '    <button class="btn ghost" id="ai-clear">清空对话</button>' +

            U.escapeHtml(e.glyph) + ' ' + U.escapeHtml(e.name) + '</button>').join('') +
          '</div>';
      })() : '') +
      '  <div class="ai-messages" id="ai-messages">' + msgs + '</div>' +
      '  <div class="ai-quick">' +
      '    <button class="chip" data-act="plan">▦ 规划今天</button>' +
      '    <button class="chip" data-act="summary">▤ 总结笔记</button>' +

  function askImportMode(parsed) {
    return new Promise((resolve) => {
      let done = false;
      const c = U.escapeHtml(countLine(parsed.counts || {
        tasks: parsed.data.tasks.length, habits: parsed.data.habits.length,
        notes: parsed.data.notes.length, library: parsed.data.library.length,
        events: (parsed.data.events || []).length, ai: parsed.data.aiThread.length
      }));
      const exp = parsed.exportedAt ? '<br />备份时间：' + U.escapeHtml(new Date(parsed.exportedAt).toLocaleString()) : '';
      const close = U.modal({
        title: '导入备份',
        bodyHTML: '<p class="confirm-text">备份内容：' + c + exp + '</p>' +
          '<p class="hint" style="margin-top:10px"><b>合并</b>：保留现有数据，按 ID 追加缺失项（推荐）。<br />' +
          '<b>覆盖</b>：用备份完全替换当前数据。<br />两种方式都会先自动保存一份恢复快照。</p>' +
          '<div class="modal-actions">' +
          '  <button class="btn ghost" data-act="cancel">取消</button>' +
          '  <button class="btn" data-act="merge">合并导入</button>' +
          '  <button class="btn danger" data-act="replace">覆盖导入</button>' +
          '</div>',
        onMount(root, cl) {
          const pick = (mode) => { done = true; cl(); resolve(mode); };
          root.querySelector('[data-act="cancel"]').addEventListener('click', () => pick(null));
          root.querySelector('[data-act="merge"]').addEventListener('click', () => pick('merge'));
          root.querySelector('[data-act="replace"]').addEventListener('click', () => pick('replace'));
        },
        onClose() { if (!done) resolve(null); }
      });
      return close;
    });
  }

  function bind(root) {
    root.querySelector('#s-theme').addEventListener('change', (e) => {
      L.app.applyTheme(e.target.value);
    });
    root.querySelector('#s-open-mindsea').addEventListener('click', () => L.app.showView('mindsea'));
    const a2aBtn = root.querySelector('#s-a2a-refresh');
    if (a2aBtn && L.pet) a2aBtn.addEventListener('click', () => {
      L.pet.update((s) => {
        s.inbox.unshift({
          id: 'm-' + Date.now().toString(36),
          from: '@远方的宠物 · 演示',
          text: '（本地模拟来信）你的「' + (S.state.notes[0] ? U.escapeHtml(S.state.notes[0].title) : '知识卡片') + '」整理得不错，已同步摘要。',
          status: '已校验'
        });
        s.inbox = s.inbox.slice(0, 20);
      });
      U.toast('已模拟一次 A2A 来信（trace-id 已记录）');
      L.app.refresh();
    });
    const clearKey = root.querySelector('#s-clear-key');
    if (clearKey) clearKey.addEventListener('click', async () => {
      if (await U.confirm('确定清除已保存的 API Key？')) {
        S.setSettings({ aiKey: '' });
        const keyEl = root.querySelector('#s-key');
        keyEl.value = '';
        keyEl.placeholder = 'sk-...';
        U.toast('已清除密钥');
        L.app.updateAIStatus();
      }
    });
    const clearSeed = root.querySelector('#s-clear-seed');
    if (clearSeed) clearSeed.addEventListener('click', async () => {
      const n = L.seedLibrary.count(S);
      if (await U.confirm('清除 ' + n + ' 条内置示例内容？你自己采集或编辑的内容不会受影响。', '清除')) {
        const removed = L.seedLibrary.clear(S);
        U.toast('已清除 ' + removed + ' 条示例内容');
        L.app.refresh();
      }
    });
    root.querySelector('#s-save').addEventListener('click', () => {
      const keyInput = root.querySelector('#s-key').value.trim();
      const patch = {
        aiBaseUrl: root.querySelector('#s-base').value.trim(),
        aiKey: keyInput || S.state.settings.aiKey || '',
        aiModel: root.querySelector('#s-model').value.trim() || 'gpt-4o-mini',
        userName: root.querySelector('#s-name').value.trim(),
        theme: root.querySelector('#s-theme').value,
        mindseaAuto: root.querySelector('#s-mindsea-auto').checked,
        mindseaAI: root.querySelector('#s-mindsea-ai').checked
      };
      const sessionBox = root.querySelector('#s-key-session');
      if (sessionBox) patch.aiKeySessionOnly = sessionBox.checked;
      S.setSettings(patch);
      U.toast('设置已保存');
      L.app.updateAIStatus();
    });

    /* 导出 */
    root.querySelector('#s-export').addEventListener('click', () => {
      const name = S.downloadBackup();
      try { DB.setItem('lifeos-backup-tip-done', '1'); } catch (_) { /* noop */ }
      U.toast('已导出 ' + name);
    });

    /* 导入 */
    const file = root.querySelector('#s-file');
    root.querySelector('#s-import').addEventListener('click', () => file.click());
    file.addEventListener('change', async () => {
      const f = file.files && file.files[0];
      if (!f) return;
      try {
        const text = await f.text();
        const parsed = S.parseImport(text);
        const mode = await askImportMode(parsed);
        if (!mode) { file.value = ''; return; }
        await S.importPayload(text, mode);
        U.toast(mode === 'merge' ? '已合并导入' : '已覆盖导入');
        setTimeout(() => location.reload(), 600);
      } catch (e) {
        U.toast('导入失败：' + (e && e.message ? e.message : String(e)), 'error');
        file.value = '';
      }
    });

    /* 快照 */
    root.querySelector('#s-snapshot').addEventListener('click', () => {
      if (S.makeSnapshot('手动快照')) { U.toast('快照已创建'); L.app.refresh(); }
      else U.toast('快照写入失败（存储空间不足）', 'error');
    });
    root.querySelector('#s-clear-snap').addEventListener('click', async () => {
      if (!S.snapshotList().length) { U.toast('暂无快照'); return; }
      if (await U.confirm('清空所有本地快照？此操作不可撤销（当前数据不受影响）。', '清空')) {
        S.clearSnapshots(); U.toast('快照已清空'); L.app.refresh();
      }
    });
    root.querySelectorAll('.snap-restore').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-snap');
        if (await U.confirm('恢复到该快照？当前数据会先自动存一份快照。', '恢复')) {
          await S.restoreSnapshot(id);
          U.toast('已恢复快照');
          setTimeout(() => location.reload(), 600);
        }
      });
    });

    /* W1 · 存储引擎：迁移前强制导出备份 + 三态切换 + 一键回滚。
     * 地址栏 ?storage= 覆盖优先级最高，切换时一并去掉该参数，否则新设置不生效。 */
    const reloadWithoutOverride = () => {
      try {
        const u = new URL(location.href);
        if (u.searchParams.has('storage')) {
          u.searchParams.delete('storage');
          location.replace(u.toString());
          return;
        }
      } catch (_) { /* 老浏览器不支持 URL 时退化为普通刷新 */ }
      location.reload();
    };
    const applyBtn = root.querySelector('#s-storage-apply');
    if (applyBtn && L.storage) applyBtn.addEventListener('click', async () => {
      const target = root.querySelector('#s-storage-mode').value;
      if (!await U.confirm('切换存储模式前会先导出一份 JSON 备份，然后刷新生效。确认继续？', '切换')) return;
      // 迁移前兜底：强制导出，导出失败则中止切换（不允许无备份迁移）
      try {
        const name = S.downloadBackup();
        U.toast('已导出备份 ' + name);
      } catch (e) {
        U.toast('备份导出失败，已中止切换：' + (e && e.message ? e.message : String(e)), 'error');
        return;
      }
      L.storage.setMode(target);
      setTimeout(reloadWithoutOverride, 700);
    });
    const rollbackBtn = root.querySelector('#s-storage-rollback');
    if (rollbackBtn && L.storage) rollbackBtn.addEventListener('click', async () => {
      if (!await U.confirm('切回旧存储（仅 localStorage）？IndexedDB 冗余数据会保留，随时可切回。', '回滚')) return;
      L.storage.rollback();
      U.toast('已切回旧存储');
      setTimeout(reloadWithoutOverride, 700);
    });
  }

  L.modules.settings = { render, bind };
})(window.LifeOS);

/* =========================================================================
 * LifeOS · 全局检索面板 UI（W2 · B4）
 *
 * 顶栏按钮或 Ctrl/Cmd+K 打开。聚合 L.search.searchAll 的跨实体结果，
 * 识海侧通过 L.mindsea.exportData() 拿本机原话快照（只读，不改动识海）。
 * 不新增导航视图、不替换既有 ms-search / note-search。
 * ========================================================================= */
window.LifeOS = window.LifeOS || {};
LifeOS.modules = LifeOS.modules || {};

(function (L) {
  'use strict';
  const U = L.utils;
  const S = L.store;

  let cachedMindsea = null;

  async function mindseaSnapshot() {
    try {
      if (!L.mindsea || !L.mindsea.exportData) return [];
      const d = await L.mindsea.exportData();
      cachedMindsea = (d && d.data && d.data.memories) || [];
      return cachedMindsea;
    } catch (e) { return cachedMindsea || []; }
  }

  function resultHTML(results, q) {
    if (!q) return '<div class="gs-idle">输入关键词，检索笔记 · 知识库 · 任务 · 日程 · AI 对话 · 识海记忆</div>';
    if (!results.length) return '<div class="gs-empty">没有找到「' + U.escapeHtml(q) + '」相关内容</div>';
    let lastType = null, html = '';
    results.forEach((r, i) => {
      if (r.type !== lastType) {
        html += '<div class="gs-group">' + U.escapeHtml(r.icon + ' ' + r.label) + '</div>';
        lastType = r.type;
      }
      html += '<button class="gs-item" data-gs-i="' + i + '">' +
        '  <div class="gs-item-t">' + L.search.highlight(r.title, q) + '</div>' +
        '  <div class="gs-item-s">' + L.search.highlight(r.snippet, q) + '</div>' +
        '</button>';
    });
    return html;
  }

  function open() {
    const close = U.modal({
      title: '全局检索',
      wide: true,
      bodyHTML: '' +
        '<div class="gs-wrap">' +
        '  <input id="gs-input" class="input gs-input" placeholder="搜索全部内容…（Ctrl/⌘ + K）" autocomplete="off"/>' +
        '  <div class="gs-meta" id="gs-meta"></div>' +
        '  <div class="gs-results" id="gs-results"></div>' +
        '</div>',
      onMount(mRoot) {
        const input = mRoot.querySelector('#gs-input');
        const box = mRoot.querySelector('#gs-results');
        const meta = mRoot.querySelector('#gs-meta');
        let latest = [];
        const run = () => {
          const q = input.value.trim();
          latest = L.search.searchAll(q, S.state, cachedMindsea || []);
          box.innerHTML = resultHTML(latest, q);
          const counts = L.search.groupCounts(latest);
          meta.textContent = q
            ? ('共 ' + latest.length + ' 条 · ' + (Object.keys(counts).map((k) => k + ' ' + counts[k]).join(' · ') || '—'))
            : '按类型分组，点击结果跳转到对应视图';
          box.querySelectorAll('.gs-item').forEach((btn) => {
            btn.addEventListener('click', () => {
              const r = latest[Number(btn.getAttribute('data-gs-i'))];
              if (!r) return;
              close();
              if (r.type === 'note' && L.modules.notes && L.modules.notes.open) L.modules.notes.open(r.id);
              else if (r.type === 'event' && L.modules.calendar && L.modules.calendar.go) {
                const ev = (S.state.events || []).find((e) => e.id === r.id);
                L.modules.calendar.go(ev ? ev.date : U.todayStr());
              } else L.app.showView(r.view);
            });
          });
        };
        input.addEventListener('input', U.debounce(run, 120));
        run();
        // 识海快照异步到位后再刷新一次（首次打开时可能还没缓存）
        mindseaSnapshot().then(() => { if (input.value.trim()) run(); });
      }
    });
    return close;
  }

  L.modules.search = { open: open, resultHTML: resultHTML, mindseaSnapshot: mindseaSnapshot };
})(window.LifeOS);

/* =========================================================================

window.LifeOS = window.LifeOS || {};

(function (L) {
  'use strict';
  const U = L.utils;
  const S = L.store;
  // 统一存储适配层：未加载 storage.js 时（如单测）无缝回落原生 localStorage
  const DB = L.storage || localStorage;

  const TITLES = {
    dashboard: '总览',
    tasks: '任务待办',
    habits: '习惯打卡',
    notes: '笔记日记',
    library: '知识库',
    calendar: '日历',
    heatmap: '活动热力图',
    graph: '知识图谱',
    mindsea: '识海记忆',
    codex: 'Codex',
    ai: 'AI 助手',
    settings: '设置'
  };

  const app = {
    current: 'dashboard',

    async init() {
      // W1：存储适配层启动迁移 / IDB 回填，必须在读数据之前完成。
      // 内部对无 indexedDB / 报错场景自动降级 legacy，不阻塞启动。
      if (L.storage && L.storage.hydrate) {
        try { await L.storage.hydrate(); } catch (_) { /* 已自动降级 */ }
      }
      await S.init();
      // PetOS：桌宠伙伴内核从独立 key 载入（故障与主数据隔离，损坏不影响启动）
      if (L.pet) { try { L.pet.load(); } catch (_) { /* 隔离失败也不阻塞主应用 */ } }
      // 首次启动注入内置知识内容（只注入一次，用户清空后不自动灌回）
      if (L.seedLibrary) L.seedLibrary.ensure(S);
      this.applyTheme(S.state.settings.theme || 'auto');
      this.bindNav();
      this.bindThemeToggle();
      // 支持深链：打开 #codex 等地址直接定位到对应视图
      const hash = (location.hash || '').replace(/^#/, '');
      this.showView(TITLES[hash] ? hash : 'dashboard');
      this.updateAIStatus();
      // PetOS：全局悬浮伙伴挂载（跨视图常驻）+ 生活事件监听（看见你做的事）
      if (L.petRenderer) {
        try {
          L.petRenderer.mountCompanion();
          L.petRenderer.watchLife();
        } catch (_) { /* 悬浮伙伴失败不阻塞主应用 */ }
      }
      // 深链与前进/后退：地址栏 hash 变化时同步切换视图（以前只在启动时读一次）
      window.addEventListener('hashchange', () => {
        const h = (location.hash || '').replace(/^#/, '');
        if (TITLES[h] && h !== app.current) app.showView(h, true);
      });
      // 多标签同步：其他标签页写入数据时重新载入，避免旧视图把新数据覆盖回去
      window.addEventListener('storage', (e) => {
        if (!e.key || e.key.indexOf('lifeos-') !== 0 || S._saving) return;
        (async () => {
          try {
            // 先让存储适配层的内存缓存失效并重读 localStorage，避免拿到本标签旧值
            if (L.storage && L.storage.onExternalChange) L.storage.onExternalChange(e.key);
            await S.init();
            this.updateAIStatus();
            this.refresh();
            U.toast('已同步其他标签页的更新');
          } catch (_) { /* 数据暂不可读时保持当前视图 */ }
        })();
      });
    },

    bindNav() {
      document.querySelectorAll('#nav .nav-item').forEach((b) => {
        b.addEventListener('click', () => {
          this.showView(b.getAttribute('data-view'));
          this.closeNavDrawer();
        });
      });
      const toggle = document.getElementById('nav-toggle');
      const scrim = document.getElementById('nav-scrim');
      const sidebar = document.querySelector('.sidebar');
      if (toggle) toggle.addEventListener('click', () => {
        const open = sidebar.classList.toggle('open');
        if (scrim) scrim.classList.toggle('show', open);
        toggle.setAttribute('aria-expanded', String(open));
      });
      if (scrim) scrim.addEventListener('click', () => this.closeNavDrawer());
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape' || document.querySelector('.modal-overlay.show')) return;
        if (sidebar && sidebar.classList.contains('open')) this.closeNavDrawer();
      });
      // W2 · B4 全局检索：顶栏按钮 + Ctrl/⌘ + K（已有弹窗时不重复打开）
      const gsBtn = document.getElementById('global-search');
      if (gsBtn) gsBtn.addEventListener('click', () => this.openGlobalSearch());
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
          e.preventDefault();
          if (!document.querySelector('.modal-overlay.show')) this.openGlobalSearch();
        }
      });
    },

    openGlobalSearch() {
      if (L.modules && L.modules.search && L.modules.search.open) L.modules.search.open();
    },

    closeNavDrawer() {
      const sidebar = document.querySelector('.sidebar');
      const scrim = document.getElementById('nav-scrim');
      const toggle = document.getElementById('nav-toggle');
      if (sidebar) sidebar.classList.remove('open');
      if (scrim) scrim.classList.remove('show');
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
    },

    bindThemeToggle() {
      const btn = document.getElementById('theme-toggle');
      btn.addEventListener('click', () => {
        // 以「偏好」为准而非当前 DOM，避免 auto 被误判成 dark 后无法回到跟随系统
        const pref = S.state.settings.theme || 'auto';
        const cur = pref === 'auto' ? this.systemTheme() : pref;
        const next = cur === 'light' ? 'dark' : 'light';
        S.setSettings({ theme: next });
        this.applyTheme(next);
        this.updateAIStatus();
        const sel = document.getElementById('s-theme');
        if (sel) sel.value = next;
      });
    },

    systemTheme() {
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    },

    applyTheme(theme) {
      const t = theme === 'auto' ? this.systemTheme() : theme;
      document.documentElement.setAttribute('data-theme', t);
      // 地址栏 / PWA 标题栏配色跟随主题，消除改版后残留的旧近黑色
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', t === 'light' ? '#e9eeed' : '#0d1514');
      const btn = document.getElementById('theme-toggle');
      if (btn) {
        const use = btn.querySelector('use');
        if (use) use.setAttribute('href', t === 'light' ? '#i-moon' : '#i-sun');
        btn.setAttribute('aria-label', t === 'light' ? '切换到深色主题' : '切换到浅色主题');
      }
      this.bindSystemTheme();
    },

    bindSystemTheme() {
      if (!window.matchMedia || this._mm) return;
      const mm = window.matchMedia('(prefers-color-scheme: light)');
      const cb = () => {
        if ((S.state.settings.theme || 'auto') === 'auto') this.applyTheme('auto');
      };
      if (mm.addEventListener) mm.addEventListener('change', cb);
      else if (mm.addListener) mm.addListener(cb);
      this._mm = mm;
    },

    showView(name, fromHash) {
      if (!TITLES[name]) name = 'dashboard';
      this.current = name;
      document.querySelectorAll('#nav .nav-item').forEach((b) => {
        b.classList.toggle('active', b.getAttribute('data-view') === name);
      });
      document.getElementById('view-title').textContent = TITLES[name];
      // Codex 视图占满整窗（隐藏 LifeOS 侧栏与顶栏），保持与 Codex 一致的形态
      document.body.classList.toggle('codex-mode', name === 'codex');
      // 同步地址栏 hash，产生历史记录；hashchange 回来时 fromHash 避免重复渲染
      if (!fromHash && location.hash !== '#' + name) location.hash = name;
      this.refresh();
    },

    refresh() {
      const view = document.getElementById('view');
      const mod = L.modules[this.current];
      if (!mod) return;
      view.innerHTML = mod.render();
      if (mod.bind) mod.bind(view);
      // 通用跨视图跳转（空态引导 / 提示条），任何模块都能用 data-go
      view.querySelectorAll('[data-go]').forEach((b) =>
        b.addEventListener('click', () => this.showView(b.getAttribute('data-go'))));
    },

    updateAIStatus() {
      const el = document.getElementById('ai-status');
      const badge = document.getElementById('mode-badge');
      if (el) {
        el.textContent = S.state.settings.aiKey ? 'AI：已连接 ✓' : 'AI：演示模式';
        el.classList.toggle('ok', !!S.state.settings.aiKey);
      }
      if (badge) badge.textContent = L.bridge.mode === 'electron' ? '桌面端 · 本地' : '本地存储';
      const demo = document.getElementById('demo-pill');
      if (demo) demo.hidden = L.bridge.mode === 'electron';
    },

    /* ---------------- 总览 ---------------- */
    dashboardHTML() {
      const st = S.state;
      const now = new Date();
      const h = now.getHours();
      const greet = h < 6 ? '夜深了' : h < 12 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好';
      const name = st.settings.userName ? '，' + U.escapeHtml(st.settings.userName) : '';
      const openTasks = st.tasks.filter((t) => t.status !== 'done');
      const overdue = openTasks.filter((t) => t.due && t.due < U.todayStr());
      const todayHabits = st.habits;
      const doneToday = todayHabits.filter((x) => (x.checkins || {})[U.todayStr()]).length;
      const notes = st.notes.length;
      // 内置示例内容不计入「我的知识」，避免首屏出现假的 17 条
      const kb = (st.library || []).filter((x) => !(L.seedLibrary && L.seedLibrary.isSeedItem(x))).length;

      // 只提醒一次的备份提示：攒到少量自己的数据后再出现，不打扰全新用户
      let tipDone = false;
      try { tipDone = !!DB.getItem('lifeos-backup-tip-done'); } catch (_) { /* noop */ }
      const ownItems = st.tasks.length + st.habits.length + st.notes.length +
        st.aiThread.length + (st.events || []).length;
      const backupTip = (!tipDone && ownItems >= 3)
        ? '<div class="backup-tip">▣ 数据只保存在这台设备的浏览器里，清缓存或换设备会丢失。' +
          '<div class="spacer"></div>' +
          '<button class="link-btn" id="dash-export">立即导出备份</button>' +
          '<button class="link-btn" id="dash-tip-hide">不再提醒</button></div>'
        : '';

      const statCards = [
        { n: openTasks.length, l: '待办任务', c: 'c-blue', icon: '✓' },
        { n: overdue.length, l: '已逾期', c: overdue.length ? 'c-red' : 'c-green', icon: '◷' },
        { n: doneToday + '/' + todayHabits.length, l: '今日打卡', c: 'c-orange', icon: '◆' },
        { n: notes, l: '笔记', c: 'c-purple', icon: '✎' },
        { n: kb, l: '知识条目', c: 'c-blue', icon: '▤' }
      ].map((s) =>
        '<div class="stat-card ' + s.c + '"><div class="sc-icon">' + s.icon + '</div>' +
        '<div class="sc-num">' + s.n + '</div><div class="sc-label">' + s.l + '</div></div>'
      ).join('');

      const taskList = openTasks.length
        ? openTasks.slice(0, 6).map((t) =>
          '<li class="dash-task" data-id="' + U.escapeHtml(t.id) + '">' +
          '<span class="badge ' + ({ high: 'p-high', medium: 'p-medium', low: 'p-low' }[t.priority] || 'p-medium') + '">' + ({ high: '高', medium: '中', low: '低' }[t.priority] || '中') + '</span>' +
          '<span class="dt-title">' + U.escapeHtml(t.title) + '</span>' +
          (t.due ? '<span class="due">' + U.escapeHtml(U.fmtDate(t.due)) + '</span>' : '') + '</li>'
        ).join('')
        : '<li class="dash-empty">今天没有待办任务。<button class="link-btn" data-go="tasks">＋ 新建任务</button></li>';

      const habitList = todayHabits.length
        ? todayHabits.map((x) => {
          const on = (x.checkins || {})[U.todayStr()];
          return '<button class="dash-habit' + (on ? ' on' : '') + '" data-id="' + U.escapeHtml(x.id) + '" style="--hc:' + U.safeColor(x.color) + '">' +
            '<span>' + U.escapeHtml(x.emoji || '◆') + ' ' + U.escapeHtml(x.name) + '</span>' +
            '<span>' + (on ? '✓' : '○') + '</span></button>';
        }).join('')
        : '<div class="dash-empty">还没有习惯。<button class="link-btn" data-go="habits">＋ 创建一个</button></div>';

      // PetOS 桌宠伙伴（概念 1/5/6/8）：常驻案头，会呼吸、说话、切宠物、点头授权
      const petPanel = (L.pet && L.petRenderer) ? L.petRenderer.dashboardPanel() : '';
      // 9 大概念能力带：一眼可见的总览，点按直达各自落点
      const conceptsStrip = (L.pet && L.petRenderer && L.petRenderer.conceptsStrip)
        ? L.petRenderer.conceptsStrip() : '';

      return '' +
        '<div class="page dashboard">' +
        '  <div class="greet">' + greet + name + '  <span class="greet-date">' + now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' }) + '</span></div>' +
        backupTip +
        (petPanel || '') +
        (conceptsStrip || '') +
        '  <div class="stat-grid">' + statCards + '</div>' +
        '  <div class="dash-cols">' +
        '    <div class="dash-col">' +
        '      <div class="dash-head">今日任务 <button class="link-btn" data-go="tasks">查看全部 →</button></div>' +
        '      <ul class="dash-list">' + taskList + '</ul>' +
        '    </div>' +
        '    <div class="dash-col">' +
        '      <div class="dash-head">今日打卡 <button class="link-btn" data-go="habits">去打卡 →</button></div>' +
        '      <div class="dash-habit-list">' + habitList + '</div>' +
        '    </div>' +
        '  </div>' +
        '  <div class="dash-ai-tip">◇ 刚开始使用？先 <button class="link-btn" data-go="tasks">建一个任务</button> 或 <button class="link-btn" data-go="notes">写篇笔记</button>；日历里也能直接记日程。</div>' +
        '</div>';
    }
  };

  /* =====================================================================
   * PetOS 渲染器（内嵌于 app.js，不新增源文件 / 不新增导航）
   * 概念 1 具身化 / 5 点头 / 6 多宠物 / 8 数字分身 / 9 A2A 的门面。
   * 只做渲染与事件绑定，状态一律经 L.pet 内核，配色一律用 CSS 变量。
   * ===================================================================== */
  L.petRenderer = (function () {
    'use strict';
    const P = L.pet;

    // 情绪 = 真实数据的函数（不是随机表演）：逾期/完成/时段/互动史共同决定
    const MOOD_LABELS = { calm: '平静', happy: '开心', proud: '得意', worry: '担心', sleepy: '困了', lonely: '想你' };
    function signalsOf() {
      const st = S.state;
      const dayStart = new Date(); dayStart.setHours(0, 0, 0, 0);
      const tasks = st.tasks || [];
      const overdue = tasks.filter((t) => t.status !== 'done' && t.due && t.due < U.todayStr()).length;
      const doneToday = tasks.filter((t) => t.status === 'done' && (t.updatedAt || 0) >= dayStart.getTime()).length +
        (st.habits || []).filter((x) => (x.checkins || {})[U.todayStr()]).length;
      return { overdue: overdue, doneToday: doneToday };
    }
    function currentMood(justInteracted) {
      if (!P) return 'calm';
      const sig = signalsOf();
      return P.moodOf({ overdue: sig.overdue, doneToday: sig.doneToday, justInteracted: !!justInteracted });
    }

    // 情境化说话：基于真实数据，不编造能力
    const MOOD_LINES = {
      calm: ['我在，随时可以唤我。', '按你的步调来就好。', '要不要把最近的知识连起来？'],
      happy: ['今天状态不错，继续保持！', '和你一起干活很开心。', '刚才那件事办得漂亮。'],
      proud: ['今天完成了很多，厉害！', '我都有点骄傲了。', '要不把这份节奏记进复盘？'],
      worry: ['有几件事逾期了，先处理最急的那件吧。', '别担心，一件件来，我帮你盯着。', '逾期的事要不要我帮你拆解？'],
      sleepy: ['夜深了，我陪你把最后这点收尾。', '熬太晚对身体不好，收尾就睡吧。', '我把灯调暗一点陪你。'],
      lonely: ['好久没理我了……来看看进度吗？', '我还在这儿，随时待命。', '积了些小事想跟你说。']
    };
    function lineFor(mood) {
      const bank = MOOD_LINES[mood] || MOOD_LINES.calm;
      return bank[Math.floor(Math.random() * bank.length)];
    }
    function greeting() {
      if (!P) return '嗨，我是你的桌宠伙伴。';
      const sig = signalsOf();
      const open = (S.state.tasks || []).filter((t) => t.status !== 'done').length;
      const pet = P.activePet();
      const gear = pet ? P.gearOf(pet.equip) : null;
      let line;
      const h = new Date().getHours();
      if (h >= 22 || h < 6) line = '夜深了，我陪你把最后这点收尾。';
      else if (sig.overdue > 0) line = '有 ' + sig.overdue + ' 件事逾期了，先处理最急的那件吧。';
      else if (open > 5) line = '今天有 ' + open + ' 项待办，我帮你盯着节奏。';
      else if (sig.doneToday >= 3) line = '今天已经完成 ' + sig.doneToday + ' 项，了不起！';
      else if (open > 0) line = '还有 ' + open + ' 项待办，按你的步调来就好。';
      else line = '今天没有待办，正好把知识连成小屋。';
      if (gear && gear.id !== 'none') line += '（已装备' + gear.name + '）';
      return line;
    }

    // 桌宠 SVG：分层团子生物，呼吸/眨眼由 CSS 驱动，装备以帽子叠加；表情随情绪切换
    function petSVG(pet, mood) {
      const glyph = U.escapeHtml(pet.glyph || '◕');
      const hat = pet.equip && pet.equip !== 'none'
        ? '<g class="pet-hat"><rect x="34" y="8" width="52" height="12" rx="4"/>' +
          '<text x="60" y="18" text-anchor="middle">' + U.escapeHtml(P.gearOf(pet.equip).glyph) + '</text></g>'
        : '';
      const m = mood || 'calm';
      const eyes = (m === 'happy' || m === 'proud')
        ? '<path d="M44 58 q6 -7 12 0 M64 58 q6 -7 12 0" class="pet-eye-line"/>'
        : m === 'sleepy'
          ? '<path d="M44 58 q6 5 12 0 M64 58 q6 5 12 0" class="pet-eye-line"/>'
          : '<circle cx="50" cy="58" r="3.2" class="pet-eye"/><circle cx="70" cy="58" r="3.2" class="pet-eye"/>';
      const mouth = m === 'worry'
        ? '<path class="pet-mouth" d="M54 74 q6 -5 12 0"/>'
        : m === 'lonely'
          ? '<path class="pet-mouth" d="M54 73 h12"/>'
          : '<path class="pet-mouth" d="M54 72 q6 6 12 0"/>';
      return '' +
        '<svg class="pet-svg mood-' + U.escapeHtml(m) + '" viewBox="0 0 120 120" aria-hidden="true">' +
        '  <ellipse class="pet-shadow" cx="60" cy="108" rx="30" ry="5"/>' +
        '  <g class="pet-body">' +
        '    <path class="pet-shape" d="M60 20 C88 20 102 44 102 68 C102 92 84 104 60 104 C36 104 18 92 18 68 C18 44 32 20 60 20 Z"/>' +
        '    <ellipse class="pet-belly" cx="60" cy="80" rx="24" ry="16"/>' +
        eyes + mouth +
        '    <circle class="pet-blush" cx="38" cy="68" r="5"/><circle class="pet-blush" cx="82" cy="68" r="5"/>' +
        '    <text class="pet-glyph" x="60" y="46" text-anchor="middle">' + glyph + '</text>' +
        hat +
        '  </g>' +
        '</svg>';
    }

    function dashboardPanel() {
      if (!P) return '';
      const pets = P.get().pets;
      const active = P.activePet();
      const mood = currentMood();
      const chips = pets.map((p) =>
        '<button class="pet-chip' + (p.id === active.id ? ' on' : '') + '" data-pet="' + U.escapeHtml(p.id) + '" ' +
        'title="' + U.escapeHtml(p.role) + '" aria-pressed="' + (p.id === active.id) + '">' +
        '<span class="pc-glyph">' + U.escapeHtml(p.glyph) + '</span>' +
        '<span class="pc-name">' + U.escapeHtml(p.name) + '</span></button>'
      ).join('');
      const skills = P.userSkills();
      const skillLine = skills.length
        ? '已从你的行为学到：' + skills.slice(0, 3).map((s) => '<span class="pet-skill">✧ ' + U.escapeHtml(s) + '</span>').join('')
        : '和你相处还不久，多互动几次我会更懂你。';
      const gear = P.gearOf(active.equip);
      // 真实互动统计（来自 L.pet.stats，不编造）：把「分身在观察你」可视化
      const stat = P.stats();
      const vitals = [
        { n: (stat.feeds || 0) + (stat.links || 0), l: '内化/连线' },
        { n: stat.houseBuilds || 0, l: '搭过小屋' },
        { n: (stat.nods || 0) + (stat.approvalsDenied || 0), l: '点头授权' },
        { n: stat.chats || 0, l: '陪你聊天' }
      ].map((v) =>
        '<span class="pv-item"><b>' + v.n + '</b>' + U.escapeHtml(v.l) + '</span>').join('');

      return '' +
        '<section class="pet-panel" aria-label="桌宠伙伴">' +
        '  <div class="pet-stage tint-' + U.escapeHtml(active.tint) + '" id="pet-stage">' +
        '    <div class="pet-live"><i></i>伙伴在线 · <span class="pet-mood-tag">' + U.escapeHtml(MOOD_LABELS[mood] || '平静') + '</span></div>' +
        '    <div class="pet-halo" aria-hidden="true"></div>' +
        '    <div class="pet-bubble" id="pet-bubble">' + U.escapeHtml(greeting()) + '</div>' +
        '    ' + petSVG(active, mood) +
        '    <div class="pet-nameplate"><b>' + U.escapeHtml(active.name) + '</b><span>' + U.escapeHtml(gear.name) + ' · ' + U.escapeHtml(gear.role) + '</span></div>' +
        '  </div>' +
        '  <div class="pet-side">' +
        '    <div class="pet-side-h">我的宠物 <span class="pet-count">' + pets.length + ' 只</span></div>' +
        '    <div class="pet-chips" id="pet-chips">' + chips +
        '      <button class="pet-add" id="pet-add" title="领养一只新宠物">＋</button></div>' +
        '    <div class="pet-side-h">给它装备（戴上即专家）</div>' +
        '    <div class="pet-gears" id="pet-gears">' + P.equipment().map((e) =>
        '      <button class="pet-gear' + (e.id === active.equip ? ' on' : '') + '" data-gear="' + e.id + '" ' +
        'title="' + U.escapeHtml(e.role) + '" aria-pressed="' + (e.id === active.equip) + '">' +
        U.escapeHtml(e.glyph) + '</button>').join('') + '</div>' +
        '    <div class="pet-vitals" aria-label="真实互动记录">' + vitals + '</div>' +
        '    <div class="pet-twin"><span class="pt-ic">☯</span><div>' + skillLine + '</div></div>' +
        '    <div class="pet-actions">' +
        '      <button class="btn ghost btn-xs" id="pet-talk">💬 说句话</button>' +
        '      <button class="btn ghost btn-xs" id="pet-nod">◇ 点头授权演示</button>' +
        '    </div>' +
        '  </div>' +
        '</section>';
    }

    // 9 大概念能力带：把散落各处的落点收拢成一眼可见的总览
    function conceptsStrip() {
      const cells = [
        { g: '❂', n: '具身伙伴', v: 'dashboard', d: '案头常驻' },
        { g: '◈', n: '吞入内化', v: 'library', d: '知识嚼成卡片' },
        { g: '⌂', n: '知识小屋', v: 'graph', d: '把知识搭成屋' },
        { g: '✦', n: '装备专家', v: 'ai', d: '戴上即专家' },
        { g: '✓', n: '点头授权', v: 'codex', d: '危险先请示' },
        { g: '❖', n: '多宠生态', v: 'dashboard', d: '领养与切换' },
        { g: '▦', n: '老板视图', v: 'codex', d: '调度小队' },
        { g: '☯', n: '数字分身', v: 'settings', d: '从行为懂你' },
        { g: '⇄', n: '多端社交', v: 'settings', d: 'A2A 协作' }
      ];
      return '' +
        '<section class="concept-strip" aria-label="Agent Pet OS 九大能力">' +
        '  <div class="cs-head"><span class="cs-title">✦ Agent Pet OS · 九大能力已就位</span>' +
        '    <span class="cs-sub">点按直达 · 每个落点都是真实可用的功能</span></div>' +
        '  <div class="cs-grid">' + cells.map((c) =>
        '    <button class="cs-cell" data-go="' + c.v + '">' +
        '      <span class="cs-glyph">' + c.g + '</span>' +
        '      <span class="cs-name">' + c.n + '</span>' +
        '      <span class="cs-desc">' + c.d + '</span>' +
        '    </button>').join('') +
        '  </div>' +
        '</section>';
    }

    function say(msg) {
      const mood = currentMood(true);
      ['pet-bubble', 'pet-mini-bubble'].forEach((id) => {
        const bubble = document.getElementById(id);
        if (!bubble) return;
        bubble.textContent = msg;
        bubble.classList.add('talking');
        clearTimeout(bubble._t);
        bubble._t = setTimeout(() => bubble.classList.remove('talking'), 3200);
      });
      // 摸摸/说话都算真实互动：刷新 lastInteractAt，情绪切到 happy
      if (P && P.interact) P.interact('chat');
      if (P && P.observe) P.observe('night');
      syncMood(mood);
    }

    /* ---------- 全局悬浮伙伴（概念 1 具身常驻的真正落点） ----------
     * 挂在 #view 之外（body 末尾），切视图不销毁；
     * 呼吸/表情/气泡都随真实情绪变化；点击=摸摸，展开=快捷动作。 */
    function companionHTML() {
      const active = P.activePet();
      const mood = currentMood();
      return '' +
        '<div class="pet-companion tint-' + U.escapeHtml(active.tint) + ' mood-' + U.escapeHtml(mood) + '" id="pet-companion" aria-label="桌宠伙伴（常驻）">' +
        '  <div class="pc-bubble" id="pet-mini-bubble"></div>' +
        '  <button class="pc-face" id="pet-c-face" aria-label="摸摸' + U.escapeHtml(active.name) + '" title="点我互动">' +
        '    ' + petSVG(active, mood) +
        '  </button>' +
        '  <div class="pc-menu" id="pet-c-menu" hidden>' +
        '    <button class="pc-act" data-c="pet">🖐 摸摸</button>' +
        '    <button class="pc-act" data-c="feed">🍙 喂食</button>' +
        '    <button class="pc-act" data-c="talk">💬 说话</button>' +
        '    <button class="pc-act" data-c="home">◲ 回总览</button>' +
        '    <button class="pc-act pc-hide" data-c="close">收起</button>' +
        '  </div>' +
        '</div>';
    }

    // 情绪同步：换 SVG 表情 + 状态类（悬浮层与总览面板一起变）
    function syncMood(mood) {
      const m = mood || currentMood();
      const active = P ? P.activePet() : null;
      if (!active) return;
      const comp = document.getElementById('pet-companion');
      if (comp) {
        comp.className = 'pet-companion tint-' + active.tint + ' mood-' + m;
        const face = comp.querySelector('.pc-face');
        // 只换 SVG 节点：整块 innerHTML 会把爱心粒子一起抹掉
        if (face) {
          const old = face.querySelector('.pet-svg');
          const tmp = document.createElement('div');
          tmp.innerHTML = petSVG(active, m);
          if (old && tmp.firstChild) old.replaceWith(tmp.firstChild);
        }
      }
      const stage = document.getElementById('pet-stage');
      if (stage) {
        const svg = stage.querySelector('.pet-svg');
        if (svg) {
          const tmp = document.createElement('div');
          tmp.innerHTML = petSVG(active, m);
          svg.replaceWith(tmp.firstChild);
        }
        const tag = stage.querySelector('.pet-mood-tag');
        if (tag) tag.textContent = MOOD_LABELS[m] || '平静';
      }
    }

    function mountCompanion() {
      if (!P || document.getElementById('pet-companion')) return;
      const wrap = document.createElement('div');
      wrap.innerHTML = companionHTML();
      const comp = wrap.firstChild;
      document.body.appendChild(comp);
      const face = comp.querySelector('#pet-c-face');
      const menu = comp.querySelector('#pet-c-menu');
      // 点脸 = 摸摸：爱心 + 开心
      face.addEventListener('click', () => {
        heartBurst(face);
        if (P.interact) P.interact('pet');
        syncMood('happy');
        miniSay(lineFor('happy'));
      });
      face.addEventListener('dblclick', () => { if (L.app) L.app.showView('dashboard'); });
      comp.querySelectorAll('[data-c]').forEach((b) => b.addEventListener('click', () => {
        const k = b.getAttribute('data-c');
        if (k === 'close') { menu.hidden = true; return; }
        if (k === 'home') { if (L.app) L.app.showView('dashboard'); menu.hidden = true; return; }
        if (k === 'pet') { heartBurst(face); if (P.interact) P.interact('pet'); syncMood('happy'); miniSay(lineFor('happy')); }
        if (k === 'feed') { if (P.interact) P.interact('feed'); syncMood('happy'); miniSay('谢谢款待！今天也有干劲了。'); }
        if (k === 'talk') { miniSay(lineFor(currentMood(true))); }
        menu.hidden = true;
      }));
      // 长按/右键出快捷菜单（左键默认是摸摸，保持「一触即应」）
      let pressT = null;
      face.addEventListener('pointerdown', () => { pressT = setTimeout(() => { menu.hidden = false; }, 550); });
      ['pointerup', 'pointerleave'].forEach((ev) => face.addEventListener(ev, () => clearTimeout(pressT)));
      face.addEventListener('contextmenu', (e) => { e.preventDefault(); menu.hidden = !menu.hidden; });
      // 闲置问候：30 秒后轻轻说一句（不打扰：只说一次）
      setTimeout(() => { if (!document.querySelector('.modal-overlay.show')) miniSay(greeting()); }, 30000);
    }

    function miniSay(msg) {
      const bubble = document.getElementById('pet-mini-bubble');
      if (!bubble) return;
      bubble.textContent = msg;
      bubble.classList.add('talking');
      clearTimeout(bubble._t);
      bubble._t = setTimeout(() => bubble.classList.remove('talking'), 4200);
    }

    function heartBurst(host) {
      if (!host || window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      for (let i = 0; i < 5; i++) {
        const h = document.createElement('span');
        h.className = 'pc-heart';
        h.textContent = '♥';
        h.style.left = (18 + Math.random() * 64) + '%';
        h.style.animationDelay = (i * 90) + 'ms';
        host.appendChild(h);
        setTimeout(() => h.remove(), 1200);
      }
    }

    /* ---------- 事件反应（让宠物「看见」你做的事） ----------
     * state:changed → 对比任务完成/逾期变化，给出即时反馈。 */
    function watchLife() {
      if (!P || !L.bus) return;
      let last = signalsOf();
      L.bus.on('state:changed', () => {
        const now = signalsOf();
        if (now.doneToday > last.doneToday) {
          syncMood('proud');
          miniSay(lineFor('proud'));
          const face = document.querySelector('#pet-c-face');
          if (face) heartBurst(face);
        } else if (now.overdue > last.overdue) {
          syncMood('worry');
          miniSay(lineFor('worry'));
        } else if (now.overdue < last.overdue) {
          syncMood('happy');
        }
        last = now;
      });
      // 每 5 分钟随时间/互动史刷新一次情绪（深夜变困、久未互动变想你）
      setInterval(() => syncMood(), 5 * 60 * 1000);
    }

    function bind(root) {
      if (!P) return;
      const stage = root.querySelector('#pet-stage');

      root.querySelectorAll('[data-pet]').forEach((b) => b.addEventListener('click', () => {
        P.setActive(b.getAttribute('data-pet'));
        P.observe('chat');
        if (L.app) L.app.refresh();
      }));

      const add = root.querySelector('#pet-add');
      if (add) add.addEventListener('click', () => U.modal({
        title: '领养一只新宠物',
        bodyHTML: '<div class="form">' +
          '<label>给它起个名字</label><input id="np-name" class="input" placeholder="如：小搜" maxlength="40"/>' +
          '<label>它的职责</label><input id="np-role" class="input" placeholder="如：专管检索" maxlength="60"/>' +
          '<p class="hint">新宠物加入名册，随时可切换与装备。名册独立存储，不影响你的任务与笔记。</p>' +
          '<div class="modal-actions"><button class="btn ghost" data-act="cancel">取消</button>' +
          '<button class="btn primary" data-act="ok">领养</button></div></div>',
        onMount(mroot, close) {
          mroot.querySelector('[data-act="cancel"]').addEventListener('click', close);
          mroot.querySelector('[data-act="ok"]').addEventListener('click', () => {
            const name = mroot.querySelector('#np-name').value.trim();
            const role = mroot.querySelector('#np-role').value.trim();
            const created = P.addPet({ name: name || '新伙伴', role: role || '待分配任务', glyph: '✦' });
            close();
            if (created) { U.toast('已领养 ' + created.name); if (L.app) L.app.refresh(); }
            else U.toast('名册已满（最多 64 只）', 'error');
          });
        }
      }));

      root.querySelectorAll('[data-gear]').forEach((b) => b.addEventListener('click', () => {
        const id = b.getAttribute('data-gear');
        if (P.equipActive(id)) {
          const g = P.gearOf(id);
          say('装备好了：' + g.name + '。' + g.role);
          if (L.app) L.app.refresh();
        }
      }));

      const talk = root.querySelector('#pet-talk');
      if (talk) talk.addEventListener('click', () => say(lineFor(currentMood())));

      // 点头原则现场演示：双阶段授权，任一阶段拒绝都不执行
      const nod = root.querySelector('#pet-nod');
      if (nod) nod.addEventListener('click', async () => {
        const ok = await P.requestApproval({ desc: '演示：清理 3 条过期知识卡片' });
        if (ok) U.toast('主控已点头 · 授权通过（本次为演示，未真实删除）');
        else U.toast('已拒绝或取消 · 未执行任何操作');
      });

      // 轻点头像也让桌宠回应：摸摸 → 爱心 + 开心
      if (stage) stage.addEventListener('click', (e) => {
        if (e.target.closest('.pet-gear') || e.target.closest('.pet-chip')) return;
        if (P.interact) P.interact('pet');
        syncMood('happy');
        say(lineFor('happy'));
      });
    }

    return { dashboardPanel, conceptsStrip, bind, say, greeting, mountCompanion, watchLife, syncMood, currentMood, MOOD_LABELS };
  })();

  // 注册总览为模块
  L.modules.dashboard = {
    render: () => app.dashboardHTML(),
    bind: (root) => {
      // PetOS 桌宠伙伴交互（具身/换宠/装备/点头/说话）
      if (L.petRenderer) L.petRenderer.bind(root);
      root.querySelectorAll('.dash-task').forEach((li) => li.addEventListener('click', () => {
        if (L.modules.tasks && L.modules.tasks.focusTask) L.modules.tasks.focusTask(li.getAttribute('data-id'));
      }));
      root.querySelectorAll('.dash-habit').forEach((b) => b.addEventListener('click', () => { S.toggleHabitCheckin(b.getAttribute('data-id'), U.todayStr()); app.refresh(); }));
      const markTipDone = () => { try { DB.setItem('lifeos-backup-tip-done', '1'); } catch (_) { /* noop */ } };
      const ex = root.querySelector('#dash-export');
      if (ex) ex.addEventListener('click', () => {
        const name = S.downloadBackup();
        markTipDone();
        U.toast('已导出 ' + name);
        app.refresh();
      });
      const hide = root.querySelector('#dash-tip-hide');
      if (hide) hide.addEventListener('click', () => { markTipDone(); app.refresh(); });
    }
  };

  L.app = app;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => app.init());
  } else {
    app.init();
  }

  // PWA：仅在浏览器（非 Electron / 非 ArkWeb）且安全上下文下注册离线 Service Worker
  if (!window.electronAPI && 'serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => {
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').then((reg) => {
        // 每次启动主动检查一次 SW 更新（浏览器默认可能 24h 才查）
        reg.update().catch(() => {});
        // 回访用户已有旧 SW 接管：新 SW 接管后自动刷新一次，避免停留在旧页面
        if (hadController) {
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (sessionStorage.getItem('lifeos-sw-reload')) return;
            sessionStorage.setItem('lifeos-sw-reload', '1');
            location.reload();
          });
        }
      }).catch(() => { /* 忽略注册失败 */ });
    });
  }
})(window.LifeOS);

  </script>
</body>
</html>
