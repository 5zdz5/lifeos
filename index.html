      if (!resp.ok) {
        const t = await resp.text().catch(() => '');
        cb({ type: 'error', data: 'AI 接口错误 ' + resp.status + ' ' + t.slice(0, 200) });
        return;
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let full = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop();
        for (const part of parts) {
          const line = part.trim();
          if (!line.startsWith('data:')) continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') continue;
          try {
            const j = JSON.parse(data);
            const d = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
            if (d) { full += d; cb({ type: 'chunk', data: d }); }
          } catch (e) { /* 忽略分片 */ }
        }
      }
      cb({ type: 'done', data: full });
    } catch (err) {
      cb({ type: 'error', data: '调用失败：' + (err && err.message ? err.message : String(err)) });
    }
  }

  /* ---------------- 浏览器模式：虚拟文件系统（Agent 演示用） ---------------- */
  const VFS_KEY = 'lifeos-vfs';

  function defaultVFS() {
    return {
      files: {
        'README.md': '# LifeOS 工作区\n\n这是一个「浏览器演示工作区」。\n\n- 点左侧文件树打开文件\n- 编辑后点「保存」\n- 点「运行」执行当前 JS 文件\n\n> 真实读写本机文件、执行命令与 Python，请使用 Electron 桌面版。\n',
        'hello.js': 'function greet(name) {\n  return "你好，" + name + "！";\n}\n\nconsole.log(greet("世界"));\nconsole.log("2 + 3 =", 2 + 3);\n',
        'src/utils.js': '// 示例：求和工具\nexport function sum(arr) {\n  return arr.reduce((a, b) => a + b, 0);\n}\n'
      }
    };
  }

  function vfsLoad() {
    try {
      const raw = DB.getItem(VFS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (_) { /* 损坏则重置 */ }
    const d = defaultVFS();
    DB.setItem(VFS_KEY, JSON.stringify(d));
    return d;
  }

  function vfsSave(vfs) { DB.setItem(VFS_KEY, JSON.stringify(vfs)); }

  function sortTree(nodes) {
    nodes.sort((a, b) => a.type === b.type ? a.name.localeCompare(b.name, 'zh-CN') : (a.type === 'dir' ? -1 : 1));
    nodes.forEach((n) => { if (n.children) sortTree(n.children); });
    return nodes;
  }

  function vfsList(files) {
    const tree = [];
    const dirMap = {};
    Object.keys(files).sort().forEach((p) => {
      const parts = p.split('/');
      let cur = tree;
      let curRel = '';
      for (let i = 0; i < parts.length; i++) {
        const seg = parts[i];
        const rel = curRel ? curRel + '/' + seg : seg;
        curRel = rel;
        if (i === parts.length - 1) {
          cur.push({ name: seg, rel, type: 'file' });
        } else {
          let dir = dirMap[rel];
          if (!dir) {
            dir = { name: seg, rel, type: 'dir', children: [] };
            dirMap[rel] = dir;
            cur.push(dir);
          }
          cur = dir.children;
        }
      }
    });
    return sortTree(tree);
  }

  function vfsRemove(files, rel) {
    const isDir = Object.keys(files).some((p) => p.startsWith(rel + '/'));
    if (isDir) {
      Object.keys(files).forEach((p) => { if (p === rel || p.startsWith(rel + '/')) delete files[p]; });
    } else {
      delete files[rel];
    }
    return files;
  }

  function vfsRename(files, from, to) {
    const out = {};
    Object.keys(files).forEach((p) => {
      let np = p;
      if (p === from) np = to;
      else if (p.startsWith(from + '/')) np = to + p.slice(from.length);
      out[np] = files[p];
    });
    return out;
  }

  /* 浏览器演示用 JS 执行：放进 sandbox iframe + 独立 Worker。
   * iframe 不给 allow-same-origin → opaque origin，脚本读不到父页 DOM / localStorage /
   * Cookie；Worker 在独立线程，可被 terminate 中断死循环。绝不在本页用 new Function
   * 执行用户代码——那能直接拿到本页的 API Key 并联网外传。 */
  function runJSSandbox(code) {
    return new Promise((resolve) => {
      if (typeof document === 'undefined' || typeof Worker === 'undefined' || typeof Blob === 'undefined') {
        resolve({ code: -1, stdout: '', stderr: '', note: '当前环境不支持隔离执行' });
        return;
      }
      const token = 'lifeos-run-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
      const iframe = document.createElement('iframe');
      iframe.setAttribute('sandbox', 'allow-scripts');
      iframe.setAttribute('aria-hidden', 'true');
      iframe.style.display = 'none';
      let settled = false;
      let timer = null;
      const finish = (r) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        window.removeEventListener('message', onMessage);
        if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
        resolve(r);
      };
      const onMessage = (e) => {
        const d = e.data;
        if (!d || d.token !== token) return;   // token 随机且只存在于 srcdoc 内，不可伪造
        const logs = Array.isArray(d.logs) ? d.logs.map((x) => String(x)).join('\n') : '';
        if (d.timeout) finish({ code: -1, stdout: logs, stderr: '执行超时（超过 3 秒）', note: '已终止隔离运行' });
        else if (d.ok) finish({ code: 0, stdout: logs || '(无输出)', stderr: '', note: '在隔离线程中执行完成，未接触本机数据' });
        else finish({ code: -1, stdout: logs, stderr: String(d.err || '执行出错'), note: '执行出错' });
      };
      window.addEventListener('message', onMessage);

      const workerSrc = [
        "self.onmessage = function (ev) {",
        "  var logs = [];",
        "  function fmt(v) {",
        "    if (typeof v === 'string') return v;",
        "    try { return JSON.stringify(v); } catch (e) { return String(v); }",
        "  }",
        "  var c = {",
        "    log: function () { logs.push(Array.prototype.slice.call(arguments).map(fmt).join(' ')); },",
        "    warn: function () { logs.push('WARN ' + Array.prototype.slice.call(arguments).map(fmt).join(' ')); },",
        "    error: function () { logs.push('ERROR ' + Array.prototype.slice.call(arguments).map(fmt).join(' ')); }",
        "  };",
        "  try {",
        "    (new Function('console', ev.data.code))(c);",
        "    self.postMessage({ ok: true, logs: logs });",
        "  } catch (e) {",
        "    self.postMessage({ ok: false, logs: logs, err: String(e && e.message || e) });",
        "  }",
        "};"
      ].join('\n');

      const scriptBody = [
        "(function(){",
        "  var TOKEN=" + JSON.stringify(token) + ";",
        "  var CODE=" + JSON.stringify(String(code == null ? '' : code)).replace(/</g, '\\u003c') + ";",
        "  var SRC=" + JSON.stringify(workerSrc) + ";",
        "  var w;",
        "  try{ w=new Worker(URL.createObjectURL(new Blob([SRC],{type:'text/javascript'}))); }",
        "  catch(e){ parent.postMessage({token:TOKEN,ok:false,err:'无法创建隔离线程: '+e.message},'*'); return; }",
        "  var done=false;",
        "  function reply(d){ if(done)return; done=true; try{w.terminate()}catch(e){} d.token=TOKEN; parent.postMessage(d,'*'); }",
        "  w.onmessage=function(e){ reply(e.data||{}); };",
        "  w.onerror=function(e){ reply({ok:false,err:String(e.message||'运行出错')}); };",
        "  w.postMessage({code:CODE});",
        "  setTimeout(function(){ reply({ok:false,timeout:true,logs:[]}); },3000);",
        "})();"
      ].join('\n');

      iframe.srcdoc = '<!doctype html><meta charset="utf-8"><script>' + scriptBody + '<' + '/script>';
      document.body.appendChild(iframe);
      timer = setTimeout(() => finish({ code: -1, stdout: '', stderr: '', note: '隔离执行无响应，已终止' }), 5000);
    });
  }

  function mockRunCommand(cmd) {
    const c = String(cmd || '').trim();
    if (!c) return { code: 0, stdout: '', stderr: '', note: '空命令' };
    const vfs = vfsLoad();
    const files = Object.keys(vfs.files).sort();
    const parts = c.split(/\s+/);
    const head = parts[0];
    if (head === 'pwd') return { code: 0, stdout: '/demo-workspace', stderr: '', note: '退出码 0' };
    if (head === 'ls' || head === 'dir') {
      return { code: 0, stdout: files.join('\n') || '(空目录)', stderr: '', note: '退出码 0' };
    }
    if (head === 'echo') {
      return { code: 0, stdout: parts.slice(1).join(' '), stderr: '', note: '退出码 0' };
    }
    if (head === 'cat') {
      const p = parts[1];
      const content = p && vfs.files[p];
      return content != null
        ? { code: 0, stdout: content, stderr: '', note: '退出码 0' }
        : { code: 1, stdout: '', stderr: 'cat: ' + (p || '') + ': 文件不存在', note: '退出码 1' };
    }
    return {
      code: -1, stdout: '', stderr: '',
      note: '浏览器演示模式不支持执行「' + head + '」。可用命令：pwd / ls / echo / cat。真实命令执行请使用 Electron 桌面版。'
    };
  }

  function mockAgent(payload, cb) {
    return (async () => {
      const delay = (ms) => new Promise((r) => setTimeout(r, ms));
      const user = payload.user || '';
      const vfs = vfsLoad();
      const listing = vfsList(vfs.files);
      const emit = (e) => cb({ type: 'event', data: e });

      if (/之前|上次|还记得|识海|记忆/.test(user) && L.mindsea) {
        try {
          const query = user.replace(/.*(?:识海|记忆)/, '').replace(/[？?，。：:]/g, ' ').trim();
          const words = query.split(/\s+/).filter((x) => x.length >= 2 && !/^(我们|之前|上次|哪些|什么|做过|重要|决定|查一下|先检索再回答)$/.test(x));
          const q = words[0] || '决定';
          emit({ type: 'assistant', text: '先检索本机识海，不凭印象回答。', toolCalls: [{ id: 'memory-local', name: 'memory_search', args: { q, pool: 'all' } }] });
          const found = await L.mindsea.search({ q, pool: 'all', limit: 10 });
          emit({ type: 'tool', name: 'memory_search', args: { q, pool: 'all' }, result: JSON.stringify(found, null, 2) });
          const lines = (found.words || []).map((m) => '- ' + m.at + '：' + m.text).concat((found.events || []).map((ev) => '- ' + ev.name + '：' + ev.hits + ' 条原话，' + ev.decisions + ' 条决定'));
          cb({ type: 'done', data: { finalAnswer: lines.length ? '本机识海检索到：\n\n' + lines.join('\n') : '本机识海没有命中「' + q + '」。没有相关记录时我不会编造回忆。', steps: 2 } });
        } catch (e) { cb({ type: 'error', data: '识海检索失败：' + (e.message || e) }); }
        return;
      }

      if (payload.mode === 'chat') {
        emit({ type: 'assistant', text: '', toolCalls: [] });
        cb({
          type: 'done',
          data: {
            finalAnswer: '【演示模式】关于「' + user.slice(0, 60) + '」——当前未配置 API Key，这是本地示例回复，不会改动任何文件。\n\n在「设置」中填入 OpenAI 兼容接口的 Key 后可获得真实模型的文字解答；真实读写本机文件与执行命令需运行 Electron 桌面版（网页版永远不接触本机磁盘）。',
            steps: 1
          }
        });
        return;
      }

      // 固定演示回放：明确告知用户这四步是预置流程，不会按指令产出对应文件
      emit({ type: 'assistant', text: '【演示回放】接下来是预置的 4 步流程，用于展示 Agent 的执行形态；它不会按你的指令生成对应文件。', toolCalls: [{ id: '1', name: 'list_files', args: { path: '.' } }] });
      await delay(220);
      emit({ type: 'tool', name: 'list_files', args: { path: '.' }, result: JSON.stringify(listing, null, 2) });

      emit({ type: 'assistant', text: '读一下 README 了解这个项目。', toolCalls: [{ id: '2', name: 'read_file', args: { path: 'README.md' } }] });
      await delay(220);
      emit({ type: 'tool', name: 'read_file', args: { path: 'README.md' }, result: vfs.files['README.md'] || '' });

      const summary = '# 任务摘要（演示产物）\n\n目标：' + user + '\n\n> 由浏览器固定演示流程生成，并非按上述目标完成的结果。\n> 网页版只写虚拟工作区，不接触本机磁盘；真实读写文件与执行命令需运行 Electron 桌面版。\n';
      emit({ type: 'assistant', text: '生成一份摘要文件。', toolCalls: [{ id: '3', name: 'write_file', args: { path: 'AGENT-SUMMARY.md', content: summary } }] });
      await delay(220);
      vfs.files['AGENT-SUMMARY.md'] = summary;
      vfsSave(vfs);
      emit({ type: 'tool', name: 'write_file', args: { path: 'AGENT-SUMMARY.md', content: summary }, result: '已写入 AGENT-SUMMARY.md（' + summary.length + ' 字符）' });

      emit({ type: 'assistant', text: '', toolCalls: [] });
      cb({
        type: 'done',
        data: {
          finalAnswer: '【演示回放结束】上面 4 步是固定流程，写入的 AGENT-SUMMARY.md 只是演示产物，并没有按你的要求创建对应文件。\n\n网页版使用虚拟工作区，不接触本机磁盘、不执行命令与 Python；配置 API Key 只能让文字回复来自真实模型。需要真实干活请运行 Electron 桌面版。',
          steps: 4
        }
      });
    })();
  }

  /* ---------------- 识海：桌面 SQLite / 浏览器本地库 ---------------- */
  const mindsea = {};
  ['search', 'event', 'write', 'update', 'tail', 'capture', 'overview', 'docs', 'writeDoc', 'wanderNow', 'recordWander', 'exportData', 'importData'].forEach((action) => {
    mindsea[action] = async (payload) => {
      if (bridge.mode === 'electron') return await window.electronAPI.mindseaCall(action, payload || {});
      if (!L.mindsea || typeof L.mindsea[action] !== 'function') throw new Error('识海浏览器适配层未加载');
      return await L.mindsea[action](payload || {});
    };
  });

  /* ---------------- 桥接对象 ---------------- */
  const bridge = {
    mode: hasElectron() ? 'electron' : 'browser',
    getDefaultState,

    async load() {
      if (this.mode === 'electron') {
        const s = await window.electronAPI.getState();
        return s || getDefaultState();
      }
      const raw = DB.getItem('lifeos-data');
      let state = getDefaultState();
      if (raw) { try { state = JSON.parse(raw); } catch (e) { /* 损坏则重置 */ } }
      // 会话密钥只在内存里补回，长期存储里始终为空
      const sk = readSessionKey();
      if (sk && state && state.settings) state.settings.aiKey = sk;
      return state;
    },

    async save(state) {
      if (this.mode === 'electron') {
        return await window.electronAPI.saveState(state);
      }
      const out = Object.assign({}, state);
      if (out.settings) {
        out.settings = Object.assign({}, out.settings);
        if (out.settings.aiKeySessionOnly === true) {
          writeSessionKey(out.settings.aiKey || '');
          out.settings.aiKey = '';   // 长期存储里不留明文
        } else {
          writeSessionKey('');
        }
      }
      DB.setItem('lifeos-data', JSON.stringify(out));
      return true;
    },

    initAI(cb) {
      if (this.mode === 'electron') window.electronAPI.initAI(cb);
      // 浏览器模式由 aiChat 内部驱动
    },

    async aiChat(payload) {
      if (this.mode === 'electron') {
        window.electronAPI.aiChat(payload);
        return;
      }
      const cb = this._aiCb || ((e) => console.log('ai event', e));
      await browserAI(payload, cb);
    },

    /* ---------------- 识海 ---------------- */
    mindsea,

    /* ---------------- Agent（Codex 式） ---------------- */
    agent: {
      async getRoot() {
        if (bridge.mode === 'electron') return await window.electronAPI.agentGetRoot();
        return { root: '(浏览器演示工作区)', listing: vfsList(vfsLoad().files) };
      },

      async openWorkspace() {
        if (bridge.mode === 'electron') return await window.electronAPI.agentOpenWorkspace();
        return { root: '(浏览器演示工作区)', listing: vfsList(vfsLoad().files) };
      },

      async list(rel) {
        if (bridge.mode === 'electron') return await window.electronAPI.agentList(rel);
        return vfsList(vfsLoad().files);
      },

      async read(rel) {
        if (bridge.mode === 'electron') return await window.electronAPI.agentRead(rel);
        const vfs = vfsLoad();
        const c = vfs.files[rel];
        if (c == null) throw new Error('文件不存在：' + rel);
        return c;
      },

      async write(rel, content) {
        if (bridge.mode === 'electron') return await window.electronAPI.agentWrite(rel, content);
        const vfs = vfsLoad();
        vfs.files[rel] = String(content == null ? '' : content);
        vfsSave(vfs);
        return { rel, bytes: String(content || '').length };
      },

      async mkdir(rel) {
        if (bridge.mode === 'electron') return await window.electronAPI.agentMkdir(rel);
        // 虚拟文件系统目录隐式存在
        return { rel };
      },

      async remove(rel) {
        if (bridge.mode === 'electron') return await window.electronAPI.agentRemove(rel);
        const vfs = vfsLoad();
        vfs.files = vfsRemove(vfs.files, rel);
        vfsSave(vfs);
        return { rel };
      },

      async rename(from, to) {
        if (bridge.mode === 'electron') return await window.electronAPI.agentRename(from, to);
        const vfs = vfsLoad();
        vfs.files = vfsRename(vfs.files, from, to);
        vfsSave(vfs);
        return { from, to };
      },

      async runCommand(cmd) {
        if (bridge.mode === 'electron') return await window.electronAPI.agentRunCommand(cmd);
        return mockRunCommand(cmd);
      },

      async runCode(payload) {
        if (bridge.mode === 'electron') return await window.electronAPI.agentRunCode(payload);
        const lang = String((payload && payload.language) || 'js').toLowerCase();
        if (lang === 'python' || lang === 'py') {
          return { code: -1, stdout: '', stderr: '', note: '浏览器演示模式不支持运行 Python，请使用 Electron 桌面版（本机需安装 python3）。' };
        }
        return runJSSandbox(payload && payload.code != null ? String(payload.code) : '');
      },

      runAgent(payload, cb) {
        if (bridge.mode === 'electron') {
          window.electronAPI.initAgent(cb);
          window.electronAPI.agentRun(payload);
          return;
        }
        mockAgent(payload, cb);
      }
    }
  };

  // 保存浏览器模式下的 AI 回调引用
  const origInit = bridge.initAI.bind(bridge);
  bridge.initAI = function (cb) {
    this._aiCb = cb;
    origInit(cb);
  };

  L.bridge = bridge;
})(window.LifeOS);


/* ===== js/store.js ===== */
/* =========================================================================
 * LifeOS · 数据层
 * 负责状态读写、持久化，以及各实体的增删改。每次变更后 emit('state:changed')。
 * 所有数据仅存于本机（浏览器 localStorage / Electron 用户目录），不上传。
 * ========================================================================= */
window.LifeOS = window.LifeOS || {};

(function (L) {
  'use strict';
  const U = L.utils;
  // 统一存储适配层：未加载 storage.js 时（如单测）无缝回落原生 localStorage
  const DB = L.storage || localStorage;

  // 备份 / 快照 / 导入统一处理的实体键：新增实体只需在此登记，避免某条链路漏掉
  const ENTITY_KEYS = ['tasks', 'habits', 'notes', 'library', 'events', 'aiThread'];

  /* 密钥类设置：绝不写进备份 / 快照，也不接受外部备份覆盖。
   * - aiKey 是明文密钥，备份文件常被分享、传网盘、发微信，一旦离开本机即泄露；
   * - aiBaseUrl 若被不可信备份改写，后续 AI 请求会被导向攻击者服务器，
   *   用户却仍以为连的是自己的服务（典型的数据外泄向量）。
   * 因此导出/快照一律剔除，导入/恢复一律保留本机当前值。 */
  const SECRET_SETTING_KEYS = ['aiKey', 'aiBaseUrl'];

  function portableSettings(settings) {
    const s = Object.assign({}, settings || {});
    SECRET_SETTING_KEYS.forEach((k) => { delete s[k]; });
    return s;
  }

  /* ---------------- 导入数据清洗（防恶意备份注入 HTML / 属性 / 危险协议） ----------------
   * 备份文件可能来自他人，不能假定字段安全。这里保留全部字段，只把值收敛到可安全渲染的形态；
   * 渲染层仍统一做转义，两层都要守住。函数自包含，不依赖 L.utils 的扩展方法。 */
  const SAFE_ID = /^[A-Za-z0-9_-]{1,64}$/;
  const SAFE_HEX = /^#[0-9a-fA-F]{3,8}$/;
  const FALLBACK_COLOR = '#176c6b';

  function cleanText(v, max) {
    if (typeof v !== 'string') return '';
    return v.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '').slice(0, max || 20000);
  }

  function cleanUrl(v) {
    const s = cleanText(v, 2000).trim();
    if (!s) return '';
    const compact = s.replace(/[\u0000-\u0020\u007f]/g, '');
    if (/^(javascript|data|vbscript|file|blob|about):/i.test(compact)) return '#';
    if (/^https?:\/\//i.test(compact) || /^mailto:/i.test(compact)) return s;
    if (/^(\/|\.\/|\.\.\/|#|\?)/.test(s)) return s;
    if (!/^[a-zA-Z][a-zA-Z0-9+.\-]*:/.test(compact)) return s;
    return '#';
  }

  function cleanEntity(obj, needId) {
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return null;
    const out = {};
    Object.keys(obj).forEach((k) => {
      const v = obj[k];
      if (typeof v === 'string') out[k] = cleanText(v, 20000);
      else if (Array.isArray(v)) {
        out[k] = v.slice(0, 500).map((x) => typeof x === 'string' ? cleanText(x, 20000)
          : (x && typeof x === 'object' ? JSON.parse(JSON.stringify(x)) : x));
      } else if (v && typeof v === 'object') {
        try { out[k] = JSON.parse(JSON.stringify(v)); } catch (_) { out[k] = null; }
      } else if (typeof v === 'number' && !isFinite(v)) out[k] = 0;
      else out[k] = v;
    });
    if (needId && !SAFE_ID.test(String(out.id || ''))) out.id = U.uid();
    if ('color' in out) out.color = SAFE_HEX.test(String(out.color || '').trim()) ? String(out.color).trim() : FALLBACK_COLOR;
    if (out.source && typeof out.source === 'object' && !Array.isArray(out.source) && 'url' in out.source) {
      out.source.url = cleanUrl(out.source.url);
    }
    return out;
  }

  function cleanSettings(raw, def) {
    const src = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
    const merged = Object.assign({}, def.settings, src);
    const s = {};
    Object.keys(merged).forEach((k) => {
      const v = merged[k];
      if (typeof v === 'string') s[k] = cleanText(v, 2000);
      else if (typeof v === 'boolean' || (typeof v === 'number' && isFinite(v))) s[k] = v;
      else if (v == null) s[k] = '';
      else s[k] = cleanText(String(v), 2000);
    });
    if (['auto', 'light', 'dark'].indexOf(s.theme) < 0) s.theme = def.settings.theme;
    if (s.aiBaseUrl && !/^https?:\/\//i.test(s.aiBaseUrl)) s.aiBaseUrl = def.settings.aiBaseUrl;
    return s;
  }

  const store = {
    state: null,
    _saving: false,

    async init() {
      this.state = await L.bridge.load();
      if (!this.state) this.state = L.bridge.getDefaultState();
      // 兼容旧数据缺字段
      const def = L.bridge.getDefaultState();
      for (const k in def) if (this.state[k] === undefined) this.state[k] = def[k];
      this.state.settings = Object.assign({}, def.settings, this.state.settings || {});
      // 兼容旧版本：早期快照里可能存有明文密钥，读到后一次性脱敏
      this.sanitizeStoredSnapshots();
      return this.state;
    },

    async persist() {
      this._saving = true;
      await L.bridge.save(this.state);
      this._saving = false;
      // 每次写入顺带做一次滚动快照（内部有节流与容量保护）
      this.maybeSnapshot();
      L.bus.emit('state:changed');
    },

    /* ---------- 日历日程 ---------- */
    addEvent(e) {
      const ev = Object.assign({
        id: U.uid(), date: U.todayStr(), time: '', title: '', note: '', createdAt: Date.now()
      }, e || {});
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(ev.date))) ev.date = U.todayStr();
      ev.title = String(ev.title || '').slice(0, 200);
      ev.time = String(ev.time || '').slice(0, 20);
      ev.note = String(ev.note || '').slice(0, 2000);
      if (!Array.isArray(this.state.events)) this.state.events = [];
      this.state.events.push(ev);
      this.persist();
      return ev;
    },
    removeEvent(id) {
      const arr = this.state.events || [];
      const i = arr.findIndex((x) => x && x.id === id);
      if (i < 0) return;
      arr.splice(i, 1);
      this.persist();
    },

    /* ---------- 任务 ---------- */
    addTask(t) {
      const task = Object.assign({
        id: U.uid(),
        title: '',
        note: '',
        priority: 'medium',
        status: 'todo',
        due: null,
        tags: [],
        createdAt: Date.now(),
        updatedAt: Date.now()
      }, t);
      this.state.tasks.unshift(task);
      this.persist();
      return task;
    },
    updateTask(id, patch) {
      const t = this.state.tasks.find((x) => x.id === id);
      if (!t) return;
      Object.assign(t, patch, { updatedAt: Date.now() });
      this.persist();
    },
    removeTask(id) {
      this.state.tasks = this.state.tasks.filter((x) => x.id !== id);
      this.persist();
    },

    /* ---------- 习惯 ---------- */
    addHabit(h) {
      const habit = Object.assign({
        id: U.uid(),
        name: '',
        emoji: '◆',
        color: '#176c6b',
        createdAt: Date.now(),
        checkins: {} // { 'YYYY-MM-DD': true }
      }, h);
      this.state.habits.push(habit);
      this.persist();
      return habit;
    },
    updateHabit(id, patch) {
      const h = this.state.habits.find((x) => x.id === id);
      if (!h) return;
      Object.assign(h, patch);
      this.persist();
    },
    removeHabit(id) {
      this.state.habits = this.state.habits.filter((x) => x.id !== id);
      this.persist();
    },
    toggleHabitCheckin(id, date) {
      const h = this.state.habits.find((x) => x.id === id);
      if (!h) return;
      h.checkins = h.checkins || {};
      if (h.checkins[date]) delete h.checkins[date];
      else h.checkins[date] = true;
      this.persist();
    },

    /* ---------- 笔记 ---------- */
    addNote(n) {
      const note = Object.assign({
        id: U.uid(),
        title: '无标题笔记',
        body: '',
        tags: [],
        createdAt: Date.now(),
        updatedAt: Date.now()
      }, n);
      this.state.notes.unshift(note);
      this.persist();
      return note;
    },
    updateNote(id, patch) {
      const n = this.state.notes.find((x) => x.id === id);
      if (!n) return;
      Object.assign(n, patch, { updatedAt: Date.now() });
      this.persist();
    },
    removeNote(id) {
      this.state.notes = this.state.notes.filter((x) => x.id !== id);
      this.persist();
    },

    /* ---------- 知识库 ---------- */
    addLibraryItem(item) {
      const it = Object.assign({
        id: U.uid(),
        title: '未命名条目',
        summary: '',
        points: [],
        tags: [],
        source: { type: 'manual', label: '手动添加', url: '', fetchedAt: Date.now() },
        raw: '',
        noteId: null,
        createdAt: Date.now()
      }, item || {});
      if (!Array.isArray(it.points)) it.points = [];
      if (!Array.isArray(it.tags)) it.tags = [];
      if (!it.source || typeof it.source !== 'object') it.source = { type: 'manual', label: '手动添加', url: '', fetchedAt: Date.now() };
      if (!this.state.library) this.state.library = [];
      this.state.library.unshift(it);
      this.persist();
      return it;
    },
    updateLibraryItem(id, patch) {
      const it = (this.state.library || []).find((x) => x.id === id);
      if (!it) return;
      Object.assign(it, patch);
      this.persist();
    },
    removeLibraryItem(id) {
      this.state.library = (this.state.library || []).filter((x) => x.id !== id);
      this.persist();
    },
    clearLibrary() {
      this.state.library = [];
      this.persist();
    },
    /* 按来源 URL 去重（联网刷新时不重复堆积） */
    hasLibrarySource(url) {
      return (this.state.library || []).some((x) => x.source && x.source.url && x.source.url === url);
    },

    /* ---------- AI 对话 ---------- */
    pushAI(msg) {
      // 补时间戳，供日历 / 全年热力图统计「AI 对话」活跃度（兼容旧数据无 ts）
      if (!msg.ts) msg.ts = Date.now();
      this.state.aiThread.push(msg);
      // 限制历史长度，避免无限增长
      if (this.state.aiThread.length > 200) this.state.aiThread = this.state.aiThread.slice(-200);
      this.persist();
    },
    clearAI() {
      this.state.aiThread = [];
      this.persist();
    },

    /* ---------- 设置 ---------- */
    setSettings(patch) {
      Object.assign(this.state.settings, patch);
      this.persist();
    },

    /* ---------- 备份 / 恢复 ---------- */
    /* 导出为可移植的 JSON 对象（不含运行环境信息） */
    exportPayload() {
      const s = this.state;
      const data = {};
      ENTITY_KEYS.forEach((k) => { data[k] = s[k] || []; });
      data.settings = portableSettings(s.settings);
      return {
        app: 'LifeOS',
        schema: 1,
        exportedAt: new Date().toISOString(),
        build: (L.buildInfo && L.buildInfo.version) || 'dev',
        counts: {
          tasks: (s.tasks || []).length,
          habits: (s.habits || []).length,
          notes: (s.notes || []).length,
          library: (s.library || []).length,
          events: (s.events || []).length,
          ai: (s.aiThread || []).length
        },
        // 深拷贝：导出包是独立快照，之后的数据变更不应串改它
        data: JSON.parse(JSON.stringify(data))
      };
    },

    /* 触发浏览器下载备份文件；返回文件名 */
    downloadBackup() {
      const text = JSON.stringify(this.exportPayload(), null, 2);
      const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const d = new Date();
      const p = (n) => String(n).padStart(2, '0');
      const name = 'lifeos-backup-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
        '-' + p(d.getHours()) + p(d.getMinutes()) + '.json';
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      return name;
    },

    /* 解析并校验导入内容，返回 {data, counts, exportedAt} —— 不改动现有数据 */
    parseImport(text) {
      let obj;
      try { obj = JSON.parse(text); } catch (e) { throw new Error('文件不是有效的 JSON'); }
      if (!obj || typeof obj !== 'object') throw new Error('备份内容格式不正确');
      // 兼容两种格式：导出包 {data:{...}} 与 直接的 state 对象
      const raw = (obj.data && typeof obj.data === 'object') ? obj.data : obj;
      if (!ENTITY_KEYS.some((k) => Array.isArray(raw[k]))) {
        throw new Error('未找到任务 / 习惯 / 笔记 / 知识库 / 日程 / 对话数据，可能不是 LifeOS 备份');
      }
      const def = L.bridge.getDefaultState();
      const data = {};
      ENTITY_KEYS.forEach((k) => {
        data[k] = Array.isArray(raw[k])
          ? raw[k].slice(0, 20000).map((x) => cleanEntity(x, k !== 'aiThread')).filter(Boolean)
          : [];
      });
      // 日程日期必须严格为 YYYY-MM-DD，避免不可信备份把任意字符串写进日历
      data.events = data.events.filter((e) => e && /^\d{4}-\d{2}-\d{2}$/.test(String(e.date || '')));
      // 不可信备份带来的密钥 / 接口地址一律丢弃，由本机默认值补齐
      data.settings = cleanSettings(portableSettings(raw.settings), def);
      return { exportedAt: obj.exportedAt || null, counts: obj.counts || null, data: data };
    },

    /* 导入：mode = 'replace' | 'merge'；导入前自动留一份快照 */
    async importPayload(text, mode) {
      const parsed = this.parseImport(text);
      // 本机密钥不随外部备份改变（纵深防御：即使上面的清洗被绕过也不覆盖）
      const keep = {};
      SECRET_SETTING_KEYS.forEach((k) => { keep[k] = (this.state.settings || {})[k] || ''; });
      this.makeSnapshot('导入前自动备份');
      const d = parsed.data;
      if (mode === 'merge') {
        ENTITY_KEYS.filter((k) => k !== 'aiThread').forEach((k) => {
          if (!this.state[k]) this.state[k] = [];
          const seen = Object.create(null);
          this.state[k].forEach((x) => { if (x && x.id) seen[x.id] = true; });
          d[k].forEach((x) => {
            if (!x || !x.id || seen[x.id]) return;
            this.state[k].push(x);
            seen[x.id] = true;
          });
        });
        const seenAI = Object.create(null);
        this.state.aiThread.forEach((m) => { seenAI[m.role + '|' + m.ts + '|' + (m.content || '').slice(0, 20)] = true; });
        d.aiThread.forEach((m) => {
          const k = m.role + '|' + m.ts + '|' + (m.content || '').slice(0, 20);
          if (!seenAI[k]) { this.state.aiThread.push(m); seenAI[k] = true; }
        });
      } else {
        this.state = {};
        ENTITY_KEYS.forEach((k) => { this.state[k] = d[k]; });
        this.state.settings = Object.assign({}, portableSettings(d.settings), keep);
      }
      // 补齐缺失字段
      const def = L.bridge.getDefaultState();
      for (const k in def) if (this.state[k] === undefined) this.state[k] = def[k];
      await this.persist();
      return parsed;
    },

    /* ---------- 本地快照 ---------- */
    SNAP_KEY: 'lifeos-snapshots',
    SNAP_MAX: 8,

    snapshotList() {
      try { return JSON.parse(DB.getItem(this.SNAP_KEY) || '[]'); }
      catch (e) { return []; }
    },

    /* 一次性迁移：清掉旧版本快照里已写入的明文密钥（不影响快照的数据实体） */
    sanitizeStoredSnapshots() {
      try {
        const list = this.snapshotList();
        let changed = false;
        list.forEach((s) => {
          if (!s || !s.data || !s.data.settings) return;
          SECRET_SETTING_KEYS.forEach((k) => {
            if (k in s.data.settings) { delete s.data.settings[k]; changed = true; }
          });
        });
        if (changed) DB.setItem(this.SNAP_KEY, JSON.stringify(list));
      } catch (_) { /* 无存储权限时静默跳过 */ }
    },

    makeSnapshot(label) {
      try {
        const s = this.state;
        const data = {};
        ENTITY_KEYS.forEach((k) => { data[k] = s[k] || []; });
        data.settings = portableSettings(s.settings);
        const list = this.snapshotList();
        list.unshift({
          id: U.uid(),
          at: Date.now(),
          label: label || '手动快照',
          counts: {
            tasks: (s.tasks || []).length,
            habits: (s.habits || []).length,
            notes: (s.notes || []).length,
            library: (s.library || []).length,
            ai: (s.aiThread || []).length
          },
          data: JSON.parse(JSON.stringify(data))
        });
        // 容量保护：超出约 3.5MB 时逐份丢弃最旧的
        let trimmed = list.slice(0, this.SNAP_MAX);
        while (trimmed.length > 1 && JSON.stringify(trimmed).length > 3500000) trimmed.pop();
        DB.setItem(this.SNAP_KEY, JSON.stringify(trimmed));
        return true;
      } catch (e) { return false; } // 存储配额不足时静默跳过，不影响主功能
    },

    /* 节流滚动快照：距上次至少 3 分钟才写一份 */
    maybeSnapshot() {
      const list = this.snapshotList();
      if (list.length && Date.now() - (list[0].at || 0) < 3 * 60 * 1000) return;
      this.makeSnapshot('自动快照');
    },

    async restoreSnapshot(id) {
      const snap = this.snapshotList().find((x) => x.id === id);
      if (!snap) throw new Error('快照不存在或已被清理');
      this.makeSnapshot('恢复前自动备份');
      const def = L.bridge.getDefaultState();
      const prev = this.state.settings || {};
      const d = snap.data || {};
      this.state = {};
      ENTITY_KEYS.forEach((k) => { this.state[k] = d[k] || []; });
      // 兼容旧快照（可能含明文密钥）：先脱敏，再补回本机当前值，密钥不随回滚变化
      this.state.settings = Object.assign({}, def.settings, portableSettings(d.settings));
      SECRET_SETTING_KEYS.forEach((k) => { this.state.settings[k] = prev[k] || ''; });
      await this.persist();
      return snap;
    },

    clearSnapshots() {
      try { DB.removeItem(this.SNAP_KEY); } catch (e) { /* noop */ }
    },

    storageInfo() {
      let bytes = 0;
      try { bytes = new Blob([JSON.stringify(this.state)]).size; }
      catch (e) { bytes = JSON.stringify(this.state).length; }
      return { bytes };
    }
  };

  L.store = store;
})(window.LifeOS);


/* ===== js/links.js ===== */
/* =========================================================================
 * LifeOS · 双向链接核心（Obsidian 风格 [[Wiki Links]]）
 * 只做索引计算，不改动数据；任何模块都可调用 L.links。
 * 语法： [[笔记标题]]  或  [[笔记标题|显示文本]]
 * ========================================================================= */
window.LifeOS = window.LifeOS || {};

(function (L) {
  'use strict';

  function norm(s) { return String(s == null ? '' : s).trim().toLowerCase(); }
  function targetOf(inner) { return String(inner).split('|')[0].trim(); }
  function labelOf(inner) { const p = String(inner).split('|'); return (p[1] || p[0]).trim(); }

  /* 提取正文中所有链接目标（去重，保持出现顺序） */
  function extract(body) {
    const out = [];
    const re = /\[\[([^\]]+)\]\]/g;
    let m;
    while ((m = re.exec(body || '')) !== null) {
      const t = targetOf(m[1]);
      if (t && out.indexOf(t) < 0) out.push(t);
    }
    return out;
  }

  /* 按标题解析到真实笔记（不区分大小写、忽略首尾空格） */
  function resolve(title) {
    const n = norm(title);
    if (!n) return null;
    const notes = (L.store && L.store.state && L.store.state.notes) || [];
    for (let i = 0; i < notes.length; i++) {
      if (norm(notes[i].title) === n) return notes[i];
    }
    return null;
  }

  /* 出链： [{ title, note|null }] */
  function outbound(note) {
    return extract(note.body).map((t) => ({ title: t, note: resolve(t) }));
  }

  /* 反向链接：哪些笔记链向了当前笔记 */
  function backlinks(note) {
    const n = norm(note.title);
    if (!n) return [];
    const notes = (L.store && L.store.state && L.store.state.notes) || [];
    return notes.filter((x) => x.id !== note.id && extract(x.body).some((t) => norm(t) === n));
  }

  /* 所有链接边 */
  function edges() {
    const notes = (L.store && L.store.state && L.store.state.notes) || [];
    const res = [];
    notes.forEach((from) => {
      extract(from.body).forEach((t) => res.push({ from: from, toTitle: t, to: resolve(t) }));
    });
    return res;
  }

  /* 图谱数据：真实笔记节点 + 未创建的虚拟节点 + 边（用节点下标表示） */
  function graph() {
    const notes = (L.store && L.store.state && L.store.state.notes) || [];
    const nodes = notes.map((n) => ({ id: n.id, title: n.title, real: true }));
    const idx = {};
    nodes.forEach((n, i) => { idx[norm(n.title)] = i; });

    edges().forEach((e) => {
      if (!e.to) {
        const k = norm(e.toTitle);
        if (!(k in idx)) {
          idx[k] = nodes.length;
          nodes.push({ id: 'v:' + k, title: e.toTitle, real: false });
        }
      }
    });

    const links = edges()
      .map((e) => ({ s: idx[norm(e.from.title)], t: idx[norm(e.toTitle)] }))
      .filter((l) => l.s !== undefined && l.t !== undefined && l.s !== l.t);
    return { nodes: nodes, links: links };
  }

  /* 孤立笔记（既没有出链也没有入链） */
  function orphans() {
    const es = edges();
    const touched = {};
    es.forEach((e) => { touched[e.from.id] = true; if (e.to) touched[e.to.id] = true; });
    const notes = (L.store && L.store.state && L.store.state.notes) || [];
    return notes.filter((n) => !touched[n.id]);
  }

  /* ---------------- W2 · B1 反链上下文 / 未链接提及 / B3 安全重命名 ---------------- */

  /* 反链上下文：不只是「谁链了我」，还给出引用所在原文行（Obsidian 式）。
   * 返回 [{ note, snippets: [原文行…] }]，只保留真正含该 wikilink 的笔记。 */
  function backlinkContexts(note) {
    const n = norm(note.title);
    if (!n) return [];
    const notes = (L.store && L.store.state && L.store.state.notes) || [];
    return notes.filter((x) => x.id !== note.id).map((x) => {
      const lines = String(x.body || '').split('\n');
      const snippets = lines.filter((line) => {
        const re = /\[\[([^\]]+)\]\]/g;
        let m;
        while ((m = re.exec(line)) !== null) {
          if (norm(targetOf(m[1])) === n) return true;
        }
        return false;
      }).map((s) => s.trim()).filter(Boolean).slice(0, 3);
      return { note: x, snippets: snippets };
    }).filter((b) => b.snippets.length > 0);
  }

  /* 未链接提及：正文里出现了当前笔记标题，但没有被 [[ ]] 包住。
   * 先剥离所有 wikilink 再找纯文本，避免把已有链接重复计入。 */
  function unlinkedMentions(note) {
    const n = norm(note.title);
    if (n.length < 2) return [];
    const notes = (L.store && L.store.state && L.store.state.notes) || [];
    return notes.filter((x) => {
      if (x.id === note.id) return false;
      const plain = String(x.body || '').replace(/\[\[([^\]]+)\]\]/g, '');
      return plain.toLowerCase().indexOf(n) >= 0;
    }).map((x) => {
      const lines = String(x.body || '').replace(/\[\[([^\]]+)\]\]/g, '').split('\n');
      const hit = lines.find((l) => l.toLowerCase().indexOf(n) >= 0) || '';
      return { note: x, snippet: hit.trim().slice(0, 120) };
    });
  }

  /* 把纯文本里第一次出现的标题包成 [[链接]]（用于「一键转链接」）。
   * 先标记所有 [[ ]] 区间，再在第一个「区间外」的命中处插入，避免破坏已有链接。 */
  function linkifyFirst(body, title) {
    const s = String(body || '');
    const t = String(title || '').trim();
    if (!t) return { body: s, count: 0 };
    const lower = s.toLowerCase(), needle = t.toLowerCase();
    const ranges = [];
    const re = /\[\[[^\]]*\]\]/g;
    let m;
    while ((m = re.exec(s)) !== null) ranges.push([m.index, m.index + m[0].length]);
    const inside = (i) => ranges.some((r) => i >= r[0] && i < r[1]);
    let at = -1, from = 0;
    while ((at = lower.indexOf(needle, from)) >= 0) {
      if (!inside(at)) break;
      from = at + 1;
      at = -1;
    }
    if (at < 0) return { body: s, count: 0 };
    return { body: s.slice(0, at) + '[[' + t + ']]' + s.slice(at + t.length), count: 1 };
  }

  /* 单篇正文内批量改写 wikilink 目标：[[旧]] / [[旧|别名]] → [[新]] / [[新|别名]]。
   * 别名保留；大小写/空格不敏感匹配；同名不改写。纯函数，不碰 state。 */
  function rewriteLinks(body, from, to) {
    const a = norm(from), b = String(to == null ? '' : to);
    if (!a || a === norm(b)) return { body: String(body || ''), count: 0 };
    let count = 0;
    const out = String(body || '').replace(/\[\[([^\]]+)\]\]/g, (m, inner) => {
      const p = inner.split('|');
      if (norm(p[0]) !== a) return m;
      count++;
      return '[[' + b + (p.length > 1 ? '|' + p.slice(1).join('|') : '') + ']]';

    return { body: out, count: count };

   * 直接改 state.notes 的 body，返回改动统计；由调用方统一 persist。 */

      const r = rewriteLinks(n.body, oldTitle, newTitle);
      if (r.count) {
        n.body = r.body;
        n.updatedAt = Date.now();

        touched.push(n.id);
      }

    return { changed: changed, touched: touched };
  }

  L.links = {
    norm: norm, targetOf: targetOf, labelOf: labelOf,
    extract: extract, resolve: resolve, outbound: outbound,
    backlinks: backlinks, edges: edges, graph: graph, orphans: orphans,
    backlinkContexts: backlinkContexts, unlinkedMentions: unlinkedMentions,
    linkifyFirst: linkifyFirst, rewriteLinks: rewriteLinks, renameNoteLinks: renameNoteLinks

/* ===== js/vault.js ===== */
/* =========================================================================
 * LifeOS · Markdown Vault 互通（W2 · B3）
 *
 * 纯文本优先：笔记可以导出为带 YAML frontmatter 的 .md，也可以从 .md 导入。
 * 本模块是自包含纯函数，不依赖 DOM / store，便于单测与桌面端复用。
 *
 * 安全：导入的文本一律视为不可信，先去掉控制字符、限长；危险协议交给
 * 渲染层 U.safeUrl / U.escapeHtml 与 store 的 cleanEntity 两道防线。
 * ========================================================================= */
window.LifeOS = window.LifeOS || {};

(function (L) {
  'use strict';

  function cleanText(v, max) {
    return String(v == null ? '' : v)
      .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '')
      .slice(0, max || 200000);
  }

  function yamlQuote(s) {
    return '"' + String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"')
      .replace(/[\r\n]/g, ' ').slice(0, 500) + '"';
  }
  function yamlUnquote(s) {
    const t = String(s || '').trim();
    if (t.length >= 2 && (t[0] === '"' || t[0] === "'") && t[t.length - 1] === t[0]) {
      return t.slice(1, -1).replace(/\\"/g, '"').replace(/\\\\/g, '\\');
    }
    return t.replace(/^['"]|['"]$/g, '');
  }

  /* 单篇笔记 → .md 文本（frontmatter: title / tags / created / updated） */
  function noteToMarkdown(note) {
    const n = note || {};
    const title = cleanText(n.title || '无标题笔记', 200);
    const tags = Array.isArray(n.tags) ? n.tags.map((t) => cleanText(t, 60)) : [];
    const lines = ['---', 'title: ' + yamlQuote(title)];
    if (tags.length) lines.push('tags: [' + tags.map(yamlQuote).join(', ') + ']');
    if (n.createdAt) lines.push('created: ' + new Date(n.createdAt).toISOString());
    if (n.updatedAt) lines.push('updated: ' + new Date(n.updatedAt).toISOString());
    lines.push('---', '', '# ' + title, '', cleanText(n.body || ''));
    return lines.join('\n');
  }

  /* .md 文本 → 笔记数据（不含 id / 时间戳，交给 store.addNote 补齐）。
   * 兼容两种来源：① 本应用导出的 frontmatter ② 普通 .md（取首个 # 标题或文件名）。 */
  function markdownToNote(text, filename) {
    const raw = cleanText(text).replace(/\r\n/g, '\n');
    let body = raw, title = '', tags = [];
    const fm = /^---\n([\s\S]*?)\n---\n?/.exec(raw);
    if (fm) {
      body = raw.slice(fm[0].length);
      fm[1].split('\n').forEach((l) => {
        const mt = /^title:\s*(.*)$/.exec(l);
        if (mt) title = yamlUnquote(mt[1]);
        const tg = /^tags:\s*\[(.*)\]\s*$/.exec(l);
        if (tg) tags = tg[1].split(',').map(yamlUnquote).filter(Boolean);
      });
    }
    const h = /^#\s+(.+)$/m.exec(body);
    if (h) {
      if (!title) title = h[1].trim();
      body = body.replace(h[0], '').replace(/^\n+/, '');
    }
    if (!title) title = String(filename || '').replace(/\.md$/i, '').trim() || '导入的笔记';
    return {
      title: cleanText(title, 200),
      body: cleanText(body.trim(), 200000),
      tags: tags.slice(0, 50).map((t) => cleanText(t, 60))
    };
  }

  /* 全库导出：{ filename, content }[]，文件名做安全化（去路径分隔与危险字符） */
  function safeFilename(title, used) {
    let base = String(title || '无标题笔记')
      .replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_')
      .replace(/\s+/g, ' ').trim().slice(0, 60) || '笔记';
    let name = base + '.md', i = 2;
    const seen = used || Object.create(null);
    while (seen[name]) { name = base + '-' + (i++) + '.md'; }
    seen[name] = true;
    return name;
  }

  function exportNotes(notes) {
    const used = Object.create(null);
    return (notes || []).map((n) => ({
      filename: safeFilename(n && n.title, used),
      content: noteToMarkdown(n)
    }));
  }

  L.vault = {
    noteToMarkdown: noteToMarkdown,
    markdownToNote: markdownToNote,
    exportNotes: exportNotes,
    safeFilename: safeFilename
  };
})(window.LifeOS);


/* ===== js/search.js ===== */
/* =========================================================================
 * LifeOS · 全局统一检索核心（W2 · B4）
 *
 * 跨「笔记 / 知识库 / 任务 / 日程 / AI 对话 / 识海记忆」聚合命中。
 * 纯计算：只读取传入的 state 与 mindsea 快照，不改动任何数据、不依赖 DOM。
 * 识海侧不替换既有 ms-search，而是聚合它的结果（方案口径：做聚合而非替换）。
 * ========================================================================= */
window.LifeOS = window.LifeOS || {};

(function (L) {
  'use strict';

  function has(s, q) { return String(s == null ? '' : s).toLowerCase().indexOf(q) >= 0; }

  /* 生成命中上下文片段：优先截取关键词附近的文字 */
  function snippet(s, q, len) {
    const t = String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
    const n = len || 90;
    const i = t.toLowerCase().indexOf(q);
    if (i < 0) return t.slice(0, n);
    const start = Math.max(0, i - 24);
    return (start > 0 ? '…' : '') + t.slice(start, start + n) + (start + n < t.length ? '…' : '');
  }

  /* 主入口：searchAll(query, state, mindseaSnapshot)
   * 返回 [{ type, label, icon, title, snippet, view, id }]，按类型分组有序。 */
  function searchAll(query, state, mindsea) {
    const q = String(query == null ? '' : query).trim().toLowerCase();
    if (!q) return [];
    const st = state || {};
    const out = [];

    (st.notes || []).forEach((n) => {
      if (!n) return;
      const tags = (n.tags || []).join(' ');
      if (has(n.title, q) || has(n.body, q) || has(tags, q)) {
        out.push({ type: 'note', label: '笔记', icon: '✎', view: 'notes', id: n.id,
          title: n.title || '无标题笔记', snippet: snippet(n.body, q) });
      }
    });

    (st.library || []).forEach((x) => {
      if (!x) return;
      const points = Array.isArray(x.points) ? x.points.join(' ') : '';
      if (has(x.title, q) || has(x.summary, q) || has(points, q)) {
        out.push({ type: 'library', label: '知识库', icon: '▤', view: 'library', id: x.id,
          title: x.title || '未命名条目', snippet: snippet(x.summary || points, q) });
      }
    });

    (st.tasks || []).forEach((t) => {
      if (t && (has(t.title, q) || has(t.note, q))) {
        out.push({ type: 'task', label: '任务', icon: '✓', view: 'tasks', id: t.id,
          title: t.title || '无标题任务', snippet: snippet(t.note, q) });
      }
    });

    (st.events || []).forEach((e) => {
      if (e && (has(e.title, q) || has(e.note, q))) {
        out.push({ type: 'event', label: '日程', icon: '◷', view: 'calendar', id: e.id,
          title: e.title || '未命名日程', snippet: snippet((e.date || '') + ' ' + (e.note || ''), q) });
      }
    });

    (st.aiThread || []).forEach((m) => {
      if (m && has(m.content, q)) {
        out.push({ type: 'ai', label: 'AI 对话', icon: '◇', view: 'ai', id: null,
          title: m.role === 'user' ? '我：' + snippet(m.content, q, 40) : 'AI：' + snippet(m.content, q, 40),
          snippet: snippet(m.content, q) });
      }
    });

    // 识海快照：兼容 { memories: [...] } / { words: [...] } / 数组三种形态
    const ms = mindsea || {};
    const rows = Array.isArray(ms) ? ms :
      (Array.isArray(ms.memories) ? ms.memories : (Array.isArray(ms.words) ? ms.words : []));
    rows.forEach((r) => {
      if (r && has(r.text, q)) {
        out.push({ type: 'mindsea', label: '识海记忆', icon: '◉', view: 'mindsea', id: r.id || null,
          title: snippet(r.text, q, 46), snippet: snippet((r.at ? r.at + ' · ' : '') + r.text, q) });
      }
    });

    // 稳定性：按类型固定顺序 + 组内保持原顺序，避免结果跳动
    const order = { note: 0, library: 1, task: 2, event: 3, ai: 4, mindsea: 5 };
    out.sort((a, b) => (order[a.type] - order[b.type]));
    return out;
  }

  /* 分组统计，供面板头部显示「笔记 3 · 知识库 1 · 识海 2」 */
  function groupCounts(results) {
    const m = {};
    (results || []).forEach((r) => { m[r.label] = (m[r.label] || 0) + 1; });
    return m;
  }

  /* 高亮关键词（返回已转义的安全 HTML，调用方直接 innerHTML 用）。
   * 按关键词把原文切成「普通段 / 命中段」，逐段 escapeHtml 后再拼装，
   * 保证关键词含 < > & 等特殊字符时也不会破坏 HTML 或注入脚本。 */
  function highlight(text, query) {
    const esc = (L.utils && L.utils.escapeHtml) ? L.utils.escapeHtml :
      ((s) => String(s).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])));
    const t = String(text == null ? '' : text);
    const q = String(query == null ? '' : query).trim();
    if (!q) return esc(t.slice(0, 120));
    const i = t.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return esc(t.slice(0, 120));
    const from = Math.max(0, i - 24);
    const raw = (from > 0 ? '…' : '') + t.slice(from, from + 120);
    const lower = raw.toLowerCase(), needle = q.toLowerCase();
    let pos = 0, at, out = '';
    while ((at = lower.indexOf(needle, pos)) >= 0) {
      out += esc(raw.slice(pos, at)) + '<mark>' + esc(raw.slice(at, at + q.length)) + '</mark>';
      pos = at + q.length;
    }
    out += esc(raw.slice(pos));
    return out;
  }

  L.search = { searchAll: searchAll, groupCounts: groupCounts, highlight: highlight, snippet: snippet };
})(window.LifeOS);


/* ===== js/stats.js ===== */
/* =========================================================================
 * LifeOS · 活动统计核心
 * 把任务/习惯/笔记/AI 对话聚合成「按日活跃度」，供日历与全年热力图共用。
 * 纯计算，不改动数据，兼容旧数据缺字段。
 * ========================================================================= */
window.LifeOS = window.LifeOS || {};

(function (L) {
  'use strict';

  /* 时间戳 -> 本地时区 YYYY-MM-DD */
  function dayKey(ts) {
    const d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    const off = d.getTimezoneOffset() * 60000;
    return new Date(d.getTime() - off).toISOString().slice(0, 10);
  }

  function bump(map, date, item) {
    if (!date) return;
    if (!map[date]) map[date] = { count: 0, items: [] };
    map[date].count += 1;
    map[date].items.push(item);
  }

  /* 返回 { 'YYYY-MM-DD': { count, items:[{type,icon,label}] } } */
  function activity() {
    const st = (L.store && L.store.state) || {};
    const map = {};

    (st.tasks || []).forEach((t) => {
      const created = dayKey(t.createdAt);
      bump(map, created, { type: 'task', icon: '✓', label: '创建任务 · ' + (t.title || '无标题') });
      if (t.status === 'done') {
        bump(map, dayKey(t.updatedAt), { type: 'done', icon: '✔', label: '完成任务 · ' + (t.title || '无标题') });
      }
      if (t.due) bump(map, t.due, { type: 'due', icon: '▦', label: '任务截止 · ' + (t.title || '无标题') });
    });

    (st.habits || []).forEach((h) => {
      Object.keys(h.checkins || {}).forEach((d) => {
        if (h.checkins[d]) bump(map, d, { type: 'habit', icon: '◆', label: '打卡 · ' + (h.emoji || '◆') + ' ' + (h.name || '') });
      });
    });

    (st.notes || []).forEach((n) => {
      bump(map, dayKey(n.createdAt), { type: 'note', icon: '✎', label: '新建笔记 · ' + (n.title || '无标题') });
      const u = dayKey(n.updatedAt);
      if (u && u !== dayKey(n.createdAt)) bump(map, u, { type: 'edit', icon: '✎', label: '编辑笔记 · ' + (n.title || '无标题') });
    });

    (st.aiThread || []).forEach((m) => {
      if (m.ts) bump(map, dayKey(m.ts), { type: 'ai', icon: '◇', label: 'AI 对话' });
    });

    // 用户手动添加的日程也算当天活动，日历与热力图同步亮起
    (st.events || []).forEach((e) => {
      if (e && /^\d{4}-\d{2}-\d{2}$/.test(String(e.date || ''))) {
        bump(map, e.date, { type: 'event', icon: '◷', label: '日程 · ' + (e.time ? e.time + ' ' : '') + (e.title || '未命名') });
      }
    });

    return map;
  }

  /* 活跃度分档 0-4（力扣 / GitHub 风格） */
  function level(count) {
    if (!count) return 0;
    if (count <= 1) return 1;
    if (count <= 3) return 2;
    if (count <= 6) return 3;
    return 4;
  }

  /* 近 N 天（含今天）的日期数组，正序 */
  function daysBack(n) {
    const out = [];
    const d = new Date();
    for (let i = n - 1; i >= 0; i--) {
      const x = new Date(d.getTime());
      x.setDate(x.getDate() - i);
      const off = x.getTimezoneOffset() * 60000;
      out.push(new Date(x.getTime() - off).toISOString().slice(0, 10));
    }
    return out;
  }

  /* 连续天数：current=截至今天的连续，longest=全年最长 */
  function streaks(map, dates) {
    let current = 0;
    for (let i = dates.length - 1; i >= 0; i--) {
      if (map[dates[i]] && map[dates[i]].count) current++;
      else break;
    }
    let longest = 0, run = 0;
    dates.forEach((d) => {
      if (map[d] && map[d].count) { run++; if (run > longest) longest = run; }
      else run = 0;
    });
    return { current: current, longest: longest };
  }

  L.stats = { dayKey: dayKey, activity: activity, level: level, daysBack: daysBack, streaks: streaks };
})(window.LifeOS);

      if (timer) clearTimeout(timer);
      const why = (e && e.name === 'AbortError') ? '请求超时（45 秒）' : (e && e.message ? e.message : String(e));
      throw new Error('AI 接口不可达：' + why + '。请检查 Base URL、Key 与网络，或暂时改用「粘贴正文」。');
    }
    if (timer) clearTimeout(timer);
    if (!resp.ok) {
      const t = await resp.text().catch(() => '');
      throw new Error('AI 接口错误 ' + resp.status + ' ' + truncate(t, 120));
    }
    const j = await resp.json();
    const txt = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    if (!txt) throw new Error('AI 未返回内容');
    return txt;
  }

  /* 容错解析：剥掉 ```json 围栏、前后解释文字，支持单对象或数组 */
  function parseAIJson(text) {
    let s = String(text == null ? '' : text).trim();
    s = s.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '').trim();
    const start = s.search(/[\[{]/);
    if (start < 0) throw new Error('AI 返回内容里找不到 JSON');
    s = s.slice(start);
    const end = Math.max(s.lastIndexOf('}'), s.lastIndexOf(']'));
    if (end >= 0) s = s.slice(0, end + 1);
    try { return JSON.parse(s); }
    catch (e) { throw new Error('AI 返回内容无法解析为 JSON：' + (e && e.message ? e.message : e)); }
  }

  const AI_ORGANIZE_PROMPT =
    '你是知识整理助手。把用户给出的内容整理成 1 条结构化知识卡片，提炼核心信息与可执行要点。' +
    '只输出严格 JSON，不要 Markdown 代码块、不要任何解释文字：' +
    '{"title":"简短标题","summary":"不超过120字的摘要","points":["要点1","要点2","要点3"],"tags":["标签1","标签2"]}';

  const AI_TOPIC_PROMPT =
    '你是知识采集助手。用户给出一个主题，请结合你掌握的公开知识，整理成 1 条结构化知识卡片。' +
    '要求内容具体、可执行，包含明确数字、步骤或判据，避免「要努力」「要做好规划」这类空泛套话。' +
    '只输出严格 JSON，不要 Markdown 代码块、不要任何解释文字：' +
    '{"title":"简短标题","summary":"不超过120字的摘要","points":["要点1","要点2","要点3"],"tags":["标签1","标签2"]}';

  /* 把模型/本地抽取的结果规范成统一的条数据结构 */
  function toItem(o, meta) {
    meta = meta || {};
    return {
      title: truncate(String((o && o.title) || meta.title || '未命名条目').trim(), 80) || '未命名条目',
      summary: truncate(String((o && o.summary) || '').trim(), 300),
      points: (o && Array.isArray(o.points) ? o.points : []).map((x) => truncate(String(x).trim(), 200)).filter(Boolean).slice(0, 8),
      tags: (o && Array.isArray(o.tags) ? o.tags : []).map((x) => truncate(String(x).trim(), 20)).filter(Boolean).slice(0, 8),
      source: Object.assign({ type: 'manual', label: '手动添加', url: '', fetchedAt: Date.now() }, meta.source || {}),
      raw: truncate(meta.raw || '', 6000)
    };
  }

  /* 不依赖 AI 的确定性整理：真的从文本里抽标题、摘要、要点、标签，不是塞假数据 */
  function localOrganize(rawText, meta) {
    meta = meta || {};
    const src = String(rawText == null ? '' : rawText).trim();
    const lines = src.split('\n').map((l) => l.trim()).filter(Boolean);

    let title = truncate(String(meta.title || '').trim(), 60);
    if (!title) {
      const head = lines.find((l) => /^#{1,3}\s+/.test(l));
      title = head ? head.replace(/^#{1,3}\s+/, '') : (lines[0] || '');
    }
    title = truncate(cleanText(title).replace(/[\[\]]/g, ''), 60) || '未命名条目';

    let points = lines
      .filter((l) => /^(?:[-*•]|\d+[.、)])\s+/.test(l))
      .map((l) => l.replace(/^(?:[-*•]|\d+[.、)])\s+/, '').replace(/[*_`]/g, '').trim())
      .filter(Boolean);
    if (!points.length) {
      const sentences = cleanText(src).match(/[^。！？!?；;\n]+[。！？!?；;]?/g) || [];
      points = sentences.map((s) => s.trim()).filter((s) => s.length >= 10);
    }
    points = points.slice(0, 6);

    const flat = cleanText(src);
    const summary = truncate((points.length ? points.slice(0, 2).join(' ') : flat) || title, 140);

    let tags = (meta.tags || []).slice();
    if (!tags.length) {
      const m = src.match(/#[^\s#,，]{1,12}/g) || [];
      tags = m.map((x) => x.slice(1)).slice(0, 5);
    }

    return {
      title: title,
      summary: summary,
      points: points,
      tags: tags,
      source: Object.assign({ type: 'paste', label: '本地整理', url: '', fetchedAt: Date.now() }, meta.source || {}),
      raw: truncate(src, 6000)
    };
  }

  /* 整理：配了 Key 且勾选 AI 就用模型，否则本地抽取 */
  async function organize(rawText, opts) {
    opts = opts || {};
    const meta = opts.meta || {};
    if (opts.useAI && opts.settings && opts.settings.aiKey) {
      const text = await callAI([
        { role: 'system', content: AI_ORGANIZE_PROMPT },
        { role: 'user', content: '请整理以下内容：\n\n' + truncate(rawText, 6000) }
      ], opts.settings);
      const obj = parseAIJson(text);
      const arr = Array.isArray(obj) ? obj : [obj];
      return arr.map((o) => toItem(o, meta));
    }
    return [localOrganize(rawText, meta)];
  }

  /* ---------- 通道 1：AI 主题采集 ---------- */
  async function collectTopic(topic, settings) {
    const t = String(topic || '').trim();
    if (!t) throw new Error('请输入要采集的主题');
    if (!settings || !settings.aiKey) {
      throw new Error('AI 主题采集需要 API Key（在「设置」里填）。没配 Key 时请用「粘贴正文」通道：同样能把外部内容整理进知识库，且不联网。');
    }
    const text = await callAI([
      { role: 'system', content: AI_TOPIC_PROMPT },
      { role: 'user', content: '主题：' + t }
    ], settings);
    const obj = parseAIJson(text);
    const arr = Array.isArray(obj) ? obj : [obj];
    return arr.map((o) => toItem(o, {
      source: { type: 'ai', label: 'AI 采集 · ' + truncate(t, 20), url: '', fetchedAt: Date.now() },
      raw: ''
    }));
  }

  /* ---------- 通道 2：URL 采集 ---------- */
  async function collectUrl(url, settings, opts) {
    opts = opts || {};
    const u = String(url || '').trim();
    if (!/^https?:\/\//i.test(u)) throw new Error('请填写以 http:// 或 https:// 开头的完整网址');
    const raw = await fetchText(u);
    let text = raw;
    let title = '';

    // 公开 JSON 接口：直接取结构化字段，无需 AI
    try {
      const j = JSON.parse(raw);
      if (j && j.hitokoto) {
        const t = '摘录 · ' + (j.from_who || j.from || '公开接口');
        return [toItem({ title: t, summary: String(j.hitokoto).slice(0, 140), points: [], tags: ['外部摘录'] }, {
          source: { type: 'url', label: '外部采集 · ' + (j.from || '公开接口'), url: u, fetchedAt: Date.now() },
          raw: String(j.hitokoto)
        })];
      }
      text = JSON.stringify(j, null, 1).slice(0, 6000);
    } catch (e) { /* 不是 JSON，按 HTML 处理 */ }

    if (/<[a-z][\s\S]*>/i.test(raw)) {
      text = stripMarkup(raw);
      const m = raw.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
      if (m) title = truncate(stripMarkup(m[1]), 60);
    }
    if (!text.trim()) throw new Error('抓取到的内容为空');

    return await organize(text, {
      useAI: !!opts.useAI, settings: settings,
      meta: {
        title: title,
        source: { type: 'url', label: opts.useAI ? '外部采集 · AI 整理' : '外部采集 · 本地整理', url: u, fetchedAt: Date.now() },
        raw: truncate(text, 6000)
      }
    });
  }

  /* ---------- 通道 3：粘贴正文 ---------- */
  async function collectText(text, title, settings, opts) {
    opts = opts || {};
    const src = String(text || '').trim();
    if (!src) throw new Error('请先粘贴要整理的内容');
    const useAI = !!opts.useAI && !!(settings && settings.aiKey);
    return await organize(src, {
      useAI: useAI, settings: settings,
      meta: {
        title: truncate(String(title || '').trim(), 60),
        source: { type: 'paste', label: useAI ? '粘贴 · AI 整理' : '粘贴 · 本地整理', url: '', fetchedAt: Date.now() },
        raw: truncate(src, 6000)
      }
    });
  }

  /* ---------- 联网刷新：批量拉已登记公开源，按来源去重 ---------- */
  async function refreshSources() {
    const added = [], skipped = [], errors = [];
    for (const src of PUBLIC_SOURCES) {
      try {
        const raw = await fetchText(src.url);
        const j = JSON.parse(raw);
        if (!j || !j.hitokoto) { errors.push(src.label + '：返回格式不是预期的一言 JSON'); continue; }
        const key = src.url + '#id=' + (j.id || j.uuid || String(j.hitokoto).slice(0, 10));
        if (L.store && L.store.hasLibrarySource(key)) { skipped.push(src.label); continue; }
        added.push({
          title: '摘录 · ' + (j.from_who || j.from || src.label),
          summary: truncate(j.hitokoto, 140),
          points: [],
          tags: ['外部摘录', String(src.label).replace('一言 · ', '')],
          source: { type: 'public', label: '联网刷新 · ' + src.label, url: key, fetchedAt: Date.now() },
          raw: String(j.hitokoto)
        });
      } catch (e) {
        errors.push(src.label + '：' + (e && e.message ? e.message : String(e)));
      }
    }
    return { added: added, skipped: skipped, errors: errors };
  }

  L.capture = {
    PUBLIC_SOURCES: PUBLIC_SOURCES,
    stripMarkup: stripMarkup, cleanText: cleanText, truncate: truncate,
    fetchText: fetchText, callAI: callAI, parseAIJson: parseAIJson,
    toItem: toItem, localOrganize: localOrganize, organize: organize,
    collectTopic: collectTopic, collectUrl: collectUrl, collectText: collectText,
    refreshSources: refreshSources
  };
})(window.LifeOS);

      const item = j ? { text: line.text, at: line.at, speaker: line.speaker, ev: j.ev || '', nd: j.nd || '', st: j.st || '', s: Math.max(0, Math.min(100, Math.round(Number(j.s) || 50))), emo: j.emo || [], dec: Number(j.dec) === 1 && j.decobj ? 1 : 0, decobj: j.decobj || '', category: CATS.includes(j.cat) ? j.cat : '', place: judged.trash?.includes(line.i) ? 'trash' : '' } : classify(line);
      items.push(item);
    }
    const result = items.length ? writeMemories({ items }) : { ok: true, written: 0, ids: [], created: { events: [], versions: [], stages: [] }, errors: [] };
    log({ level: result.ok ? 'ok' : 'fail', mode, reason, lines: lines.length, written: result.written, created: result.created }); save();
    return Object.assign({ mode, lines: lines.length }, result);
  }
  function overview() {
    const words = db.memories.slice().sort((a, b) => b.at.localeCompare(a.at) || b.id - a.id).slice(0, 500).map(wordView);
    const today = localTime().slice(0, 10);
    const todayLogs = db.logs.filter((x) => x.at.startsWith(today));
    return { ok: true, mode: 'browser', dbPath: '浏览器 localStorage · ' + KEY, bytes: JSON.stringify(db).length,
      counts: { memories: db.memories.length, events: db.events.length, versions: db.versions.length, stages: db.stages.length, decisions: db.decisions.length, wanders: db.wanders.length },
      words, events: clone(db.events), versions: clone(db.versions), stages: clone(db.stages), decisions: clone(db.decisions), wanders: clone(db.wanders), logs: clone(db.logs.slice().reverse()),
      capture: { enabled: true, stat: { wrote: todayLogs.reduce((n, x) => n + (x.written || 0), 0), runs: todayLogs.filter((x) => x.level === 'ok').length, failed: todayLogs.filter((x) => x.level === 'fail').length }, library: { total: db.memories.length, today: db.memories.filter((m) => m.at.startsWith(today)).length } } };
  }
  async function wanderNow() {
    const now = new Date(), day = localTime().slice(0, 10), last = db.memories.slice().sort((a, b) => b.at.localeCompare(a.at))[0], lastW = db.wanders.slice().sort((a, b) => b.at.localeCompare(a.at))[0];
    const parse = (s) => new Date(String(s || '').replace(' ', 'T')).getTime();
    const state = { minutesOfDay: now.getHours() * 60 + now.getMinutes(), sinceSpeakSec: last ? Math.max(0, Math.floor((now - parse(last.at)) / 1000)) : 86400, todayCount: db.memories.filter((m) => m.at.startsWith(day)).length, sinceWanderMin: lastW ? Math.max(0, Math.floor((now - parse(lastW.at)) / 60000)) : 1440, weekday: now.getDay() };
    const value = ((state.minutesOfDay * 1000003) % 541 + (state.sinceSpeakSec * 10007) % 541 + (state.todayCount * 101) % 541 + (state.sinceWanderMin * 7) % 541 + state.weekday) % 541;
    return { ok: true, state, divisor: 541, value, hit: value === 0, remain: value ? 541 - value : 0, note: '保留上游 541 拍算法；主动打开时计算，不伪装后台心跳。' };
  }
  L.mindsea = {
    search: async (args) => searchMemories(args), event: async (args) => readEvent(args), write: async (args) => writeMemories(args),
    update: async (args) => { const m = db.memories.find((x) => x.id === Number(args?.id)); if (!m) return { ok: false, error: '记忆不存在' }; if (args.category !== undefined) { if (args.category && !CATS.includes(args.category)) return { ok: false, error: '门类不正确' }; m.category = args.category || ''; } if (args.place !== undefined) { if (!['event', 'chat', 'trash'].includes(args.place)) return { ok: false, error: '去处不正确' }; m.place = args.place; } save(); return { ok: true, id: m.id }; },
    tail: async () => db.memories.slice().sort((a, b) => b.at.localeCompare(a.at) || b.id - a.id).slice(0, 10).reverse().map((m) => '· ' + m.at.slice(5, 16) + ' ' + (m.speaker ? '我' : '用户') + '：' + m.text.replace(/\s+/g, ' ').slice(0, 120)).join('\n'),
    capture: captureTurn, overview: async () => overview(),
    docs: async () => DOCS.map((d) => ({ key: d.key, title: d.title, path: KEY + '#docs.' + d.key, text: db.docs[d.key] || d.text })),
    writeDoc: async (args) => { if (!DOCS.some((d) => d.key === args?.key)) throw new Error('未知文档'); db.docs[args.key] = String(args.text || '').slice(0, 1024 * 1024); save(); return { ok: true }; },
    wanderNow,
    recordWander: async (args) => { const item = { id: Date.now().toString(36), at: localTime(), start_tag: args?.startTag || '手动联想', path: JSON.stringify(args?.path || []), spoke: 0 }; db.wanders.push(item); save(); return { ok: true, item }; },
    exportData: async () => ({ app: 'LifeOS-MindSea', schema: 1, exportedAt: new Date().toISOString(), data: clone({ memories: db.memories, events: db.events, versions: db.versions, stages: db.stages, decisions: db.decisions, wanders: db.wanders }) }),
    importData: async (payload) => { if (!Array.isArray(payload?.data?.memories)) throw new Error('备份中没有 memories'); const es = payload.data.events || [], vs = payload.data.versions || [], ss = payload.data.stages || []; return writeMemories({ items: payload.data.memories.map((m) => ({ text: m.text, at: m.at, speaker: m.speaker, ev: es.find((e) => e.id === m.event_id)?.name || '', nd: vs.find((v) => v.id === m.version_id)?.name || '', st: ss.find((s) => s.id === m.stage_id)?.name || '', s: m.s, emo: emoNames(m.emotion), dec: m.dec, decobj: m.dec ? '导入决定' : '', place: m.place, category: m.category })) }); },
    _resetForTest: () => { db = blank(); save(); }
  };
})(window.LifeOS);


/* ===== js/modules/daily.js ===== */
/* =========================================================================
 * LifeOS · Daily Notes 每日笔记（W2 · B2）
 *
 * 设计：不新增顶层实体（不动 ENTITY_KEYS / 备份链 / 12 个导航视图）。
 * 「每天的日记」就是一篇标题为 YYYY-MM-DD、带 daily 标记的普通笔记，
 * 于是导出、快照、导入、双链、检索全部自动复用既有链路。
 *
 * 视图聚合：当日日程(events) + 当日活动(stats.activity) + 当天创建/编辑的笔记
 *          + 当天任务/习惯打卡，与日历 dayDetail 口径一致。
 * 入口：日历某天「查看当日日记」、笔记列表工具栏「每日笔记」。
 * ========================================================================= */
window.LifeOS = window.LifeOS || {};
LifeOS.modules = LifeOS.modules || {};

(function (L) {
  'use strict';
  const U = L.utils;
  const S = L.store;

  const TAG = 'daily';
  const local = { date: null };

  function isDaily(n) {
    return !!n && (n.daily === true || (Array.isArray(n.tags) && n.tags.indexOf(TAG) >= 0));
  }
  function dailyFor(date) {
    return (S.state.notes || []).find((n) => isDaily(n) && n.title === date) || null;
  }

  /* 取某天的聚合数据（纯读取） */
  function dayData(date) {
    const st = S.state;
    const map = (L.stats && L.stats.activity) ? L.stats.activity() : {};
    const acts = ((map[date] && map[date].items) || []).filter((it) => it.type !== 'event');
    const events = (st.events || []).filter((e) => e && e.date === date)
      .sort((a, b) => String(a.time || '').localeCompare(String(b.time || '')));
    const notes = (st.notes || []).filter((n) => U.dateKey(n.createdAt) === date);
    const tasks = (st.tasks || []).filter((t) => t.due === date || U.dateKey(t.createdAt) === date);
    const habits = (st.habits || []).filter((h) => (h.checkins || {})[date]);
    return { date: date, acts: acts, events: events, notes: notes, tasks: tasks, habits: habits, daily: dailyFor(date) };
  }

  /* 创建/打开某天的日记笔记；已存在则直接打开编辑器 */
  function ensureDaily(date) {
    let n = dailyFor(date);
    if (!n) {
      const body = '# ' + date + ' · ' + U.cnDate(date) + '\n\n## 今日安排\n\n## 记录\n\n';
      n = S.addNote({ title: date, body: body, tags: [TAG], daily: true });
    }
    return n;
  }

  function open(date) {
    local.date = date || U.todayStr();
    const n = ensureDaily(local.date);
    // 复用笔记编辑器：设置 notes 模块的当前笔记并打开编辑器
    if (L.modules.notes && L.modules.notes.open) L.modules.notes.open(n.id);
    return n;
  }

  /* 外部（日历）入口：切到笔记列表并高亮该天 */
  function go(date) {
    local.date = date || U.todayStr();
    L.app.showView('notes');
    if (L.modules.notes && L.modules.notes.showDaily) L.modules.notes.showDaily(local.date);
  }

  function renderPanel(date) {
    const d = dayData(date);
    const cn = U.cnDate(date) || date;
    const evHTML = d.events.length
      ? d.events.map((e) =>
        '<div class="dl-row"><span class="dl-ic">◷</span><span class="dl-t">' + U.escapeHtml(e.time || '全天') + ' · ' + U.escapeHtml(e.title || '') + '</span></div>').join('')
      : '<div class="dl-empty">这一天没有日程</div>';
    const actHTML = d.acts.length
      ? d.acts.slice(0, 12).map((it) =>
        '<div class="dl-row"><span class="dl-ic">' + U.escapeHtml(it.icon || '•') + '</span><span class="dl-t">' + U.escapeHtml(it.label || '') + '</span></div>').join('')
      : '<div class="dl-empty">这一天还没有活动记录</div>';
    const noteHTML = d.notes.length
      ? d.notes.map((n) =>
        '<button class="dl-note" data-daily-note="' + U.escapeHtml(n.id) + '">✎ ' + U.escapeHtml(n.title || '无标题') + '</button>').join('')
      : '<div class="dl-empty">这一天没有新建笔记</div>';

    return '' +
      '<div class="page daily-page">' +
      '  <div class="toolbar">' +
      '    <button class="btn ghost" id="dl-back">← 返回笔记</button>' +
      '    <input class="input" id="dl-date" type="date" lang="zh-CN" value="' + U.escapeHtml(date) + '"/>' +
      '    <span class="form-hint date-cn" id="dl-date-cn"></span>' +
      '    <div class="spacer"></div>' +
      '    <button class="btn primary" id="dl-open">' + (d.daily ? '打开当日日记' : '创建当日日记') + '</button>' +
      '  </div>' +
      '  <div class="dl-head"><h2>' + U.escapeHtml(cn) + '</h2>' +
      '    <span class="hint">按日聚合日程、活动与笔记 · 日记本身是一篇普通笔记，随备份一起导出</span></div>' +
      '  <div class="dl-grid">' +
      '    <div class="dl-col"><div class="dl-col-h">日程 · ' + d.events.length + '</div>' + evHTML + '</div>' +
      '    <div class="dl-col"><div class="dl-col-h">当日活动 · ' + d.acts.length + '</div>' + actHTML + '</div>' +
      '    <div class="dl-col"><div class="dl-col-h">当天笔记 · ' + d.notes.length + '</div>' + noteHTML + '</div>' +
      '  </div>' +
      '  <div class="dl-summary">任务 ' + d.tasks.length + ' · 打卡 ' + d.habits.length +
      ' · 日记 ' + (d.daily ? '已创建' : '未创建') + '</div>' +
      '</div>';
  }

  function bindPanel(root, date) {
    const dateEl = root.querySelector('#dl-date');
    const cnEl = root.querySelector('#dl-date-cn');
    const sync = () => { const c = U.cnDate(dateEl.value); cnEl.textContent = c ? '当前选择：' + c : ''; };
    dateEl.addEventListener('input', () => { sync(); local.date = dateEl.value; L.app.refresh(); });
    dateEl.addEventListener('change', () => { sync(); local.date = dateEl.value; L.app.refresh(); });
    sync();
    root.querySelector('#dl-back').addEventListener('click', () => {
      if (L.modules.notes && L.modules.notes.showList) L.modules.notes.showList();
      L.app.refresh();
    });
    root.querySelector('#dl-open').addEventListener('click', () => open(local.date || date));
    root.querySelectorAll('[data-daily-note]').forEach((b) => {
      b.addEventListener('click', () => {
        if (L.modules.notes && L.modules.notes.open) L.modules.notes.open(b.getAttribute('data-daily-note'));
      });
    });
  }

  L.modules.daily = {
    TAG: TAG,
    isDaily: isDaily,
    dailyFor: dailyFor,
    dayData: dayData,
    ensureDaily: ensureDaily,
    open: open,
    go: go,
    renderPanel: renderPanel,
    bindPanel: bindPanel,
    getDate: () => local.date || U.todayStr(),
    setDate: (d) => { local.date = d; }
  };
})(window.LifeOS);


/* ===== js/modules/tasks.js ===== */
/* =========================================================================
 * LifeOS · 任务待办模块
 * ========================================================================= */
window.LifeOS = window.LifeOS || {};
LifeOS.modules = LifeOS.modules || {};

(function (L) {
  'use strict';
  const U = L.utils;
  const S = L.store;

  const PRIORITY = {
    high: { label: '高', cls: 'p-high' },
    medium: { label: '中', cls: 'p-medium' },
    low: { label: '低', cls: 'p-low' }
  };
  const STATUS = {
    todo: '待办',
    doing: '进行中',
    done: '已完成'
  };

  const local = { filter: 'all', search: '' };

  function tagsStr(tags) {
    return (tags || []).map((t) => '<span class="tag">#' + U.escapeHtml(t) + '</span>').join('');
  }

  function taskCard(t) {
    const p = PRIORITY[t.priority] || PRIORITY.medium;
    const overdue = t.due && t.status !== 'done' && t.due < U.todayStr();
    return '' +
      '<div class="task-card ' + (t.status === 'done' ? 'is-done' : '') + '" data-id="' + t.id + '">' +
      '  <button class="task-check ' + (t.status === 'done' ? 'checked' : '') + '" data-act="toggle" title="切换完成">' +
      (t.status === 'done' ? '✓' : '') + '</button>' +
      '  <div class="task-main">' +
      '    <div class="task-title">' + U.escapeHtml(t.title) + '</div>' +
      '    <div class="task-meta">' +
      '      <span class="badge ' + p.cls + '">' + p.label + '</span>' +
      (t.due ? '<span class="due' + (overdue ? ' overdue' : '') + '">▦ ' + U.fmtDate(t.due) + (overdue ? ' 逾期' : '') + '</span>' : '') +
      tagsStr(t.tags) +
      '    </div>' +
      '  </div>' +
      '  <div class="task-actions">' +
      '    <select class="mini-select" data-act="status">' +
      Object.keys(STATUS).map((k) => '<option value="' + k + '"' + (t.status === k ? ' selected' : '') + '>' + STATUS[k] + '</option>').join('') +
      '    </select>' +
      '    <button class="icon-btn" data-act="edit" title="编辑">✎</button>' +
      '    <button class="icon-btn danger" data-act="del" title="删除">×</button>' +
      '  </div>' +
      '</div>';
  }

  function render() {
    const tasks = S.state.tasks;
    const visible = tasks.filter((t) => {
      if (local.filter !== 'all' && t.status !== local.filter) return false;
      if (local.search) {
        const q = local.search.toLowerCase();
        const hay = (t.title + ' ' + (t.note || '') + ' ' + (t.tags || []).join(' ')).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
    const todos = visible.filter((t) => t.status !== 'done');
    const dones = visible.filter((t) => t.status === 'done');

    const counts = {
      all: tasks.length,
      todo: tasks.filter((t) => t.status === 'todo').length,
      doing: tasks.filter((t) => t.status === 'doing').length,
      done: tasks.filter((t) => t.status === 'done').length
    };

    return '' +
      '<div class="page">' +
      '  <div class="toolbar">' +
      '    <div class="filters">' +
      ['all', 'todo', 'doing', 'done'].map((f) =>
        '<button class="chip' + (local.filter === f ? ' active' : '') + '" data-filter="' + f + '">' +
        (f === 'all' ? '全部' : STATUS[f]) + ' <span class="count">' + counts[f] + '</span></button>'
      ).join('') +
      '    </div>' +
      '    <div class="spacer"></div>' +
      '    <input class="search" id="task-search" placeholder="搜索任务…" value="' + U.escapeHtml(local.search) + '"/>' +
      '    <button class="btn primary" id="add-task">+ 新建任务</button>' +
      '  </div>' +
      '  <div class="task-list">' +
      (todos.length ? '<div class="section-label">进行中 · ' + todos.length + '</div>' + todos.map(taskCard).join('') : '') +
      (dones.length ? '<div class="section-label">已完成 · ' + dones.length + '</div>' + dones.map(taskCard).join('') : '') +
      (visible.length === 0 ? '<div class="empty">还没有任务，先记下第一件要做的事吧。<button class="empty-state-btn" id="empty-new-task">＋ 新建任务</button></div>' : '') +
      '  </div>' +
      '</div>';
  }

  function openEditor(task) {
    const isNew = !task;
    const t = task || { title: '', note: '', priority: 'medium', status: 'todo', due: '', tags: [] };
    U.modal({
      title: isNew ? '新建任务' : '编辑任务',
      bodyHTML: '' +
        '<div class="form">' +
        '  <label>标题</label><input id="f-title" class="input" value="' + U.escapeHtml(t.title) + '" placeholder="要做什么？"/>' +
        '  <div class="form-row">' +
        '    <div><label>优先级</label><select id="f-priority" class="input">' +
        Object.keys(PRIORITY).map((k) => '<option value="' + k + '"' + (t.priority === k ? ' selected' : '') + '>' + PRIORITY[k].label + '优先级</option>').join('') +
        '    </select></div>' +
        '    <div><label>状态</label><select id="f-status" class="input">' +
        Object.keys(STATUS).map((k) => '<option value="' + k + '"' + (t.status === k ? ' selected' : '') + '>' + STATUS[k] + '</option>').join('') +
        '    </select></div>' +
        '    <div><label>截止日期</label><input id="f-due" class="input" type="date" lang="zh-CN" value="' + U.escapeHtml(t.due || '') + '"/><span class="form-hint">格式：年-月-日</span><span class="form-hint date-cn" id="f-due-cn"></span></div>' +
        '  </div>' +
        '  <label>标签（逗号分隔）</label><input id="f-tags" class="input" value="' + U.escapeHtml((t.tags || []).join(', ')) + '" placeholder="工作, 重要"/>' +
        '  <label>备注</label><textarea id="f-note" class="input" rows="3" placeholder="补充说明…">' + U.escapeHtml(t.note || '') + '</textarea>' +
        '  <div class="modal-actions"><button class="btn ghost" data-act="cancel">取消</button>' +
        '    <button class="btn primary" data-act="save">保存</button></div>' +
        '</div>',
      onMount(root, close) {
        const dueEl = root.querySelector('#f-due');
        const cnEl = root.querySelector('#f-due-cn');
        const syncCN = () => { const cn = U.cnDate(dueEl.value); cnEl.textContent = cn ? '当前选择：' + cn : ''; };
        dueEl.addEventListener('input', syncCN);
        dueEl.addEventListener('change', syncCN);
        syncCN();
        root.querySelector('[data-act="save"]').addEventListener('click', () => {
          const title = root.querySelector('#f-title').value.trim();
          if (!title) { U.toast('请填写标题', 'error'); return; }
          const tags = root.querySelector('#f-tags').value.split(',').map((s) => s.trim()).filter(Boolean);
          const patch = {
            title,
            priority: root.querySelector('#f-priority').value,
            status: root.querySelector('#f-status').value,
            due: root.querySelector('#f-due').value || null,
            tags,
            note: root.querySelector('#f-note').value
          };
          if (isNew) S.addTask(patch); else S.updateTask(t.id, patch);
          U.toast(isNew ? '已创建任务' : '已保存');
          close();
          L.app.refresh();
        });
        root.querySelector('[data-act="cancel"]').addEventListener('click', close);
      }
    });
  }

  function bind(root) {
    root.querySelectorAll('[data-filter]').forEach((b) => {
      b.addEventListener('click', () => { local.filter = b.getAttribute('data-filter'); L.app.refresh(); });
    });
    const search = root.querySelector('#task-search');
    if (search) search.addEventListener('input', U.debounce(() => { local.search = search.value; L.app.refresh(); }, 250));

    root.querySelector('#add-task').addEventListener('click', () => openEditor(null));
    const emptyNew = root.querySelector('#empty-new-task');
