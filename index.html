  box-shadow: 0 2px 8px var(--glow);
}
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 86%, var(--text)); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.ghost:hover { background: var(--hover); }
.btn.danger { color: var(--down); border-color: color-mix(in srgb, var(--down) 40%, var(--border)); }
.btn.danger:hover { background: color-mix(in srgb, var(--down) 12%, transparent); }
.btn:disabled, .btn[disabled] { opacity: .5; cursor: not-allowed; pointer-events: none; }
.btn-xs { min-height: 30px; padding: 4px 10px; font-size: var(--fs-1); }
.btn-row { gap: 8px; }
.badge, .chip, .tag, .mode-badge {
  border-radius: 999px; font-size: var(--fs-1); font-weight: 600;
  padding: 3px 9px;
  background: var(--panel2); border: 1px solid var(--border); color: var(--ink-2);
}
.chip:hover, .kb-tab:hover { border-color: var(--accent); color: var(--accent); }
.stat-card, .task-card, .habit-card, .note-card, .kb-card, .link-panel,
.hm-panel, .cal-side, .ms-word, .ms-doc, .snap-item, .kb-notice, .data-note {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: var(--shadow-sm);
}
.stat-card, .kb-card, .note-card, .habit-card { padding: 18px 20px; }
.stat-grid, .kb-grid, .note-grid, .habit-grid, .dash-cols { gap: 14px; }
.stat-num, .sc-num, .hs-num, .stat-label, .kb-stat b, .ms-stats b, .cx2-sub, .ms-word-meta, .cx2-step-dur {
  font-variant-numeric: tabular-nums;
}
.stat-num { font-size: var(--fs-7); font-weight: 750; letter-spacing: -.02em; color: var(--text); }
.stat-label { font-size: var(--fs-1); color: var(--muted); font-weight: 500; }
.sc-icon, .ci-icon {
  width: 32px; height: 32px; border-radius: 10px;
  background: var(--accent-soft); color: var(--accent);
  display: inline-flex; align-items: center; justify-content: center;
}
.task-card { padding: 14px 16px; }
.task-card:hover, .note-card:hover, .kb-card:hover { border-color: var(--border-strong); }
.task-check.checked { background: var(--up); border-color: var(--up); }
.p-high { background: color-mix(in srgb, var(--down) 14%, transparent); color: var(--down); }
.p-medium { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.p-low { background: color-mix(in srgb, var(--accent2) 16%, transparent); color: var(--accent2); }
.due.overdue { color: var(--down); }
.empty, .ms-empty, .dash-empty, .link-empty, .cal-empty, .ai-empty {
  color: var(--muted); font-size: var(--fs-2);
  padding: 28px 20px; text-align: center;
  border: 1px dashed var(--border); border-radius: var(--r);
  background: var(--panel2);
}
.hint, .page-sub, .li-hint, .hm-hint, .graph-tip { color: var(--muted); font-size: var(--fs-2); }
.section-label, .settings-h { color: var(--text); font-weight: 700; letter-spacing: -.01em; }
.markdown-body { color: var(--ink-2); }
.markdown-body code, .cx2-out, .cx2-diff pre, .cx2-filetext { font-family: var(--font-mono); }
.modal-overlay { background: color-mix(in srgb, var(--bg) 72%, transparent); }
.modal {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
}
.toast {
  background: var(--panel); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--r-sm);
  box-shadow: var(--shadow-lg);
}
.toast-error { border-color: var(--down); color: var(--down); }
.kb-tab, .ms-tabs button, .cx2-seg button {
  border-radius: var(--r-sm); border: 1px solid transparent;
  background: transparent; color: var(--muted); font-weight: 600; font-size: var(--fs-2);
  padding: 7px 13px; min-height: 36px; cursor: pointer;
}
.kb-tab.on, .ms-tabs button.on, .cx2-seg button.on {
  background: var(--accent-soft); color: var(--accent); border-color: var(--border);
}
.form-row, .ms-form-grid { gap: 12px; }
.editor-area, .cx2-filetext, .cx2-out, .cx2-diff pre, .ms-original {
  background: var(--panel2); border: 1px solid var(--border);
  border-radius: var(--r-sm); color: var(--ink-2);
}

/* 顺序色阶：单一色相 5 档，不引入彩虹 */
.lg0, .hy-cell.lv0 { background: var(--heat-0); }
.lg1, .hy-cell.lv1 { background: var(--heat-1); }
.lg2, .hy-cell.lv2 { background: var(--heat-2); }
.lg3, .hy-cell.lv3 { background: var(--heat-3); }
.lg4, .hy-cell.lv4 { background: var(--heat-4); }
.hm-cell, .hy-cell { border-color: var(--border); }
.d-task, .d-done { background: var(--accent); }
.d-due { background: var(--down); }
.d-note, .d-edit { background: var(--brand-2); }
.d-ai { background: var(--warn); }
.c-red .sc-num { color: var(--down); }
.c-green .sc-num { color: var(--up); }
.c-orange .sc-num { color: var(--warn); }
.c-purple .sc-num { color: var(--brand-2); }
.c-blue .sc-num { color: var(--accent); }

/* 识海：去掉满屏 eyebrow，统计瓦片按 KPI 结构 */
.ms-eyebrow { display: none; }
.ms-head h2 { font-size: var(--fs-7); margin: 0; }
.ms-head p { color: var(--muted); font-size: var(--fs-2); }
.ms-stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.ms-stats > div {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--r); box-shadow: var(--shadow-sm);
  padding: 14px 16px; display: flex; flex-direction: column; gap: 2px;
}
.ms-stats b { font-size: var(--fs-6); font-weight: 750; letter-spacing: -.02em; }
.ms-stats span { font-size: var(--fs-1); color: var(--muted); }
.ms-word { padding: 14px 16px; margin-bottom: 10px; }
.ms-original { font-family: var(--font-mono); font-size: var(--fs-2); padding: 10px 12px; }
.ms-word-meta, .ms-word-path { color: var(--muted); font-size: var(--fs-1); }
.ms-db { color: var(--muted); font-size: var(--fs-1); font-family: var(--font-mono); }
.ms-decision { color: var(--needs); border-color: color-mix(in srgb, var(--needs) 35%, var(--border)); }
.ms-result-head { font-weight: 650; color: var(--ink-2); }
.ms-graph-core text { fill: var(--on-accent); }

/* ============ 5. Codex：AI 工作台可信赖层 ============ */
.cx2 { background: var(--bg); color: var(--text); }
.cx2-rail {
  width: 268px; background: var(--rail);
  border-right: 1px solid var(--rail-border); color: var(--rail-ink);
  padding: 18px 12px 12px;
}
.cx2-rail-head { padding: 2px 8px 16px; }
.cx2-logo {
  width: 26px; height: 26px; border-radius: 8px;
  background: var(--accent); color: var(--on-accent);
  display: inline-flex; align-items: center; justify-content: center;
}
.cx2-brand { font-weight: 700; color: var(--rail-ink-active); letter-spacing: -.02em; }
.cx2-iconbtn, .cx2-mini, .cx2-ghost {
  background: var(--rail-2); border: 1px solid var(--rail-border);
  color: var(--rail-ink); border-radius: var(--r-sm); min-height: 34px;
}
.cx2-iconbtn:hover, .cx2-mini:hover { color: var(--rail-ink-active); }
.cx2-new {
  width: 100%; min-height: 42px; border-radius: var(--r-sm);
  background: var(--accent); color: var(--on-accent);
  border: 1px solid var(--accent); font-weight: 650; font-size: var(--fs-2);
  box-shadow: 0 2px 8px var(--glow);
}
.cx2-new:hover { background: color-mix(in srgb, var(--accent) 86%, var(--text)); }
.cx2-tasklist { overflow-y: auto; min-height: 0; }
.cx2-group {
  font-size: var(--fs-1); font-weight: 600; letter-spacing: .06em;
  color: var(--rail-ink); opacity: .68; padding: 14px 10px 6px;
}
.cx2-task {
  border-radius: var(--r-sm); padding: 9px 10px;
  color: var(--rail-ink); font-size: var(--fs-2);
  border: 1px solid transparent; min-height: 40px;
  display: flex; align-items: center; gap: 8px;
}
.cx2-task:hover { background: var(--rail-2); }
.cx2-task.on {
  background: color-mix(in srgb, var(--rail-active) 15%, var(--rail-2));
  color: var(--rail-ink-active); border-color: var(--rail-border);
  box-shadow: inset 2px 0 0 var(--rail-active);
}
.cx2-task-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.cx2-live {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--needs); flex: 0 0 7px;
  animation: finesse-pulse 1.6s ease-in-out infinite;
}
.cx2-task-del { color: var(--rail-ink); opacity: .55; }
.cx2-task-del:hover { color: var(--down); opacity: 1; }
.cx2-rail-foot { border-top: 1px solid var(--rail-border); padding-top: 12px; }
.cx2-ws { background: var(--rail-2); border: 1px solid var(--rail-border); border-radius: var(--r-sm); color: var(--rail-ink); }
.cx2-ws-path, .cx2-rail-note { font-family: var(--font-mono); font-size: var(--fs-1); }
.cx2-rail-note { color: var(--rail-ink); opacity: .8; }

.cx2-main { background: var(--bg); }
.cx2-head {
  height: var(--nav-h); padding: 0 24px;
  background: var(--bg); border-bottom: 1px solid var(--border);
}
.cx2-title { font-size: var(--fs-5); font-weight: 700; letter-spacing: -.02em; }
.cx2-sub { color: var(--muted); font-size: var(--fs-1); font-variant-numeric: tabular-nums; }
.cx2-ghost { min-height: 34px; padding: 6px 12px; }
.cx2-ghost.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

.cx2-thread { max-width: 820px; }
.cx2-hero-mark { display: none; }
.cx2-hero-title { font-size: var(--fs-7); letter-spacing: -.02em; }
.cx2-hero-sub { color: var(--muted); font-size: var(--fs-2); max-width: 520px; }
.cx2-chips { gap: 10px; }
.cx2-chip {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--r-sm); box-shadow: var(--shadow-sm);
  color: var(--ink-2); font-size: var(--fs-2); text-align: left;
  padding: 12px 14px; min-height: 56px;
  display: flex; align-items: center; gap: 10px;
}
.cx2-chip:hover { border-color: var(--accent); color: var(--accent); }
.cx2-chip-ic { font-size: var(--fs-5); opacity: .8; }
.cx2-hero-note { color: var(--muted); font-size: var(--fs-1); }

.cx2-user .cx2-bubble {
  background: var(--accent-soft); border: 1px solid var(--border);
  color: var(--text); border-radius: var(--r);
  border-bottom-right-radius: 5px;
}
.cx2-mark { color: var(--accent); }
.cx2-md { color: var(--ink-2); }
.cx2-error .cx2-md { color: var(--down); }

/* 运行流：一列步骤 + 贯穿的细线 + 每步耗时 */
.cx2-step {
  position: relative; margin: 0 0 8px;
  border: 1px solid var(--border); border-radius: var(--r-sm);
  background: var(--panel); box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.cx2-step::before {
  content: ''; position: absolute; left: 19px; top: 0; bottom: 0;
  width: 1px; background: var(--border);
}
.cx2-step > summary {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; cursor: pointer; list-style: none;
  min-height: 40px;
}
.cx2-step > summary::-webkit-details-marker { display: none; }
.cx2-step-icon {
  width: 20px; height: 20px; flex: 0 0 20px;
  border-radius: 6px; background: var(--panel2);
  border: 1px solid var(--border); color: var(--auto);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: var(--fs-1); position: relative; z-index: 1;
}
.cx2-step-write .cx2-step-icon { color: var(--needs); background: color-mix(in srgb, var(--needs) 12%, var(--panel)); }
.cx2-step-read .cx2-step-icon, .cx2-step-list .cx2-step-icon { color: var(--accent); }
.cx2-step-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-2); font-weight: 600; color: var(--ink-2); }
.cx2-step-dur { font-size: var(--fs-1); color: var(--muted); font-family: var(--font-mono); }
.cx2-step-chev { color: var(--muted); transition: transform .16s var(--ease); }
.cx2-step[open] .cx2-step-chev { transform: rotate(90deg); }
.cx2-step .cx2-out, .cx2-step .cx2-diff { margin: 0 10px 10px 42px; font-size: var(--fs-1); }
.cx2-diff-head { background: var(--panel2); }
.cx2-diff .d-add { color: var(--up); background: color-mix(in srgb, var(--up) 8%, transparent); }
.cx2-diff-head .d-count { color: var(--up); }

/* 回执行：不编造 token 与金额，演示模式如实标注 */
.cx2-receipt {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  margin: 12px 0 4px; padding: 9px 13px;
  border: 1px solid var(--border); border-radius: var(--r-sm);
  background: var(--panel2); color: var(--muted);
  font-family: var(--font-mono); font-size: var(--fs-1);
}
.cx2-receipt b { color: var(--ink-2); font-weight: 650; }
.cx2-receipt .cx2-receipt-mode { margin-left: auto; color: var(--auto); }

.cx2-working-row { color: var(--muted); font-size: var(--fs-2); }
.cx2-working-text { color: var(--ink-2); }
.cx2-working .cx2-dot { background: var(--needs); animation: finesse-pulse 1.6s ease-in-out infinite; }
.cx2-step[data-failed="1"] { border-color: color-mix(in srgb, var(--down) 45%, var(--border)); }

.cx2-composer-wrap { padding: 12px 20px 14px; background: var(--bg); border-top: 1px solid var(--border); }
.cx2-composer {
  max-width: 820px; margin: 0 auto;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--r); box-shadow: var(--shadow-sm);
  padding: 10px 12px;
}
.cx2-composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#cx2-input { background: transparent; border: none; box-shadow: none; color: var(--text); resize: none; width: 100%; }
#cx2-input:focus { outline: none; box-shadow: none; }
.cx2-bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.cx2-seg { display: flex; gap: 2px; background: var(--panel2); padding: 3px; border-radius: var(--r-sm); }
.cx2-model { font-size: var(--fs-1); color: var(--muted); font-family: var(--font-mono); margin-left: auto; }
.cx2-send {
  width: 36px; height: 36px; border-radius: var(--r-sm);
  background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent);
  font-size: var(--fs-4); font-weight: 700;
}
.cx2-stop {
  min-height: 36px; padding: 6px 12px; border-radius: var(--r-sm);
  background: transparent; color: var(--needs);
  border: 1px solid color-mix(in srgb, var(--needs) 45%, var(--border));
  font-size: var(--fs-1); font-weight: 650; cursor: pointer;
}
.cx2-stop:disabled { opacity: .45; cursor: not-allowed; }
.cx2-stop:not(:disabled):hover { background: color-mix(in srgb, var(--needs) 12%, transparent); }
.cx2-foot-hint { max-width: 820px; margin: 7px auto 0; color: var(--muted); font-size: var(--fs-1); }

.cx2-files { background: var(--panel); border-left: 1px solid var(--border); }
.cx2-files-head { border-bottom: 1px solid var(--border); color: var(--ink-2); font-weight: 650; }
.cx2-tree, .cx2-viewer { color: var(--ink-2); }
.cx2-node, .cx2-leaf { border-radius: 8px; }
.cx2-node:hover, .cx2-leaf:hover { background: var(--accent-soft); color: var(--accent); }
.cx2-filetext { color: var(--ink-2); }
.cx2-viewer-head { border-bottom: 1px solid var(--border); }
.cx2-viewer-out.err { color: var(--down); }

/* 右栏 resting state：能看见什么、能动什么、怎么算的 */
.cx2-context { padding: 14px; color: var(--muted); font-size: var(--fs-2); }
.cx2-context h4 { color: var(--text); font-size: var(--fs-2); margin: 0 0 6px; }
.cx2-context .cx2-ctx-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.cx2-context .cx2-ctx-row b { color: var(--ink-2); font-weight: 600; font-family: var(--font-mono); }
.cx2-context p { margin: 0 0 10px; line-height: 1.6; }
.cx2-evidence {
  display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 8px;
  margin: 0 10px 10px 42px; padding: 8px 10px;
  background: var(--panel2); border: 1px solid var(--border);
  border-radius: var(--r-sm); font-size: var(--fs-1);
}
.cx2-evidence span { color: var(--muted); }
.cx2-evidence code { font-family: var(--font-mono); color: var(--ink-2); overflow-wrap: anywhere; }
.cx2-group-label { letter-spacing: .04em; }
.cx2-hint { color: var(--muted); font-size: var(--fs-1); padding: 8px 10px; }

@keyframes finesse-pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

/* ============ 6. 动效：只做反馈，且尊重 reduced-motion ============ */
@media (prefers-reduced-motion: no-preference) {
  .view > .page, .ms-page, .kb-page, .cx2-thread > * {
    animation: finesse-in .28s var(--ease) both;
  }
  @keyframes finesse-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
  .cx2-live, .cx2-working .cx2-dot { opacity: .8; }
}

/* ============ 7. 移动端地板 M1–M6 ============ */
@media (max-width: 900px) {
  .sidebar { width: 60px; flex: 0 0 60px; padding: 16px 8px; }
  .brand { justify-content: center; padding: 4px 0 18px; }
  .brand .logo { margin: 0; }
  .brand .brand-text { display: none; }
  .nav-item { justify-content: center; padding: 10px; min-height: 44px; }
  .nav-item .nav-text, .nav-group, .sidebar-foot { display: none; }
  .topbar { padding: 0 16px; }
  .view { padding: 16px 14px 32px; }
  .stat-grid, .kb-grid, .note-grid, .habit-grid, .dash-cols, .ms-stats { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .cx2-rail { display: none; }
  .cx2-files { position: absolute; right: 0; top: var(--nav-h); bottom: 0; z-index: var(--z-sticky); width: min(330px, 86vw); box-shadow: var(--shadow-lg); }
  .cx2-body { position: relative; }
}
@media (max-width: 520px) {
  .stat-grid, .kb-grid, .note-grid, .habit-grid, .dash-cols, .ms-stats { grid-template-columns: 1fr !important; }
  .cx2-thread, .cx2-composer, .cx2-foot-hint { max-width: none; }
  .cx2-bar { flex-wrap: wrap; }
}

/* 总览跳转具体任务时的短暂定位高亮 */
.task-card.task-focus {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  background: var(--accent-soft);
  transition: outline-color .2s ease, background .3s ease;
}

/* ==========================================================================
 * 第二轮 · 真实用户体验修复（诚实化 / 窄屏导航 / 可读性 / 空态统一）
 * ========================================================================== */

/* 深色主题：提高次要文字与分组标签对比度，卡片边框略加强 */
[data-theme="dark"] {
  --muted: #a9bcb8;
  --rail-ink: #adc0bc;
  --border: rgba(255, 255, 255, .10);
  --border-strong: rgba(255, 255, 255, .18);
}
[data-theme="dark"] .nav-group { opacity: .85; }
.stat-card .sc-num { color: var(--text); }   /* 0 值不再用高亮橙抢视觉权重 */

/* 底部 badge 统一为深色轨样式，消除深色主题里那块突兀的白 */
.ai-status, .mode-badge {
  background: var(--rail-2); border: 1px solid var(--rail-border);
  color: var(--rail-ink); border-radius: 8px;
}

/* 常驻演示标识 */
.demo-pill {
  font-size: var(--fs-1); font-weight: 650; letter-spacing: .01em;
  /* 与 transparent 混合会在深色下变成暗底暗字，改用实体面板色做基底 */
  color: var(--text); background: color-mix(in srgb, var(--warn) 18%, var(--panel));
  border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--panel));
  border-radius: 999px; padding: 4px 12px; white-space: nowrap;
}
.topbar-actions { gap: 10px; }

/* 窄屏导航：菜单按钮 + 抽屉 + 遮罩 */
.nav-toggle { display: none; }
.nav-scrim { display: none; }
@media (max-width: 900px) {
  .nav-toggle { display: inline-flex; flex: 0 0 auto; margin-right: 4px; }
  .nav-scrim {
    position: fixed; inset: 0; z-index: 65;
    background: rgba(3, 12, 11, .52); backdrop-filter: blur(2px);
  }
  .nav-scrim.show { display: block; }
  .sidebar.open {
    position: fixed; left: 0; top: 0; bottom: 0; z-index: 70;

  .sidebar.open .nav-item .nav-text { display: inline; }
  .sidebar.open .nav-group { display: block; }

@media (max-width: 520px) {
  .topbar { padding: 0 12px; }
  .topbar-title { font-size: var(--fs-4); }
  .kb-toolbar, .toolbar { flex-wrap: wrap; }
  .kb-toolbar .search, .toolbar .search { flex: 1 1 100%; }
}

/* 空态统一：给主要空态足够体量与明确行动入口；小块提示保持轻量 */
.empty, .ai-empty, .ms-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; min-height: 168px; width: 100%; text-align: center; line-height: 1.7;
}
.dash-empty, .link-empty, .cal-empty, .cx2-hint {
  display: block; min-height: 0; padding: 14px 12px;
}
.dash-empty .link-btn, .empty .link-btn {
  color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--panel));
  background: var(--accent-soft); border-radius: 999px; padding: 5px 14px;
  font-weight: 600; display: inline-block; margin-left: 4px;
}
.empty-state-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent); color: var(--on-accent); border: none;
  border-radius: 999px; padding: 8px 18px; font-weight: 650; cursor: pointer;
}

/* 导出备份提醒 / 演示能力边界 / 示例内容提示 */
.backup-tip, .kb-seed-note, .demo-note {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 11px 16px; margin-bottom: 14px;
  border: 1px solid color-mix(in srgb, var(--warn) 30%, var(--panel));
  border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--warn) 9%, var(--panel));
  color: var(--ink-2); font-size: var(--fs-2); line-height: 1.6;
}
.backup-tip .spacer, .kb-seed-note .spacer { flex: 1 1 auto; }
.demo-note {
  border-color: var(--border-strong); background: var(--panel2);
  display: block; margin: 0 0 18px; padding: 14px 18px;
}
.demo-note code { font-family: var(--font-mono); font-size: var(--fs-1); }
.kb-seed-note { border-color: var(--border); background: var(--panel2); }
.kb-seed {
  font-size: 10px; font-weight: 600; color: var(--muted);
  border: 1px solid var(--border-strong); border-radius: 5px;
  padding: 1px 5px; margin-left: 6px; vertical-align: 2px; white-space: nowrap;
}

/* AI 助手：演示状态条醒目化 */
.ai-status-bar.demo {
  background: color-mix(in srgb, var(--warn) 12%, var(--panel));
  border: 1px solid color-mix(in srgb, var(--warn) 30%, var(--panel));
  border-radius: var(--r-sm); color: var(--text); font-weight: 600;
}
.ai-foot-hint { color: var(--muted); font-size: var(--fs-1); text-align: right; padding: 6px 2px 0; }
.toast-error { border-left: 3px solid var(--down); }

/* 识海统计卡：撤销旧样式表遗留的边框与 overflow:hidden（会裁掉新卡片圆角/阴影） */
.ms-stats {
  border: 0 !important; border-radius: 0 !important; overflow: visible !important;
  background: transparent !important;
}
.ms-stats > div { border-right: 0 !important; }

/* 表单：中文日期格式提示 */
.form-hint { color: var(--muted); font-size: var(--fs-1); margin-top: 4px; display: block; }
/* 日期控件的中文实时回显：空值时不占位，有值时用品牌色强调，抵消 mm/dd/yyyy 的歧义 */
.form-hint.date-cn { color: var(--accent); font-weight: 600; margin-top: 2px; }
.form-hint.date-cn:empty { display: none; }

/* 日历日程 */
.cal-event {
  display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: var(--r-sm);
  background: var(--panel2); margin-bottom: 8px;
}
.cal-event .ce-time { font-family: var(--font-mono); font-size: var(--fs-1); color: var(--accent); flex: 0 0 auto; }
.cal-event .ce-main { flex: 1 1 auto; min-width: 0; }
.cal-event .ce-title { font-weight: 600; color: var(--text); word-break: break-word; }
.cal-event .ce-note { font-size: var(--fs-1); color: var(--muted); word-break: break-word; }
.cal-event .ce-del { flex: 0 0 auto; border: none; background: transparent; color: var(--muted); cursor: pointer; }
.cal-event .ce-del:hover { color: var(--down); }
.cal-cell .cc-events { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.cal-cell .cc-events i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.cs-add { width: 100%; margin-bottom: 10px; }
.cal-ev-head {
  font-size: var(--fs-1); font-weight: 700; color: var(--muted);

.cal-side .cs-add { margin-top: 10px; }

/* ==========================================================================
 * W2 · 知识内容（B1 反链上下文 / B2 每日笔记 / B4 全局检索）

  -webkit-box-orient: vertical; overflow: hidden;
}
.mention-panel { grid-column: 1 / -1; }
.mention-item {
  padding: 8px 10px; margin-bottom: 6px; border-radius: 8px;

}

.mi-title { font-size: var(--fs-2); font-weight: 600; color: var(--text); }
.mi-snippet { font-size: var(--fs-1); color: var(--muted); margin: 4px 0 6px; word-break: break-word; }

.cs-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.cs-actions .cs-add { width: auto; flex: 1 1 auto; margin-bottom: 10px; }
.daily-page .toolbar { flex-wrap: wrap; align-items: center; }

.dl-head { margin: 4px 0 18px; }

.dl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.dl-col {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--r);
  padding: 14px 16px; min-width: 0;
}
.dl-col-h {
  font-size: var(--fs-1); font-weight: 700; color: var(--muted);

}
.dl-row {
  display: flex; align-items: flex-start; gap: 8px; padding: 6px 0;
  border-top: 1px solid var(--border); font-size: var(--fs-2); color: var(--text);

.dl-row:first-of-type { border-top: 0; }
.dl-ic { flex: 0 0 18px; color: var(--accent); text-align: center; }
.dl-t { min-width: 0; word-break: break-word; }
.dl-empty, .dl-note {
  font-size: var(--fs-2); color: var(--muted); padding: 8px 0; line-height: 1.6;
}
.dl-note {
  display: block; width: 100%; text-align: left; background: transparent;

  margin-top: 14px; font-size: var(--fs-2); color: var(--muted);

/* ---- B4 全局检索面板 ---- */
#global-search { display: inline-flex; }
.modal.wide { max-width: 640px; }
.gs-wrap { display: flex; flex-direction: column; gap: 10px; }
.gs-input { font-size: var(--fs-5); padding: 10px 12px; }
.gs-meta { font-size: var(--fs-1); color: var(--muted); min-height: 16px; }

.gs-group {

  letter-spacing: .04em; margin: 12px 0 4px; padding-bottom: 4px;

}
.gs-item {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: transparent; border: none; border-radius: 8px; padding: 8px 10px;
  transition: background .16s var(--ease);
}
.gs-item:hover { background: var(--panel2); }
.gs-item-t { font-size: var(--fs-3); font-weight: 600; color: var(--text); word-break: break-word; }
.gs-item-s { font-size: var(--fs-1); color: var(--muted); margin-top: 3px; word-break: break-word; }
.gs-item mark, .gs-results mark {
  background: var(--accent-soft); color: var(--accent); padding: 0 2px; border-radius: 3px;
}
@media (max-width: 700px) { .modal.wide { max-width: 100%; } }

/* ============ W3 · 视觉与动效（C2 微交互一致性 + C4 数据可视化） ============
 * huashu 一致性自律：一套色板（仅用既有令牌）、一种画风（.22–.62s ease-out、
 * 位移 ≤8px；不做弹跳/旋转/视差/常驻闪烁/随机色）；reduce 下全部归零。
 * ========================================================================= */
@media (prefers-reduced-motion: no-preference) {

  /* ---- C2 · 反馈一致性：统一焦点环、按压、可读的悬停 ---- */
  .btn:focus-visible, .icon-btn:focus-visible, .nav-item:focus-visible,
  .input:focus-visible, .search:focus-visible, .gs-item:focus-visible,
  .empty-state-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .btn:not(:disabled) {
    transition: transform .12s var(--ease), background .16s var(--ease),
                border-color .16s var(--ease), color .16s var(--ease);
  }
  .btn:not(:disabled):active { transform: translateY(1px); }
  .btn.primary:not(:disabled):hover { filter: brightness(1.06); }

  /* ---- C4-a · 热力图：按列波浪点亮（--hm-wi 由 heatmap.render 写入） ---- */
  .hm-cols .hy-cell[data-date] {
    animation: w3-cell-in .34s var(--ease) both;
    animation-delay: calc(var(--hm-wi, 0) * 13ms);
  }
  @keyframes w3-cell-in {
    from { opacity: 0; transform: scale(.6); }
    to   { opacity: 1; transform: none; }
  }
  .hm-cols .hy-cell.is-today {
    animation: w3-cell-in .34s var(--ease) both, w3-today 1.2s var(--ease) .42s 1;
    animation-delay: calc(var(--hm-wi, 0) * 13ms), .42s;
  }
  @keyframes w3-today {
    0%, 100% { box-shadow: 0 0 0 1.5px var(--accent); }
    50%      { box-shadow: 0 0 0 4px var(--accent-soft); }
  }
  /* 权威统计数字：统一无延迟淡入，不做交错隐藏、不做数值缓动，
   * 避免用户短暂看到空白或偏小的错误值（huashu「为动而动」自查结论） */
  .hm-stats .hs-num, .graph-stats .gs b {
    animation: w3-rise .4s var(--ease) both;
  }
  @keyframes w3-rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---- C4-b · 图谱：边生长 + 节点淡入（不改 transform，避免覆盖 translate） ---- */
  .graph-canvas .g-edge {
    stroke-dasharray: var(--g-len, 200);
    stroke-dashoffset: var(--g-len, 200);
    animation: w3-edge-in .6s var(--ease) forwards;
    animation-delay: calc(var(--motion-i, 0) * var(--motion-step, 22ms));
  }
  @keyframes w3-edge-in { to { stroke-dashoffset: 0; } }
  .graph-canvas .g-node {
    animation: w3-fade .42s var(--ease) both;
    animation-delay: calc(var(--motion-i, 0) * var(--motion-step, 22ms));
  }
  @keyframes w3-fade { from { opacity: 0; } to { opacity: 1; } }
}

    animation: none !important;
    transition: none !important;
  }
  .graph-canvas .g-edge {
    stroke-dasharray: none !important;
    stroke-dashoffset: 0 !important;
  }
}

      d.setDate(d.getDate() - n);
      const off = d.getTimezoneOffset() * 60000;
      return new Date(d.getTime() - off).toISOString().slice(0, 10);
    },

    /* 友好日期：今天 / 昨天 / MM-DD */
    fmtDate(s) {
      if (!s) return '';
      if (s === utils.todayStr()) return '今天';
      if (s === utils.dateStrOffset(1)) return '昨天';
      return s.slice(5);
    },

    /* 星期几 */
    weekday(s) {
      const d = new Date(s + 'T00:00:00');
      return ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
    },

    /* 时间戳 / Date → 本地时区 YYYY-MM-DD（与 stats.activity 口径一致）。
     * W2 起供 Daily Notes、全局检索等复用，避免各处重复实现时区逻辑。 */
    dateKey(ts) {
      const d = ts instanceof Date ? ts : new Date(ts);
      if (isNaN(d.getTime())) return '';
      const off = d.getTimezoneOffset() * 60000;
      return new Date(d.getTime() - off).toISOString().slice(0, 10);
    },

    /* 中文完整日期：YYYY年M月D日 · 周X
     * 原生 input[type=date] 会按浏览器 UI 语言显示 mm/dd/yyyy，中文用户容易读错；
     * 表单里用它做实时回显，既不牺牲原生控件的可访问性与校验，又消除格式歧义。 */
    cnDate(s) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s || ''))) return '';
      const d = new Date(s + 'T00:00:00');
      if (isNaN(d.getTime())) return '';
      return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 · 周' + utils.weekday(s);
    },

    /* HTML 转义 */
    escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    },

    /* URL 协议白名单：只放行 http(s)/mailto/相对路径/锚点。
     * 用于任何会被写进 href 的外部内容（Markdown 链接、知识库来源 URL 等）。
     * 先剔除空白与控制字符再判协议，防 "java\nscript:" 之类绕过。 */
    safeUrl(raw) {
      const s = String(raw == null ? '' : raw).trim();
      if (!s) return '';
      const compact = s.replace(/[\u0000-\u0020\u007f]/g, '');
      if (/^(javascript|data|vbscript|file|blob|about):/i.test(compact)) return '#';
      if (/^https?:\/\//i.test(compact) || /^mailto:/i.test(compact)) return s;
      if (/^(\/|\.\/|\.\.\/|#|\?)/.test(s)) return s;
      if (!/^[a-zA-Z][a-zA-Z0-9+.\-]*:/.test(compact) && !/[\u0000-\u001f]/.test(s)) return s;
      return '#';
    },

    /* 颜色白名单：只允许 #hex，避免不可信数据打断 style 属性 */
    safeColor(raw, fallback) {
      const s = String(raw == null ? '' : raw).trim();
      return /^#[0-9a-fA-F]{3,8}$/.test(s) ? s : (fallback || '#176c6b');
    },

    /* 极简 Markdown -> HTML（标题/加粗/斜体/行内代码/列表/引用/链接/换行） */
    markdown(src) {
      if (!src) return '';
      const esc = utils.escapeHtml;
      const lines = esc(src).split('\n');
      let html = '';
      let inList = false;
      let inQuote = false;
      const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
      const closeQuote = () => { if (inQuote) { html += '</blockquote>'; inQuote = false; } };

      for (let raw of lines) {
        let line = raw;
        if (/^\s*###\s+/.test(line)) { closeList(); closeQuote(); html += '<h3>' + line.replace(/^\s*###\s+/, '') + '</h3>'; continue; }
        if (/^\s*##\s+/.test(line)) { closeList(); closeQuote(); html += '<h2>' + line.replace(/^\s*##\s+/, '') + '</h2>'; continue; }
        if (/^\s*#\s+/.test(line)) { closeList(); closeQuote(); html += '<h1>' + line.replace(/^\s*#\s+/, '') + '</h1>'; continue; }
        if (/^\s*>\s?/.test(line)) { closeList(); if (!inQuote) { html += '<blockquote>'; inQuote = true; } html += '<p>' + line.replace(/^\s*>\s?/, '') + '</p>'; continue; }
        if (/^\s*[-*]\s+/.test(line)) { closeQuote(); if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + line.replace(/^\s*[-*]\s+/, '') + '</li>'; continue; }
        if (/^\s*$/.test(line)) { closeList(); closeQuote(); continue; }
        closeList(); closeQuote();
        html += '<p>' + line + '</p>';
      }
      closeList(); closeQuote();

      // 行内：加粗、斜体、行内代码、普通链接
      html = html
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (m, label, url) {
          return '<a href="' + utils.safeUrl(url) + '" target="_blank" rel="noopener">' + label + '</a>';
        });
      // Obsidian 风格 [[双向链接]] / [[目标|显示文本]]（放在最后，避免被上面的行内规则误伤）
      html = html.replace(/\[\[([^\]]+)\]\]/g, function (m, inner) {
        const p = inner.split('|');
        const target = p[0].trim();
        const label = (p[1] || p[0]).trim();
        if (!target) return m;
        return '<a href="#" class="wikilink" data-wiki="' + target + '">' + label + '</a>';
      });
      return html;
    },

    /* toast 轻提示 */
    toast(msg, type) {
      let el = document.getElementById('toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'toast';
        el.className = 'toast';
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.className = 'toast show' + (type ? ' toast-' + type : '');
      clearTimeout(el._t);
      el._t = setTimeout(() => { el.className = 'toast'; }, 2200);
    },

    /* 通用模态框
     * opts: { title, bodyHTML, onMount(root), onClose, wide? }
     * wide=true 时用更宽的容器（全局检索等结果面板），默认宽度不变。
     * 返回 close 函数
     */
    modal(opts) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML =
        '<div class="modal' + (opts.wide ? ' wide' : '') + '">' +
        '  <div class="modal-head"><span class="modal-title">' + utils.escapeHtml(opts.title || '') + '</span>' +
        '    <button class="modal-close" aria-label="关闭">×</button></div>' +
        '  <div class="modal-body">' + (opts.bodyHTML || '') + '</div>' +
        '</div>';
      document.body.appendChild(overlay);

      let closed = false;
      const close = () => {
        if (closed) return;
        closed = true;
        document.removeEventListener('keydown', onKey, true);
        overlay.classList.remove('show');
        setTimeout(() => overlay.remove(), 160);
        if (opts.onClose) opts.onClose();
      };
      overlay.querySelector('.modal-close').addEventListener('click', close);
      overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });

      /* 键盘契约：ESC 关闭、输入框内 Enter 提交主操作、打开后自动聚焦。
       * 只对最上层弹窗生效；确认框刻意不接 Enter，避免回车误触删除/覆盖。 */
      function onKey(e) {
        const all = document.querySelectorAll('.modal-overlay.show');
        if (all.length && all[all.length - 1] !== overlay) return;
        if (e.key === 'Escape') { e.preventDefault(); close(); return; }
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !e.ctrlKey && !e.metaKey) {
          const t = e.target;
          if (t && (/^(TEXTAREA|SELECT|BUTTON|A)$/.test(t.tagName) || t.isContentEditable)) return;
          const submit = overlay.querySelector('[data-act="save"], .modal-actions .btn.primary');
          if (submit) { e.preventDefault(); submit.click(); }
        }
      }
      document.addEventListener('keydown', onKey, true);

      if (opts.onMount) opts.onMount(overlay.querySelector('.modal-body'), close);
      requestAnimationFrame(() => {
        overlay.classList.add('show');
        const first = overlay.querySelector('input:not([type="hidden"]):not([type="file"]), textarea, select');
        if (first) { try { first.focus({ preventScroll: true }); } catch (_) { first.focus(); } }
      });
      return close;
    },

    /* 确认对话框，返回 Promise<boolean> */
    confirm(text, okText) {
      return new Promise((resolve) => {
        let resolved = false;
        const close = utils.modal({
          title: '请确认',
          bodyHTML: '<p class="confirm-text">' + utils.escapeHtml(text) + '</p>' +
            '<div class="modal-actions"><button class="btn ghost" data-act="cancel">取消</button>' +
            '<button class="btn danger" data-act="ok">' + utils.escapeHtml(okText || '确定') + '</button></div>',
          onMount(root, c) {
            root.querySelector('[data-act="cancel"]').addEventListener('click', () => { resolved = true; c(); resolve(false); });
            root.querySelector('[data-act="ok"]').addEventListener('click', () => { resolved = true; c(); resolve(true); });
          },
          onClose() { if (!resolved) resolve(false); }
        });
      });
    },

    /* 防抖 */
    debounce(fn, ms) {
      let t;
      return function () {
        const args = arguments, ctx = this;
        clearTimeout(t);
        t = setTimeout(() => fn.apply(ctx, args), ms);
      };
    },

    /* =====================================================================
     * W3 · 统一动效工具（C2 / C4）
     * 原则：一套节奏（ease-out、≤620ms、位移 ≤8px）、尊重 prefers-reduced-motion。
     * 所有数据动效都经由此处，避免各模块各写一套 rAF / matchMedia。
     * ===================================================================== */

    /* 是否允许动效：无 matchMedia 时保守视为允许；reduce 时一律关闭 */
    motionOK() {
      try {
        if (typeof window === 'undefined' || typeof window.matchMedia !== 'function') return true;
        return !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      } catch (_) { return true; }
    },

    /* 数字缓动：reduce / 无 rAF / 终值为 0 时直接落终值，绝不把真实值改成 0。
     * W3 决策：仅作为公共能力保留并单测覆盖；**不挂载到统计卡片**——
     * 统计数字是权威数据，动画成中间值会短暂误导用户（见 handoff W3）。 */
    countUp(el, to, ms) {
      if (!el) return;
      const end = Number(to) || 0;
      const dur = Number(ms) || 560;
      if (!utils.motionOK() || typeof window === 'undefined' ||
          typeof window.requestAnimationFrame !== 'function' || end <= 0) {
        el.textContent = String(end);
        return;
      }
      const t0 = (typeof performance !== 'undefined' && performance.now)
        ? performance.now() : Date.now();
      const tick = (now) => {
        const t = Math.min(1, (now - t0) / dur);
        const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
        el.textContent = String(Math.round(end * eased));
        if (t < 1) window.requestAnimationFrame(tick);
        else el.textContent = String(end); // 收敛到精确终值
      };
      window.requestAnimationFrame(tick);
    },

    /* 交错：写入序号变量（默认 --motion-i，可传 --hm-wi 等自定义名）与
     * --motion-step（延迟步长），供 CSS calc 使用；cap 控制序号上限。
     * 这是 W3 所有「交错动效」的唯一来源。 */
    stagger(nodes, stepMs, varName, cap) {
      const step = Number(stepMs) || 0;
      const name = varName || '--motion-i';
      const limit = Number(cap) || 40;
      Array.prototype.forEach.call(nodes || [], (n, i) => {
        if (!n || !n.style) return;
        n.style.setProperty(name, String(Math.min(i, limit)));
        n.style.setProperty('--motion-step', step + 'ms');
      });
    }
  };

  L.utils = utils;

  /* 极简事件总线 */
  L.bus = (function () {
    const map = {};
    return {
      on(evt, cb) { (map[evt] = map[evt] || []).push(cb); },
      emit(evt, data) { (map[evt] || []).forEach((cb) => cb(data)); }
    };
  })();

  /* =====================================================================
   * PetOS · 桌宠伙伴内核（白皮书 9 大概念落到 LifeOS 的公共逻辑层）
   * ---------------------------------------------------------------------
   * 设计纪律（与工程防御一一对齐）：
   *   1. 不新增顶层实体键、不新增源文件、不新增导航项 —— 守住 W2/W3 不变量；
   *   2. 状态存独立 localStorage key，与 tasks/notes 等主数据解耦，
   *      宠物配置损坏也不影响主数据（故障隔离）；
   *   3. 渲染层只调 L.pet 的纯 API，browser/electron 无感（对齐 bridge 思路）；
   *   4. 危险操作强制走「子宠物申请 → 主控点头」双阶段（点头原则），
   *      且每阶段带 trace-id，便于审计（对齐 social-gateway Trace ID）。
   * ===================================================================== */
  L.pet = (function () {
    'use strict';
    const KEY = 'lifeos-pet-v1';

    /* 装备 = 专家系统：戴上什么就是什么专家（概念 4） */
    const EQUIPMENT = [
      { id: 'none',    name: '通用伙伴', glyph: '◇', role: '陪你聊天、提醒、随手整理', needNod: false },
      { id: 'scholar', name: '学者帽',   glyph: '▰', role: '检索知识库、引用来源、建双向链接', needNod: false },
      { id: 'cleaner', name: '清道夫',   glyph: '✚', role: '清理重复与过期条目（删除需点头）', needNod: true },
      { id: 'banker',  name: '庄家领结', glyph: '◆', role: '拆解任务、派发给多 Agent 团队', needNod: false },
      { id: 'twin',    name: '分身面具', glyph: '☯', role: '注入你的习惯偏好，越用越懂你', needNod: false }
    ];

    /* 数字分身的习惯探针（概念 8）：只在真实行为发生时命中，不凭空编造偏好 */
    const HABITS = [
      { id: 'linker',    text: '喜欢把知识连成网络',       test: (s) => s.links >= 3 },
      { id: 'organizer', text: '热衷把知识长成小屋',       test: (s) => s.houseBuilds >= 1 },
      { id: 'delegator', text: '习惯派发任务给 Agent 团队', test: (s) => s.delegations >= 2 },
      { id: 'cautious',  text: '重视危险操作的授权确认',   test: (s) => s.nods >= 1 },
      { id: 'night',     text: '常在夜深时工作',           test: (s) => s.nightHours >= 2 },
      { id: 'curious',   text: '爱追问与复盘',             test: (s) => s.chats >= 5 }
    ];

    function defaults() {
      return {
        v: 1,
        pets: [
          { id: 'p-main',   name: '小屿', glyph: '◕', tint: 'teal',  role: '主控 · 通用伙伴', equip: 'none' },
          { id: 'p-clean',  name: '阿净', glyph: '✚', tint: 'amber', role: '回收站清道夫',     equip: 'cleaner' },
          { id: 'p-scholar',name: '阿博', glyph: '▰', tint: 'violet',role: '知识整理',        equip: 'scholar' }
        ],
        activeId: 'p-main',
        stats: { links: 0, houseBuilds: 0, delegations: 0, nods: 0, nightHours: 0, chats: 0, feeds: 0, pets: 0, approvalsDenied: 0 },
        lastInteractAt: 0,
        inbox: [
          { id: 'm1', from: '@阿澈的宠物', text: '把你上次整理的「双写灰度」链接给我好吗？', status: '已校验' },
          { id: 'm2', from: '@Mira 的庄家', text: '本周复盘模板已同步，可在多端查看。', status: '已校验' }
        ]
      };
    }

    function db() {
      if (L.storage && L.storage.getItem) return L.storage;
      if (typeof localStorage !== 'undefined' && localStorage && localStorage.getItem) return localStorage;
      return null;
    }

    let _s = null;

    function load() {
      const D = db();
      let raw = null;
      if (D) { try { raw = D.getItem(KEY); } catch (_) { /* 无存储权限时静默降级 */ } }
      let parsed = null;
      if (raw) { try { parsed = JSON.parse(raw); } catch (_) { /* 损坏则重置，不污染主数据 */ } }
      const def = defaults();
      if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.pets) || !parsed.pets.length) {
        _s = def;
      } else {
        // 逐字段收敛：只信任结构正确的字段，其余回落默认值（防脏数据）
        _s = {
          v: 1,
          pets: parsed.pets.filter((p) => p && typeof p.id === 'string' && typeof p.name === 'string')
            .slice(0, 64).map((p) => ({
              id: String(p.id).slice(0, 64), name: String(p.name).slice(0, 40),
              glyph: String(p.glyph || '◕').slice(0, 4),
              tint: ['teal', 'amber', 'violet'].indexOf(p.tint) >= 0 ? p.tint : 'teal',
              role: String(p.role || '伙伴').slice(0, 60),
              equip: EQUIPMENT.some((e) => e.id === p.equip) ? p.equip : 'none'
            })),
          activeId: typeof parsed.activeId === 'string' ? parsed.activeId : 'p-main',
          stats: Object.assign(def.stats, parsed.stats && typeof parsed.stats === 'object' ? parsed.stats : {}),
          lastInteractAt: typeof parsed.lastInteractAt === 'number' && parsed.lastInteractAt > 0 ? parsed.lastInteractAt : 0,
          inbox: Array.isArray(parsed.inbox) ? parsed.inbox.slice(0, 20).filter((m) => m && typeof m.text === 'string') : def.inbox
        };
        if (!_s.pets.length) _s = def;
        if (!_s.pets.some((p) => p.id === _s.activeId)) _s.activeId = _s.pets[0].id;
      }
      // 首次加载（无有效存档）即落库：配置与故障状态一并持久化，
      // 避免每次刷新重建默认值，也让「损坏回落」是可见、可恢复的。
      if (!raw) save();
      return _s;
    }

    function get() { if (!_s) load(); return _s; }

    function save() {
      const D = db();
      if (!D) return false;
      try { D.setItem(KEY, JSON.stringify(get())); return true; }
      catch (_) { return false; } // 配额不足不影响主功能
    }

    function update(fn) {
      const s = get();
      if (typeof fn === 'function') fn(s);
      save();
      if (L.bus && L.bus.emit) L.bus.emit('pet:changed', s);
      return s;
    }

    function activePet() {
      const s = get();
      return s.pets.filter((p) => p.id === s.activeId)[0] || s.pets[0] || null;
    }

    function setActive(id) {
      const s = get();
      if (!s.pets.some((p) => p.id === id)) return false;
      s.activeId = id; save();
      if (L.bus && L.bus.emit) L.bus.emit('pet:changed', s);
      return true;
    }

    function addPet(p) {
      const s = get();
      const name = String((p && p.name) || '新伙伴').slice(0, 40);
      const pet = {
        id: 'p-' + utils.uid(), name: name,
        glyph: String((p && p.glyph) || '✦').slice(0, 4),
        tint: ['teal', 'amber', 'violet'].indexOf(p && p.tint) >= 0 ? p.tint : 'teal',
        role: String((p && p.role) || '待分配任务').slice(0, 60), equip: 'none'
      };
      if (s.pets.length >= 64) return null; // 上限保护，防无限膨胀
      s.pets.push(pet); save();
      if (L.bus && L.bus.emit) L.bus.emit('pet:changed', s);
      return pet;
    }

    function equip(petId, equipId) {
      if (!EQUIPMENT.some((e) => e.id === equipId)) return false;
      const s = get();
      const pet = s.pets.filter((p) => p.id === petId)[0];
      if (!pet) return false;
      pet.equip = equipId;
      const gear = EQUIPMENT.filter((e) => e.id === equipId)[0];
      pet.role = gear.name + ' · ' + gear.role;
      save();
      if (L.bus && L.bus.emit) L.bus.emit('pet:changed', s);
      return true;
    }

    function equipActive(equipId) {
      const p = activePet();
      return p ? equip(p.id, equipId) : false;
    }

    /* 观察行为 → 沉淀数字分身（概念 8）。只统计真实发生的行为。 */
    function observe(kind) {
      const map = {
        link: 'links', house: 'houseBuilds', delegate: 'delegations',
        nod: 'nods', feed: 'feeds', chat: 'chats'
      };
      const s = get();
      if (kind === 'night') {
        const h = new Date().getHours();
        if (h >= 22 || h < 6) s.stats.nightHours = (s.stats.nightHours || 0) + 1;
      } else if (map[kind]) {
        s.stats[map[kind]] = (s.stats[map[kind]] || 0) + 1;
      }
      save();
      return s.stats;
    }

    function userSkills() {
      const s = get();
      return HABITS.filter((h) => { try { return !!h.test(s.stats); } catch (_) { return false; } })
        .map((h) => h.text);
    }

    function traceId(prefix) {
      const p = String(prefix || 't');
      return p + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
    }

    /* 点头原则（概念 5）：把一次危险意图拆成两个不可跳过的阶段描述。
     * 纯函数，返回结构供渲染层使用；渲染层必须依次展示两阶段，
     * 任一阶段拒绝即整体拒绝。trace 用于事后审计。 */
    function approvalFlow(intent, base) {
      const i = intent || {};
      const trace = traceId('nod');
      const actor = activePet();
